<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account | YAN-FLOWS Commerce Platform</title>
  <meta name="description" content="Join YAN-FLOWS. Create your seller storefront or buyer account in seconds. Start selling or shopping today."/>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* ========================================
       YAN-FLOWS - SIGNUP PAGE STYLES
       Luxury Theme: Navy Blue + White + Accents
       ======================================== */
    :root {
      --navy: #1B3A5F;
      --navy-dark: #0F1F33;
      --navy-light: #2C5282;
      --white: #FFFFFF;
      --light-bg: #F8F9FA;
      --gray: #6C757D;
      --light-gray: #ADB5BD;
      --coral: #FF6B6B;
      --coral-hover: #EE5A5A;
      --teal: #4ECDC4;
      --teal-hover: #3DBDB4;
      --gold: #FFD93D;
      --danger: #FF4757;
      --warning: #FFA502;
      --success: #2ED573;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --shadow-md: 0 4px 20px rgba(27, 58, 95, 0.12);
      --shadow-lg: 0 8px 40px rgba(27, 58, 95, 0.18);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-full: 9999px;
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 2rem;
      --space-lg: 4rem;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--light-bg) 0%, #E8EDF2 100%);
      color: var(--navy);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { text-decoration: none; color: inherit; transition: var(--transition); }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select { font-family: inherit; }

    /* ===== NAVBAR ===== */
    .navbar {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--space-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--navy), var(--teal));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-weight: 700;
      font-size: 1rem;
    }    .nav-link {
      font-weight: 500;
      color: var(--gray);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-full);
    }
    .nav-link:hover { color: var(--navy); background: rgba(27,58,95,0.05); }

    /* ===== MAIN LAYOUT ===== */
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md) var(--space-sm);
    }
    .auth-card {
      background: var(--white);
      width: 100%;
      max-width: 520px;
      padding: var(--space-md);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      text-align: center;
      animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header h1 {
      font-size: 1.75rem;
      margin-bottom: 0.25rem;
      color: var(--navy-dark);
    }
    .auth-header p {
      color: var(--gray);
      margin-bottom: var(--space-md);
      font-size: 0.95rem;
    }

    /* ===== FORM ELEMENTS ===== */
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
      position: relative;
    }
    .form-label {      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: var(--navy);
    }
    .input-wrapper { position: relative; }
    .form-input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid #E2E8F0;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      transition: var(--transition);
      background: var(--light-bg);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--teal);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.15);
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      cursor: pointer;
      font-size: 1.1rem;
      transition: var(--transition);
    }
    .toggle-password:hover { color: var(--navy); }

    /* ===== ROLE SELECTOR ===== */
    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .role-option {
      border: 2px solid #E2E8F0;
      border-radius: var(--radius-sm);
      padding: 1rem;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      position: relative;
    }    .role-option:hover { border-color: var(--navy-light); background: var(--light-bg); }
    .role-option.active {
      border-color: var(--teal);
      background: rgba(78, 205, 196, 0.08);
      box-shadow: 0 0 0 2px rgba(78, 205, 196, 0.2);
    }
    .role-option i { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--navy); }
    .role-option.active i { color: var(--teal); }
    .role-option h4 { font-size: 0.95rem; margin-bottom: 0.25rem; }
    .role-option p { font-size: 0.8rem; color: var(--gray); margin: 0; }
    .role-option .check-mark {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      background: var(--teal);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.7rem;
      opacity: 0;
      transform: scale(0);
      transition: var(--transition);
    }
    .role-option.active .check-mark { opacity: 1; transform: scale(1); }

    /* ===== PASSWORD STRENGTH ===== */
    .password-strength {
      height: 4px;
      background: #E2E8F0;
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
      transition: var(--transition);
    }
    .strength-bar {
      height: 100%;
      width: 0;
      border-radius: 2px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    .strength-text {
      font-size: 0.8rem;
      margin-top: 0.25rem;
      font-weight: 500;
      color: var(--gray);
    }
    /* ===== BUTTONS & DIVIDER ===== */
    .btn {
      width: 100%;
      padding: 1rem;
      font-weight: 600;
      font-size: 1rem;
      border-radius: var(--radius-full);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .btn-primary {
      background: var(--coral);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }
    .btn-primary:hover {
      background: var(--coral-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: var(--light-gray);
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E2E8F0;
    }
    .divider span { padding: 0 1rem; }

    .btn-google {
      background: var(--white);
      border: 2px solid #E2E8F0;
      color: var(--navy);    }
    .btn-google:hover {
      background: var(--light-bg);
      border-color: var(--navy-light);
    }

    .terms {
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .terms input { accent-color: var(--navy); margin-right: 0.5rem; }
    .terms a { color: var(--teal); font-weight: 500; text-decoration: underline; }

    .auth-footer {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--gray);
    }
    .auth-footer a {
      color: var(--teal);
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    /* ===== TOAST NOTIFICATION ===== */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: var(--white);
      padding: 1rem 1.25rem;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 280px;
      transform: translateX(120%);
      transition: transform 0.3s ease;
      border-left: 4px solid var(--coral);
    }
    .toast.success { border-left-color: var(--teal); }    .toast.show { transform: translateX(0); }
    .toast-icon { font-size: 1.25rem; }
    .toast.success .toast-icon { color: var(--teal); }
    .toast.error .toast-icon { color: var(--coral); }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--gray);
      font-size: 0.85rem;
      background: var(--white);
      border-top: 1px solid #E2E8F0;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .auth-card { padding: 1.5rem 1.25rem; }
      h1 { font-size: 1.5rem !important; }
      .role-selector { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">YF</div>
        YAN-FLOWS
      </a>
      <a href="index.html" class="nav-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </nav>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main Content -->
  <main class="main-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create Your Account</h1>
        <p>Join thousands of sellers & buyers on YAN-FLOWS</p>
      </div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label class="form-label">Full Name</label>          <input type="text" id="fullName" class="form-input" placeholder="John Doe" required autocomplete="name"/>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email"/>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="new-password"/>
            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
          </div>
          <div class="password-strength">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <div class="strength-text" id="strengthText"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required autocomplete="new-password"/>
          </div>
        </div>

        <label class="form-label" style="margin-bottom:0.75rem;">I want to join as:</label>
        <div class="role-selector">
          <div class="role-option active" data-role="buyer" onclick="selectRole('buyer')">
            <div class="check-mark"><i class="fas fa-check"></i></div>
            <i class="fas fa-shopping-bag"></i>
            <h4>Buyer</h4>
            <p>Browse & purchase products</p>
          </div>
          <div class="role-option" data-role="seller" onclick="selectRole('seller')">
            <div class="check-mark"><i class="fas fa-check"></i></div>
            <i class="fas fa-store"></i>
            <h4>Seller</h4>
            <p>Open store & manage sales</p>
          </div>
        </div>

        <div class="terms">
          <label style="display:flex;align-items:flex-start;gap:0.5rem;cursor:pointer;">
            <input type="checkbox" id="termsCheck" required style="margin-top:4px; accent-color:var(--navy);"/>
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary" id="signupBtn">
          <i class="fas fa-user-plus"></i>
          <span>Create Account</span>
        </button>
      </form>

      <div class="divider"><span>or sign up with</span></div>

      <button class="btn btn-google" id="googleSignupBtn">
        <i class="fab fa-google"></i>
        <span>Google Account</span>
      </button>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log in here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2026 YAN-FLOWS. Secure registration powered by Firebase.
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Page Script -->
  <script>
    // ===== FIREBASE INITIALIZATION =====
    const firebaseConfig = {
      apiKey: "AIzaSyBJ4t5SDaryYcjIzG737tLPNIwXRnL9Qlc",
      authDomain: "yan-flow.firebaseapp.com",
      projectId: "yan-flow",
      storageBucket: "yan-flow.firebasestorage.app",
      messagingSenderId: "373204559623",
      appId: "1:373204559623:web:56e1c8abf07945c53187a2",
      measurementId: "G-4PC6ENND61"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ===== DOM ELEMENTS =====
    const signupForm = document.getElementById('signupForm');
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('email');    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const signupBtn = document.getElementById('signupBtn');
    const googleBtn = document.getElementById('googleSignupBtn');
    const togglePass = document.getElementById('togglePassword');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');
    const toastContainer = document.getElementById('toastContainer');
    const termsCheck = document.getElementById('termsCheck');

    let selectedRole = 'buyer';

    // ===== CHECK AUTH STATE =====
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.replace('dashboard.html');
      }
    });

    // ===== TOAST SYSTEM =====
    function showToast(message, type = 'error') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="toast-icon fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i><span>${message}</span>`;
      toastContainer.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // ===== ROLE SELECTION =====
    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.role === role);
      });
    }

    // ===== PASSWORD VISIBILITY =====
    togglePass.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      togglePass.classList.toggle('fa-eye');
      togglePass.classList.toggle('fa-eye-slash');
    });

    // ===== PASSWORD STRENGTH METER =====
    passwordInput.addEventListener('input', () => {      const val = passwordInput.value;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const levels = [
        { width: '0%', color: '#E2E8F0', text: '' },
        { width: '25%', color: '#FF4757', text: 'Weak' },
        { width: '50%', color: '#FFA502', text: 'Fair' },
        { width: '75%', color: '#2ED573', text: 'Good' },
        { width: '100%', color: '#1B3A5F', text: 'Strong' }
      ];

      const level = levels[score];
      strengthBar.style.width = level.width;
      strengthBar.style.backgroundColor = level.color;
      strengthText.textContent = level.text;
      strengthText.style.color = level.color;
    });

    // ===== GENERATE REFERRAL CODE =====
    function generateRefCode() {
      return 'YF' + Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    // ===== FORM SUBMISSION =====
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = fullNameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirm = confirmInput.value;

      // Validation
      if (!name || !email || !password || !confirm) {
        showToast('Please fill in all fields.', 'error');
        return;
      }
      if (password.length < 8) {
        showToast('Password must be at least 8 characters.', 'error');
        return;
      }
      if (password !== confirm) {
        showToast('Passwords do not match.', 'error');
        return;
      }
      if (!termsCheck.checked) {        showToast('You must agree to the Terms & Privacy Policy.', 'error');
        return;
      }

      // UI Loading
      signupBtn.disabled = true;
      signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

      try {
        // 1. Firebase Auth Creation
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const uid = cred.user.uid;

        // 2. Update Profile Display Name
        await cred.user.updateProfile({ displayName: name });

        // 3. Prepare User Data
        const refCode = generateRefCode();
        const urlParams = new URLSearchParams(window.location.search);
        const referredBy = urlParams.get('ref') || null;

        const userData = {
          uid,
          name,
          email,
          role: selectedRole,
          coins: 10, // Free starter coins
          referralCode: refCode,
          referredBy,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          businessActive: selectedRole === 'seller' ? false : null,
          status: 'active'
        };

        // 4. Save to Firestore
        await db.collection('users').doc(uid).set(userData);

        // 5. Handle Referral Bonus (if applicable)
        if (referredBy) {
          const refQuery = await db.collection('users').where('referralCode', '==', referredBy).get();
          if (!refQuery.empty) {
            const refUserDoc = refQuery.docs[0];
            const refUid = refUserDoc.id;
            // Add 20 coins to referrer
            await db.collection('users').doc(refUid).update({
              coins: firebase.firestore.FieldValue.increment(20)
            });
            // Log referral bonus
            await db.collection('referral_bonuses').add({
              referrerId: refUid,              newUserUid: uid,
              coinsAwarded: 20,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        }

        showToast('Account created successfully! 🎉', 'success');

        // 6. Route based on role
        setTimeout(() => {
          if (selectedRole === 'seller') {
            window.location.href = 'seller-setup.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 1200);

      } catch (error) {
        console.error('Signup Error:', error);
        let msg = 'Registration failed. Please try again.';
        if (error.code === 'auth/email-already-in-use') msg = 'Email already registered. Try logging in.';
        if (error.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
        if (error.code === 'auth/weak-password') msg = 'Password is too weak. Use 8+ characters with numbers/symbols.';
        showToast(msg, 'error');
      } finally {
        signupBtn.disabled = false;
        signupBtn.innerHTML = '<i class="fas fa-user-plus"></i> <span>Create Account</span>';
      }
    });

    // ===== GOOGLE SIGNUP =====
    googleBtn.addEventListener('click', async () => {
      googleBtn.disabled = true;
      googleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting...';
      
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        
        const uid = result.user.uid;
        const isNewUser = result.additionalUserInfo.isNewUser;
        
        if (isNewUser) {
          // First time Google user: create Firestore doc
          const refCode = generateRefCode();
          await db.collection('users').doc(uid).set({
            uid,
            name: result.user.displayName || 'Google User',
            email: result.user.email,            role: 'buyer',
            coins: 10,
            referralCode: refCode,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            businessActive: null,
            status: 'active'
          });
        }
        
        showToast(isNewUser ? 'Welcome to YAN-FLOWS! 🎉' : 'Welcome back!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } catch (error) {
        console.error('Google Signup Error:', error);
        showToast('Google signup failed. Try again.', 'error');
      } finally {
        googleBtn.disabled = false;
        googleBtn.innerHTML = '<i class="fab fa-google"></i> <span>Google Account</span>';
      }
    });

    console.log('✅ YAN-FLOWS Signup Page Loaded');
    console.log('🔐 Firebase Auth + Firestore Ready');
    console.log('🚀 Next: seller-setup.html → dashboard.html');
  </script>

  <script src="app.js"></script>
</body>
</html>
