<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <style>
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D;
      --coral: #FF6B6B; --teal: #4ECDC4; --gold: #FFD93D;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --radius-sm: 8px; --radius-md: 16px;
      --transition: all 0.3s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); min-height: 100vh; padding: 2rem 1rem; }

    .checkout-container { max-width: 1000px; margin: 0 auto; }
    .page-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--white); display: flex; align-items: center; justify-content: center; color: var(--navy); text-decoration: none; box-shadow: var(--shadow-sm); transition: var(--transition); }
    .back-btn:hover { transform: translateY(-2px); }
    .page-title { font-size: 1.75rem; font-weight: 700; color: var(--navy); }

    .checkout-layout { display: grid; grid-template-columns: 1fr 400px; gap: 1.5rem; }

    /* Delivery Form */
    .delivery-section { background: var(--white); border-radius: var(--radius-md); padding: 2rem; box-shadow: var(--shadow-sm); }
    .section-title { font-size: 1.25rem; font-weight: 700; color: var(--navy); margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--light-bg); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 0; } .form-group.full { grid-column: 1 / -1; }
    .form-label { display: block; font-weight: 600; color: var(--navy); margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-input, .form-textarea { width: 100%; padding: 0.875rem 1rem; border: 2px solid #E5E7EB; border-radius: var(--radius-sm); font-size: 1rem; font-family: inherit; transition: var(--transition); background: var(--white); }
    .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.15); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .checkbox-wrapper { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; cursor: pointer; }
    .checkbox-wrapper input { width: 18px; height: 18px; accent-color: var(--teal); }
    .checkbox-wrapper span { color: var(--gray); font-size: 0.9rem; }

    /* Order Review */
    .review-section { background: var(--white); border-radius: var(--radius-md); padding: 2rem; box-shadow: var(--shadow-sm); height: fit-content; position: sticky; top: 2rem; }
    .review-item { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #E5E7EB; }
    .review-item:last-child { border-bottom: none; }
    .review-img { width: 60px; height: 60px; border-radius: var(--radius-sm); background: var(--light-bg); overflow: hidden; flex-shrink: 0; }
    .review-img img { width: 100%; height: 100%; object-fit: cover; }
    .review-details { flex: 1; }
    .review-name { font-weight: 600; color: var(--navy); margin-bottom: 0.25rem; }
    .review-qty { font-size: 0.85rem; color: var(--gray); }
    .review-price { font-weight: 700; color: var(--teal); }
    .summary-row { display: flex; justify-content: space-between; margin: 0.75rem 0; color: var(--gray); }
    .summary-row.total { font-size: 1.25rem; font-weight: 800; color: var(--navy); padding-top: 0.75rem; border-top: 2px solid var(--light-bg); margin-top: 0.75rem; }
    
    .place-order-btn { width: 100%; padding: 1.25rem; background: linear-gradient(135deg, #25D366, #128C7E); color: var(--white); border: none; border-radius: var(--radius-sm); font-size: 1.1rem; font-weight: 700; margin-top: 1.5rem; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 0.75rem; }
    .place-order-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    .place-order-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .place-order-btn .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: var(--white); border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
    .place-order-btn.loading .spinner { display: block; }
    .place-order-btn.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .payment-note { background: rgba(37, 211, 102, 0.1); border-left: 4px solid #25D366; padding: 1rem; border-radius: var(--radius-sm); margin-top: 1rem; font-size: 0.9rem; color: var(--gray); }
    .payment-note strong { color: #128C7E; display: block; margin-bottom: 0.25rem; }

    .yf-toast { position: fixed; top: 20px; right: 2rem; padding: 1rem 1.5rem; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 0.75rem; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 9999; opacity: 0; transform: translateX(100%); transition: all 0.3s ease; font-weight: 600; font-size: 0.9rem; }
    .yf-toast.show { opacity: 1; transform: translateX(0); }
    .yf-toast--success { background: #2ECC71; color: white; }
    .yf-toast--error { background: var(--coral); color: white; }

    @media (max-width: 768px) {
      .checkout-layout { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .review-section { position: static; }
    }
  </style>
</head>
<body>
  <div class="checkout-container">
    <div class="page-header">
      <a href="cart.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
      <h1 class="page-title">Checkout</h1>
    </div>

    <div class="checkout-layout">
      <div class="delivery-section">
        <h2 class="section-title">Delivery Information</h2>
        <form id="checkoutForm" onsubmit="return false;">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" id="fullName" class="form-input" placeholder="John Doe" required/>
            </div>
            <div class="form-group">
              <label class="form-label">Phone Number *</label>
              <input type="tel" id="phoneNumber" class="form-input" placeholder="08012345678" required/>
            </div>
            <div class="form-group full">
              <label class="form-label">Address Line 1 *</label>
              <input type="text" id="address1" class="form-input" placeholder="Street address" required/>
            </div>
            <div class="form-group full">
              <label class="form-label">Address Line 2</label>
              <input type="text" id="address2" class="form-input" placeholder="Apartment, suite, unit, etc."/>
            </div>
            <div class="form-group">
              <label class="form-label">City *</label>
              <input type="text" id="city" class="form-input" placeholder="Lagos" required/>
            </div>
            <div class="form-group">
              <label class="form-label">State *</label>
              <input type="text" id="state" class="form-input" placeholder="Lagos State" required/>
            </div>
            <div class="form-group full">
              <label class="form-label">Country *</label>
              <input type="text" id="country" class="form-input" placeholder="Nigeria" value="Nigeria" required/>
            </div>
            <div class="form-group full">
              <label class="form-label">Delivery Instructions</label>
              <textarea id="instructions" class="form-textarea" placeholder="Any special delivery instructions..."></textarea>
            </div>
          </div>
          <label class="checkbox-wrapper">
            <input type="checkbox" id="saveAddress" checked/>
            <span>Save this address for next time</span>
          </label>
        </form>
      </div>

      <div class="review-section">
        <h2 class="section-title">Order Summary</h2>
        <div id="orderItems"></div>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₦0</span>
        </div>
        <div class="summary-row">
          <span>Delivery</span>
          <span>Calculated by seller</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="total">₦0</span>
        </div>
        <button class="place-order-btn" id="placeOrderBtn" onclick="placeOrder()">
          <span class="btn-text">
            <i class="fab fa-whatsapp"></i> Place Order via WhatsApp
          </span>
          <div class="spinner"></div>
        </button>
        <div class="payment-note">
          <strong><i class="fas fa-info-circle"></i> Token Policy Info:</strong>
          Sellers are charged exactly 1 coin per processing order stream. New sellers enjoy 10 free verification balance tokens upon signup.
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBJ4t5SDaryYcjIzG737tLPNIwXRnL9Qlc",
      authDomain: "yan-flow.firebaseapp.com",
      projectId: "yan-flow",
      storageBucket: "yan-flow.firebasestorage.app",
      messagingSenderId: "373204559623",
      appId: "1:373204559623:web:56e1c8abf07945c53187a2"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function formatCurrency(amount) {
      return '₦' + Number(amount).toLocaleString('en-NG');
    }
    
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `yf-toast yf-toast--${type}`;
      toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i><span>${message}</span>`;
      document.body.appendChild(toast);      
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    let processingItems = [];
    let currentUser = null;
    let sellerProfiles = {};

    auth.onAuthStateChanged(async (user) => {
      currentUser = user;
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      await loadCheckout();
    });

    async function loadCheckout() {
      try {
        const subsetPayload = localStorage.getItem('yanflows_checkout_processing_items');
        if (subsetPayload) {
          try { processingItems = JSON.parse(subsetPayload); } catch (e) { processingItems = []; }
        }

        if (!processingItems || processingItems.length === 0) {
          showToast('No active transaction processing items found.', 'error');
          setTimeout(() => window.location.href = 'cart.html', 2000);
          return;
        }

        const sellerIds = [...new Set(processingItems.map(item => item.sellerId).filter(id => id))];
        
        for (const sellerId of sellerIds) {
          try {
            const profile = await db.collection('business_profiles').doc(sellerId).get();
            if (profile.exists) {
              sellerProfiles[sellerId] = profile.data();
            } else {
              setFallbackProfile(sellerId);
            }
          } catch (err) {
            setFallbackProfile(sellerId);
          }
        }

        if (currentUser) {
          try {
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            if (userDoc.exists && userDoc.data().savedAddress) {
              const addr = userDoc.data().savedAddress;
              document.getElementById('fullName').value = addr.fullName || '';
              document.getElementById('phoneNumber').value = addr.phoneNumber || '';
              document.getElementById('address1').value = addr.address1 || '';
              document.getElementById('address2').value = addr.address2 || '';
              document.getElementById('city').value = addr.city || '';
              document.getElementById('state').value = addr.state || '';
              document.getElementById('country').value = addr.country || 'Nigeria';
            }
          } catch (err) {}
        }

        renderOrderSummary();
      } catch (error) {
        console.error('Checkout error:', error);
      }
    }

    function setFallbackProfile(sellerId) {
      const item = processingItems.find(i => i.sellerId === sellerId);
      sellerProfiles[sellerId] = {
        businessName: item ? (item.sellerName || 'Vendor Platform') : 'Vendor Platform',
        whatsapp: '2348000000000',
        bankDetails: { bankName: 'Zenith Bank', accountNumber: '1010000000', accountName: 'Store Merchant' },
        customMessage: 'Please transfer context payment to verify shipping.',
        thankYouMessage: 'Thanks for ordering! 🙌'
      };
    }

    function renderOrderSummary() {
      const container = document.getElementById('orderItems');
      if (!container) return;
      
      let html = '';
      let total = 0;

      processingItems.forEach(item => {
        const itemTotal = (item.price || 0) * (item.quantity || 1);
        total += itemTotal;
        
        html += `
          <div class="review-item">
            <div class="review-img">
              <img src="${item.image || 'https://via.placeholder.com/60?text=Product'}" onerror="this.src='https://via.placeholder.com/60?text=Product'"/>
            </div>
            <div class="review-details">
              <div class="review-name">${item.name || 'Product'}</div>
              <div class="review-qty">Qty: ${item.quantity || 1} × ${formatCurrency(item.price || 0)}</div>
            </div>
            <div class="review-price">${formatCurrency(itemTotal)}</div>
          </div>
        `;
      });

      container.innerHTML = html;
      document.getElementById('subtotal').textContent = formatCurrency(total);
      document.getElementById('total').textContent = formatCurrency(total);
    }

    async function placeOrder() {
      const btn = document.getElementById('placeOrderBtn');
      
      const fullName = document.getElementById('fullName').value.trim();
      const phoneNumber = document.getElementById('phoneNumber').value.trim();
      const address1 = document.getElementById('address1').value.trim();
      const address2 = document.getElementById('address2').value.trim();
      const city = document.getElementById('city').value.trim();
      const state = document.getElementById('state').value.trim();
      const country = document.getElementById('country').value.trim();
      const instructions = document.getElementById('instructions').value.trim();
      const saveAddress = document.getElementById('saveAddress').checked;

      if (!fullName || !phoneNumber || !address1 || !city || !state || !country) {
        showToast('Please fill in required fields', 'error');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const targetSellerId = processingItems[0]?.sellerId;
        if (!targetSellerId) throw new Error("No distinct seller identification inside parameters.");

        const sellerCoinRef = db.collection('users').doc(targetSellerId);
        let clearToProceed = false;

        await db.runTransaction(async (transaction) => {
          const sellerDoc = await transaction.get(sellerCoinRef);
          let currentSellerCoins = 10;
          if (sellerDoc.exists && sellerDoc.data().coins !== undefined) {
            currentSellerCoins = sellerDoc.data().coins;
          }

          if (currentSellerCoins >= 1) {
            transaction.set(sellerCoinRef, { coins: currentSellerCoins - 1 }, { merge: true });
            clearToProceed = true;
          }
        });

        if (!clearToProceed) {
          btn.classList.remove('loading');
          btn.disabled = false;
          showToast('Order failed: The vendor account has run out of processing coins.', 'error');
          return;
        }

        await db.collection('transactions').add({
          userId: targetSellerId,
          type: 'order_charge',
          amount: -1,
          description: `Charged 1 coin for processing order from ${fullName}`,
          date: firebase.firestore.FieldValue.serverTimestamp()
        });

        if (saveAddress) {
          await db.collection('users').doc(currentUser.uid).set({
            savedAddress: { fullName, phoneNumber, address1, address2, city, state, country, instructions }
          }, { merge: true }).catch(() => {});
        }

        const seller = sellerProfiles[targetSellerId];
        const orderTotal = processingItems.reduce((sum, item) => sum + ((item.price || 0) * (item.quantity || 1)), 0);
        const systematicOrderId = 'ORD_' + Date.now();
        
        const orderData = {
          orderId: systematicOrderId,
          buyerId: currentUser.uid,
          buyerName: fullName,
          buyerPhone: phoneNumber,
          sellerId: targetSellerId,
          sellerName: seller ? (seller.businessName || 'Merchant') : 'Merchant',
          items: processingItems,
          total: orderTotal,
          deliveryDetails: { fullName, phoneNumber, address1, address2, city, state, country, instructions },
          status: 'pending',
          paymentStatus: 'unpaid',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        // 1. SAVE TO FIRESTORE FIRST
        await db.collection('orders').add(orderData);

        for (const item of processingItems) {
          if (item.productId) {
            await db.collection('carts').doc(currentUser.uid).collection('items').doc(item.productId).delete().catch(() => {});
          }
        }
        
        localStorage.removeItem('yanflows_checkout_processing_items');

        // 2. GENERATE WHATSAPP DEEP-LINK
        const message = generateWhatsAppMessage(seller, processingItems, orderTotal, { fullName, phoneNumber, address1, address2, city, state, country, instructions });
        const whatsappNumber = (seller.whatsapp || '2348000000000').replace(/\D/g, '');
        const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
        
        showToast('Order saved! Directing to WhatsApp...', 'success');
        
        // 3. LAUNCH WHATSAPP AND REDIRECT TO ORDERS DASHBOARD
        window.open(whatsappUrl, '_blank');
        setTimeout(() => { window.location.href = 'orders.html'; }, 800);

      } catch (err) {
        console.error(err);
        btn.classList.remove('loading');
        btn.disabled = false;
        showToast('Error finalizing transaction parameters.', 'error');
      }
    }

    function generateWhatsAppMessage(seller, items, total, delivery) {
      let message = `🛍️ *NEW ORDER from ${seller.businessName || 'YAN-FLOWS Seller'}*\n`;
      message += `━━━━━━━━━━━━━━━━━━━━━━\n\n`;
      message += `📦 *ITEMS:*\n`;
      
      items.forEach(item => {
        let itemTotal = (item.price || 0) * (item.quantity || 1);
        message += `• ${item.name || 'Product'} ×${item.quantity || 1} = ${formatCurrency(itemTotal)}\n`;
      });
      
      message += `\n💰 *TOTAL: ${formatCurrency(total)}*\n`;
      message += `\n🚚 *DELIVERY DETAILS:*\n`;
      message += `Name: ${delivery.fullName}\n`;
      message += `Phone: ${delivery.phoneNumber}\n`;
      message += `Address: ${delivery.address1}${delivery.address2 ? ', ' + delivery.address2 : ''}\n`;
      message += `City: ${delivery.city} | State: ${delivery.state}\n`;
      if (delivery.instructions) message += `Instructions: ${delivery.instructions}\n`;
      
      message += `\n💳 *PAYMENT INFO:*\n`;
      if (seller.bankDetails) {
        message += `Bank: ${seller.bankDetails.bankName || 'N/A'}\n`;
        message += `Account: ${seller.bankDetails.accountNumber || 'N/A'}\n`;
        message += `Name: ${seller.bankDetails.accountName || 'N/A'}\n`;
      }
      
      message += `\n📝 ${seller.customMessage || 'Please pay before delivery.'}\n`;
      message += `\n${seller.thankYouMessage || 'Thanks for patronage! 🙏'}`;
      return message;
    }
  </script>
</body>
</html>
