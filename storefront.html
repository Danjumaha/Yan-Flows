<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Storefront | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* ========================================
       YAN-FLOWS - STOREFRONT STYLES
       Luxury Theme: Navy Blue + White + Accents
       ======================================== */
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D;
      --coral: #FF6B6B; --coral-hover: #EE5A5A;
      --teal: #4ECDC4; --teal-hover: #3DBDB4;
      --gold: #FFD93D; --danger: #FF4757;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --shadow-md: 0 4px 20px rgba(27, 58, 95, 0.12);
      --shadow-lg: 0 8px 40px rgba(27, 58, 95, 0.18);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --radius-sm: 8px; --radius-md: 16px;
      --space-sm: 1rem; --space-md: 2rem;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); color: var(--navy); line-height: 1.6; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; }
    input, select { font-family: inherit; }

    /* ===== TOP BAR ===== */
    .top-bar { background: var(--white); padding: 0.75rem var(--space-sm); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.25rem; font-weight: 800; color: var(--navy); }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--navy), var(--teal)); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 700; font-size: 0.9rem; }
    .top-actions { display: flex; gap: 1rem; align-items: center; }
    .icon-btn { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--light-bg); display: flex; align-items: center; justify-content: center; color: var(--navy); font-size: 1.1rem; transition: var(--transition); }
    .icon-btn:hover { background: var(--navy); color: var(--white); }
    .badge-count { position: absolute; top: -2px; right: -2px; background: var(--coral); color: white; font-size: 0.7rem; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }

    /* ===== SELLER HEADER ===== */
    .seller-header { background: linear-gradient(135deg, var(--navy), var(--navy-dark)); color: var(--white); padding: var(--space-md) var(--space-sm); text-align: center; }
    .seller-logo { width: 80px; height: 80px; background: var(--white); border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; color: var(--navy); box-shadow: var(--shadow-md); }
    .seller-name { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.25rem; }
    .seller-tagline { opacity: 0.9; font-size: 1rem; margin-bottom: 1rem; }
    .seller-meta { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; font-size: 0.9rem; opacity: 0.85; }
    .seller-meta span { display: flex; align-items: center; gap: 0.5rem; }    .whatsapp-btn { margin-top: 1.25rem; background: #25D366; color: white; padding: 0.75rem 1.5rem; border-radius: var(--radius-full); font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; transition: var(--transition); }
    .whatsapp-btn:hover { background: #128C7E; transform: translateY(-2px); }

    /* ===== SEARCH & FILTER ===== */
    .controls-bar { padding: var(--space-sm) var(--space-sm); max-width: 1200px; margin: 0 auto; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    .search-box { flex: 1; min-width: 200px; position: relative; }
    .search-box input { width: 100%; padding: 0.875rem 1rem 0.875rem 2.5rem; border: 2px solid #E2E8F0; border-radius: var(--radius-full); font-size: 0.95rem; transition: var(--transition); }
    .search-box input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(78,205,196,0.15); }
    .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--gray); }
    .filter-select { padding: 0.875rem 1rem; border: 2px solid #E2E8F0; border-radius: var(--radius-full); font-size: 0.95rem; background: var(--white); cursor: pointer; }

    /* ===== PRODUCTS GRID ===== */
    .products-container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-sm) var(--space-md); }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .product-card { background: var(--white); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); transition: var(--transition); position: relative; }
    .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
    .product-img-wrap { position: relative; height: 220px; overflow: hidden; background: #E2E8F0; }
    .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .product-card:hover .product-img { transform: scale(1.05); }
    .wishlist-btn { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gray); transition: var(--transition); z-index: 2; }
    .wishlist-btn.active { color: var(--coral); }
    .wishlist-btn:hover { background: var(--white); transform: scale(1.1); }
    .stock-overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 600; }
    .product-body { padding: 1rem; }
    .product-name { font-weight: 700; font-size: 1.05rem; color: var(--navy-dark); margin-bottom: 0.25rem; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .product-cat { font-size: 0.8rem; color: var(--gray); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .product-price { font-size: 1.25rem; font-weight: 800; color: var(--navy); margin-bottom: 0.75rem; }
    .add-cart-btn { width: 100%; background: var(--navy); color: var(--white); padding: 0.75rem; border-radius: var(--radius-sm); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: var(--transition); }
    .add-cart-btn:hover { background: var(--coral); }
    .add-cart-btn:disabled { background: var(--gray); cursor: not-allowed; }

    /* Empty & Loading States */
    .state-box { text-align: center; padding: 3rem 1rem; color: var(--gray); }
    .state-box i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
    .state-box h3 { color: var(--navy); margin-bottom: 0.5rem; }

    /* Footer */
    .store-footer { background: var(--white); padding: 1.5rem var(--space-sm); text-align: center; color: var(--gray); font-size: 0.85rem; border-top: 1px solid #F1F5F9; margin-top: var(--space-md); }

    /* Toast */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--white); padding: 1rem 1.25rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 0.75rem; min-width: 280px; transform: translateX(120%); transition: transform 0.3s ease; border-left: 4px solid var(--coral); }
    .toast.success { border-left-color: var(--teal); }
    .toast.show { transform: translateX(0); }

    /* Responsive */
    @media (max-width: 640px) {
      .products-grid { grid-template-columns: 1fr; }
      .seller-header { padding: 1.5rem 1rem; }
      .seller-name { font-size: 1.5rem; }    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <nav class="top-bar">
    <a href="index.html" class="logo">
      <div class="logo-icon">YF</div>
      YAN-FLOWS
    </a>
    <div class="top-actions">
      <button class="icon-btn" onclick="toggleWishlist()" title="Wishlist">
        <i class="fas fa-heart"></i>
        <span class="badge-count" id="wishlistCount">0</span>
      </button>
      <button class="icon-btn" onclick="toggleCart()" title="Cart">
        <i class="fas fa-shopping-bag"></i>
        <span class="badge-count" id="cartCount">0</span>
      </button>
    </div>
  </nav>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Seller Header -->
  <header class="seller-header" id="sellerHeader">
    <div class="seller-logo" id="sellerLogo">SF</div>
    <h1 class="seller-name" id="sellerName">Loading Store...</h1>
    <p class="seller-tagline" id="sellerTagline"></p>
    <div class="seller-meta">
      <span><i class="fas fa-map-marker-alt"></i> <span id="sellerLocation">Nigeria</span></span>
      <span><i class="fas fa-truck"></i> <span id="sellerDelivery">Standard Delivery</span></span>
    </div>
    <a href="#" class="whatsapp-btn" id="whatsappLink" target="_blank">
      <i class="fab fa-whatsapp"></i> Chat on WhatsApp
    </a>
  </header>

  <!-- Search & Filter -->
  <div class="controls-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search products..."/>
    </div>
    <select class="filter-select" id="categoryFilter">
      <option value="all">All Categories</option>
      <option value="Fashion">Fashion</option>
      <option value="Electronics">Electronics</option>      <option value="Beauty">Beauty & Health</option>
      <option value="Food">Food & Grocery</option>
      <option value="Home">Home & Living</option>
    </select>
  </div>

  <!-- Products Grid -->
  <main class="products-container">
    <div id="loadingState" class="state-box">
      <i class="fas fa-spinner fa-spin"></i>
      <h3>Loading Products...</h3>
    </div>
    <div id="emptyState" class="state-box" style="display:none;">
      <i class="fas fa-box-open"></i>
      <h3>No Products Found</h3>
      <p>This store hasn't added any products yet, or they are currently out of stock.</p>
    </div>
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- Footer -->
  <footer class="store-footer">
    <p>Powered by <strong>YAN-FLOWS</strong> • Secure Commerce Platform</p>
  </footer>

  <!-- Core Engine -->
  <script src="app.js"></script>

  <!-- Page Script -->
  <script>
    // ===== DOM ELEMENTS =====
    const productsGrid = document.getElementById('productsGrid');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const cartCountEl = document.getElementById('cartCount');
    const wishlistCountEl = document.getElementById('wishlistCount');
    
    // Seller Info Elements
    const sellerNameEl = document.getElementById('sellerName');
    const sellerTaglineEl = document.getElementById('sellerTagline');
    const sellerDeliveryEl = document.getElementById('sellerDelivery');
    const whatsappLink = document.getElementById('whatsappLink');
    const sellerLogo = document.getElementById('sellerLogo');

    // State
    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem('yf_cart') || '[]');
    let wishlist = JSON.parse(localStorage.getItem('yf_wishlist') || '[]');    let currentSellerUid = null;

    // ===== URL PARSING =====
    // Supports: ?seller=username or ?uid=userId
    const params = new URLSearchParams(window.location.search);
    const sellerParam = params.get('seller') || params.get('uid');

    if (!sellerParam) {
      document.body.innerHTML = '<div style="text-align:center;padding:4rem 1rem;"><h2>Store Not Found</h2><p>Please check the link or return to <a href="index.html" style="color:var(--teal);">YAN-FLOWS Home</a></p></div>';
    } else {
      initStorefront();
    }

    // ===== INITIALIZATION =====
    async function initStorefront() {
      try {
        // Find seller UID by username or use direct UID
        let uid = sellerParam;
        if (sellerParam.length < 20) { // Likely username, not UID
          const usersSnap = await firebase.firestore().collection('users')
            .where('storeUrl', 'array-contains', `yan-flows.com/store/${sellerParam}`)
            .get();
          if (!usersSnap.empty) {
            uid = usersSnap.docs[0].id;
          } else {
            // Fallback: query business_profiles by companyName
            const bizSnap = await firebase.firestore().collection('business_profiles')
              .where('companyName', '==', sellerParam.replace(/-/g, ' '))
              .get();
            if (!bizSnap.empty) uid = bizSnap.docs[0].id;
          }
        }

        if (!uid) throw new Error('Seller not found');
        currentSellerUid = uid;

        // Load Business Profile
        const bizDoc = await firebase.firestore().collection('business_profiles').doc(uid).get();
        if (bizDoc.exists) {
          const biz = bizDoc.data();
          sellerNameEl.textContent = biz.companyName || 'Store';
          sellerTaglineEl.textContent = biz.businessTitle || biz.description || '';
          sellerDeliveryEl.textContent = biz.deliveryDisclaimer || 'Nationwide Delivery';
          whatsappLink.href = `https://wa.me/${biz.whatsappNumber.replace(/\D/g,'')}`;
          sellerLogo.textContent = (biz.companyName || 'S').substring(0,2).toUpperCase();
        }

        // Load Products
        const prodSnap = await firebase.firestore().collection('products')
          .where('sellerId', '==', uid)          .orderBy('createdAt', 'desc')
          .get();

        allProducts = prodSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        loadingState.style.display = 'none';
        
        if (allProducts.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        renderProducts(allProducts);
        updateCounts();

      } catch (err) {
        console.error('Init error:', err);
        loadingState.style.display = 'none';
        emptyState.querySelector('h3').textContent = 'Store Unavailable';
        emptyState.querySelector('p').textContent = 'This store is currently offline or not configured.';
        emptyState.style.display = 'block';
      }
    }

    // ===== RENDER PRODUCTS =====
    function renderProducts(products) {
      productsGrid.innerHTML = '';
      
      if (products.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      products.forEach(p => {
        const isInWishlist = wishlist.includes(p.id);
        const stockClass = p.stock > 0 ? 'stock-in' : 'stock-out';
        const stockText = p.stock > 0 ? 'In Stock' : 'Sold Out';
        
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-img-wrap">
            <img src="${p.imageUrl || 'https://via.placeholder.com/400x300/E2E8F0/6C757D?text=No+Image'}" class="product-img" alt="${p.name}"/>
            <button class="wishlist-btn ${isInWishlist ? 'active' : ''}" onclick="toggleWishlistItem('${p.id}', this)">
              <i class="fas fa-heart"></i>
            </button>
            ${p.stock <= 0 ? '<div class="stock-overlay" style="background:var(--danger)">Sold Out</div>' : ''}
          </div>
          <div class="product-body">
            <div class="product-cat">${p.category || 'General'}</div>            <div class="product-name">${p.name}</div>
            <div class="product-price">${YF.ui.formatNaira(p.price)}</div>
            <button class="add-cart-btn" onclick="addToCart('${p.id}')" ${p.stock <= 0 ? 'disabled' : ''}>
              <i class="fas fa-cart-plus"></i> ${p.stock <= 0 ? 'Out of Stock' : 'Add to Cart'}
            </button>
          </div>
        `;
        productsGrid.appendChild(card);
      });
    }

    // ===== SEARCH & FILTER =====
    function filterProducts() {
      const query = searchInput.value.toLowerCase();
      const cat = categoryFilter.value;
      
      const filtered = allProducts.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(query) || (p.description || '').toLowerCase().includes(query);
        const matchesCat = cat === 'all' || p.category === cat;
        return matchesSearch && matchesCat;
      });
      
      renderProducts(filtered);
    }

    searchInput.addEventListener('input', filterProducts);
    categoryFilter.addEventListener('change', filterProducts);

    // ===== CART SYSTEM =====
    window.addToCart = (productId) => {
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        const product = allProducts.find(p => p.id === productId);
        if (!product) return;
        cart.push({ id: productId, name: product.name, price: product.price, qty: 1, image: product.imageUrl });
      }
      saveCart();
      YF.ui.toast('Added to cart! 🛒', 'success');
    };

    function saveCart() {
      localStorage.setItem('yf_cart', JSON.stringify(cart));
      updateCounts();
    }

    function updateCounts() {
      cartCountEl.textContent = cart.reduce((sum, item) => sum + item.qty, 0);
      wishlistCountEl.textContent = wishlist.length;    }

    window.toggleCart = () => {
      window.location.href = `cart.html`;
    };

    // ===== WISHLIST SYSTEM =====
    window.toggleWishlistItem = (productId, btn) => {
      const idx = wishlist.indexOf(productId);
      if (idx > -1) {
        wishlist.splice(idx, 1);
        btn.classList.remove('active');
        YF.ui.toast('Removed from wishlist', 'info');
      } else {
        wishlist.push(productId);
        btn.classList.add('active');
        YF.ui.toast('Saved to wishlist ❤️', 'success');
      }
      localStorage.setItem('yf_wishlist', JSON.stringify(wishlist));
      updateCounts();
    };

    window.toggleWishlist = () => {
      window.location.href = `wishlist.html`; // You can create this later or reuse cart.html with tab
    };

    // Expose to window for inline onclick
    window.YF = YF;

    console.log('✅ Storefront Loaded');
    console.log('🔍 Search & Filter Active');
    console.log(' Cart & Wishlist Synced to LocalStorage');
  </script>
<script src="app.js"></script>
</body>
</html>
