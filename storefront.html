<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="pageTitle">Store | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D; --light-gray: #ADB5BD;
      --coral: #FF6B6B; --teal: #4ECDC4; --gold: #FFD93D;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --shadow-md: 0 4px 20px rgba(27, 58, 95, 0.12);
      --radius-sm: 8px; --radius-md: 16px; --radius-lg: 24px; --radius-full: 9999px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); min-height: 100vh; color: var(--navy-dark); }

    .top-nav { background: var(--white); padding: 0.75rem 1.5rem; box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-weight: 800; font-size: 1.25rem; color: var(--navy); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
    .nav-actions { display: flex; gap: 1rem; }
    .nav-btn { padding: 0.5rem 1rem; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; text-decoration: none; transition: var(--transition); cursor: pointer; border: none; }
    .btn-outline { border: 2px solid var(--navy); color: var(--navy); background: transparent; }
    .btn-outline:hover { background: var(--navy); color: var(--white); }
    .btn-primary { background: var(--navy); color: var(--white); }
    .btn-primary:hover { background: var(--navy-light); }
    .cart-btn { position: relative; }
    .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--coral); color: white; font-size: 0.7rem; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .notif-btn { position: relative; }
    .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--teal); color: var(--navy-dark); font-size: 0.7rem; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    .store-header { background: var(--white); border-bottom: 1px solid #E5E7EB; padding: 2rem 1.5rem; }
    .store-container { max-width: 1200px; margin: 0 auto; display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap; }
    .store-avatar { width: 120px; height: 120px; border-radius: 50%; background: var(--light-bg); border: 4px solid var(--white); box-shadow: var(--shadow-md); overflow: hidden; flex-shrink: 0; cursor: pointer; }
    .store-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .store-info { flex: 1; min-width: 250px; }
    .store-name { font-size: 2rem; font-weight: 800; color: var(--navy-dark); margin-bottom: 0.25rem; }
    .store-handle { color: var(--gray); font-size: 1rem; margin-bottom: 0.75rem; }
    .store-bio { color: var(--gray); margin-bottom: 1rem; line-height: 1.6; font-size: 1rem; }
    .store-meta { display: flex; gap: 2rem; margin-bottom: 1.5rem; font-size: 0.95rem; color: var(--navy); flex-wrap: wrap; }
    .store-meta span { display: flex; align-items: center; gap: 0.5rem; }
    .store-meta i { color: var(--teal); }
    .store-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .btn-whatsapp { background: #25D366; color: white; padding: 0.875rem 1.5rem; border-radius: var(--radius-sm); font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; transition: var(--transition); border: none; cursor: pointer; font-size: 0.95rem; }
    .btn-whatsapp:hover { background: #128C7E; transform: translateY(-2px); }
    .btn-follow { background: var(--light-bg); color: var(--navy); padding: 0.875rem 1.5rem; border-radius: var(--radius-sm); font-weight: 600; border: 2px solid var(--navy); cursor: pointer; transition: var(--transition); font-size: 0.95rem; }
    .btn-follow:hover { background: var(--navy); color: white; }    .btn-follow.following { background: var(--teal); border-color: var(--teal); color: var(--navy-dark); }

    .products-section { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .section-title { font-size: 1.5rem; font-weight: 700; color: var(--navy); }
    .filter-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-tab { padding: 0.5rem 1.25rem; border-radius: var(--radius-full); background: var(--white); color: var(--gray); font-size: 0.9rem; font-weight: 600; cursor: pointer; border: 2px solid #E5E7EB; transition: var(--transition); }
    .filter-tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .filter-tab:hover:not(.active) { border-color: var(--teal); color: var(--teal); }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .product-card { background: var(--white); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); transition: var(--transition); display: flex; flex-direction: column; }
    .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .product-img { width: 100%; aspect-ratio: 1/1; background: var(--light-bg); overflow: hidden; position: relative; cursor: pointer; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
    .product-card:hover .product-img img { transform: scale(1.05); }
    .product-badge { position: absolute; top: 10px; left: 10px; background: var(--coral); color: white; padding: 0.25rem 0.75rem; border-radius: var(--radius-sm); font-size: 0.75rem; font-weight: 700; }
    .product-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .product-cat { font-size: 0.85rem; color: var(--teal); font-weight: 600; margin-bottom: 0.375rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .product-name { font-weight: 700; color: var(--navy-dark); margin-bottom: 0.5rem; line-height: 1.3; font-size: 1.05rem; }
    .product-price { font-size: 1.25rem; font-weight: 800; color: var(--navy); margin-bottom: 1rem; }
    .product-footer { margin-top: auto; display: flex; gap: 0.5rem; }
    .btn-cart { flex: 1; padding: 0.75rem; background: var(--light-bg); color: var(--navy); border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 0.375rem; font-size: 0.9rem; }
    .btn-cart:hover { background: #E5E7EB; }
    .btn-cart:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-buy { flex: 1; padding: 0.75rem; background: var(--navy); color: white; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 0.375rem; font-size: 0.9rem; }
    .btn-buy:hover { background: var(--navy-light); }
    .btn-buy:disabled { opacity: 0.6; cursor: not-allowed; }

    .empty-state { text-align: center; padding: 4rem 2rem; background: var(--white); border-radius: var(--radius-md); grid-column: 1 / -1; }
    .empty-state i { font-size: 3rem; color: var(--light-gray); margin-bottom: 1rem; }
    .empty-state h3 { color: var(--navy); margin-bottom: 0.5rem; }
    .empty-state p { color: var(--gray); margin-bottom: 1.5rem; }

    .yf-toast { position: fixed; top: 80px; right: 2rem; padding: 1rem 1.5rem; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 0.75rem; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 9999; opacity: 0; transform: translateX(100%); transition: all 0.3s ease; font-weight: 600; font-size: 0.9rem; max-width: 350px; }
    .yf-toast.show { opacity: 1; transform: translateX(0); }
    .yf-toast--success { background: #2ECC71; color: white; }
    .yf-toast--error { background: var(--coral); color: white; }
    .yf-toast--info { background: var(--navy); color: white; }

    .loading-skeleton { background: linear-gradient(90deg, var(--light-bg) 25%, #E5E7EB 50%, var(--light-bg) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: var(--radius-sm); }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (max-width: 768px) {
      .store-container { flex-direction: column; align-items: center; text-align: center; }
      .store-meta, .store-actions { justify-content: center; }
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .section-header { flex-direction: column; align-items: flex-start; }
      .yf-toast { right: 1rem; left: 1rem; max-width: none; }
    }  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="dashboard.html" class="nav-logo">
      <div style="width:32px;height:32px;background:linear-gradient(135deg,var(--navy),var(--teal));border-radius:6px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:0.9rem;">YF</div>
      YAN-FLOWS
    </a>
    <div class="nav-actions">
      <a href="dashboard.html" class="nav-btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
      <a href="notification.html" class="nav-btn nav-icon notif-btn"><i class="fas fa-bell"></i><span class="notif-badge" id="notifBadge" style="display:none;">0</span></a>
      <a href="cart.html" class="nav-btn btn-primary cart-btn" id="cartBtn"><i class="fas fa-shopping-cart"></i><span class="cart-badge" id="cartBadge" style="display:none;">0</span></a>
    </div>
  </nav>

  <header class="store-header">
    <div class="store-container" id="storeHeader">
      <div class="store-avatar" id="storeAvatar"><div class="loading-skeleton" style="width:100%;height:100%;"></div></div>
      <div class="store-info">
        <h1 class="store-name" id="storeName">Loading...</h1>
        <div class="store-handle" id="storeHandle">@storename</div>
        <p class="store-bio" id="storeBio">Loading store information...</p>
        <div class="store-meta">
          <span><i class="fas fa-map-marker-alt"></i> <span id="storeLocation">Loading...</span></span>
          <span><i class="fas fa-box"></i> <span id="productCount">0</span> Products</span>
          <span><i class="fas fa-users"></i> <span id="followerCount">0</span> Followers</span>
          <span><i class="fas fa-star" style="color:var(--gold);"></i> <span id="storeRating">New Seller</span></span>
        </div>
        <div class="store-actions">
          <a href="#" class="btn-whatsapp" id="whatsappBtn" target="_blank"><i class="fab fa-whatsapp"></i> Chat</a>
          <button class="btn-follow" id="followBtn" onclick="toggleFollow()"><i class="fas fa-plus"></i> <span id="followText">Follow</span></button>
        </div>
      </div>
    </div>
  </header>

  <section class="products-section">
    <div class="section-header">
      <h2 class="section-title">📦 All Products</h2>
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-category="all">All</button>
      </div>
    </div>
    <div class="products-grid" id="productsGrid">
      <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h3>Loading products...</h3></div>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBJ4t5SDaryYcjIzG737tLPNIwXRnL9Qlc",
      authDomain: "yan-flow.firebaseapp.com",
      projectId: "yan-flow",
      storageBucket: "yan-flow.firebasestorage.app",
      messagingSenderId: "373204559623",
      appId: "1:373204559623:web:56e1c8abf07945c53187a2"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function formatCurrency(amount) { return '₦' + Number(amount).toLocaleString('en-NG'); }

    function showToast(message, type) {
      type = type || 'success';
      const toast = document.createElement('div');
      toast.className = 'yf-toast yf-toast--' + type;
      toast.innerHTML = '<i class="fas ' + (type==='success'?'fa-check-circle':type==='error'?'fa-exclamation-circle':'fa-info-circle') + '"></i><span>' + message + '</span>';
      document.body.appendChild(toast);
      setTimeout(function() { toast.classList.add('show'); }, 10);
      setTimeout(function() { toast.classList.remove('show'); setTimeout(function() { toast.remove(); }, 300); }, 3000);
    }

    let currentUser = null, sellerId = null, allProducts = [], currentFilter = 'all', cart = [], userData = {};

    // Get sellerId from URL - CRITICAL FIX
    const urlParams = new URLSearchParams(window.location.search);
    sellerId = urlParams.get('id');
    
    console.log('Storefront loaded - sellerId from URL:', sellerId);
    console.log('Current URL:', window.location.href);

    // Load cart immediately
    try {
      cart = JSON.parse(localStorage.getItem('yanflows_cart') || '[]');
    } catch(e) { cart = []; }
    updateCartBadge();

    auth.onAuthStateChanged(async function(user) {
      currentUser = user;
      const btn = document.getElementById('cartBtn');
      if (user) {
        btn.href = 'cart.html';
        try { cart = JSON.parse(localStorage.getItem('yanflows_cart') || '[]'); } catch(e) { cart = []; }
        updateCartBadge();
        await loadUserData();        loadNotificationCount();
      } else {
        btn.href = 'login.html';
      }
    });

    async function loadUserData() {
      try {
        if (!currentUser) return;
        const doc = await db.collection('users').doc(currentUser.uid).get();
        if (doc.exists) userData = doc.data();
      } catch(e) { console.error('Load user error:', e); }
    }

    async function loadNotificationCount() {
      try {
        if (!currentUser) return;
        const snap = await db.collection('notifications')
          .where('userId', '==', currentUser.uid)
          .where('read', '==', false).get();
        const badge = document.getElementById('notifBadge');
        if (badge) { badge.textContent = snap.size; badge.style.display = snap.size > 0 ? 'flex' : 'none'; }
      } catch(e) { console.error('Notif count error:', e); }
    }

    function updateCartBadge() {
      const badge = document.getElementById('cartBadge');
      if (badge) {
        const count = cart.reduce(function(s,i) { return s + (i.quantity||1); }, 0);
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
      }
    }

    async function loadStorefront() {
      try {
        // CRITICAL: Validate sellerId
        if (!sellerId || sellerId === 'null' || sellerId === 'undefined' || sellerId.trim() === '') {
          console.error('Invalid sellerId:', sellerId);
          showError('No seller specified', 'Please provide a valid seller ID in the URL. Example: storefront.html?id=abc123');
          return;
        }

        console.log('Loading storefront for sellerId:', sellerId);

        const userDoc = await db.collection('users').doc(sellerId).get();
        
        if (!userDoc.exists) {
          console.error('User document not found for ID:', sellerId);
          showError('Seller not found', 'This seller does not exist or has been removed. Seller ID: ' + sellerId);          return;
        }
        
        const user = userDoc.data();
        console.log('Seller data loaded:', user);

        const storeName = user.businessName || user.shopName || user.storeName || user.fullName || user.displayName || user.username || 'Store';
        document.getElementById('pageTitle').textContent = storeName + ' | YAN-FLOWS';
        document.getElementById('storeName').textContent = storeName;
        document.getElementById('storeHandle').textContent = '@' + (user.username || storeName.toLowerCase().replace(/\s+/g, ''));
        document.getElementById('storeBio').textContent = user.bio || user.description || user.about || 'No description provided.';
        document.getElementById('storeLocation').textContent = user.location || user.city || user.state || 'Nigeria';

        const rating = user.rating || user.averageRating || user.avgRating || null;
        document.getElementById('storeRating').textContent = rating ? rating.toFixed(1) + ' ★' : 'New Seller';

        const followers = user.followersCount || user.followers || 0;
        document.getElementById('followerCount').textContent = followers;

        // Avatar
        if (user.profilePic || user.avatar || user.photoURL) {
          const pic = user.profilePic || user.avatar || user.photoURL;
          document.getElementById('storeAvatar').innerHTML = '<img src="' + pic + '" alt="' + storeName + '" onerror="this.parentElement.innerHTML=\'<div style=\\\"width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--teal));color:white;font-size:2.5rem;font-weight:700;\\\">' + storeName.charAt(0).toUpperCase() + '</div>\'"/>';
        } else {
          document.getElementById('storeAvatar').innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--teal));color:white;font-size:2.5rem;font-weight:700;">' + storeName.charAt(0).toUpperCase() + '</div>';
        }

        // WhatsApp
        const waNumber = user.whatsapp || user.phone || user.phoneNumber || '';
        if (waNumber) {
          const cleanWa = waNumber.replace(/\D/g, '');
          const waText = encodeURIComponent('Hi ' + storeName + ', I saw your store on YAN-FLOWS.');
          document.getElementById('whatsappBtn').href = 'https://wa.me/' + cleanWa + '?text=' + waText;
        } else {
          document.getElementById('whatsappBtn').style.display = 'none';
        }

        // Check follow status
        if (currentUser && currentUser.uid !== sellerId) {
          try {
            const followDoc = await db.collection('users').doc(currentUser.uid).collection('following').doc(sellerId).get();
            if (followDoc.exists) {
              document.getElementById('followBtn').classList.add('following');
              document.getElementById('followText').textContent = 'Following';
              document.querySelector('#followBtn i').className = 'fas fa-check';
            }
          } catch(e) {
            try {
              const uDoc = await db.collection('users').doc(currentUser.uid).get();
              if (uDoc.exists && (uDoc.data().following || []).includes(sellerId)) {                document.getElementById('followBtn').classList.add('following');
                document.getElementById('followText').textContent = 'Following';
                document.querySelector('#followBtn i').className = 'fas fa-check';
              }
            } catch(e2) {}
          }
        } else if (currentUser && currentUser.uid === sellerId) {
          document.getElementById('followBtn').style.display = 'none';
        }

        await loadProducts();

      } catch (error) {
        console.error('Storefront error:', error);
        showError('Error loading store', error.message || 'Unknown error');
      }
    }

    function showError(title, message) {
      document.getElementById('productsGrid').innerHTML =
        '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-exclamation-triangle" style="color:var(--coral)"></i>' +
        '<h3>' + title + '</h3><p>' + message + '</p>' +
        '<a href="dashboard.html" class="btn-buy" style="display:inline-flex;text-decoration:none;margin-top:1rem;padding:0.75rem 1.5rem;border-radius:8px;">' +
        '<i class="fas fa-home"></i> Back to Dashboard</a></div>';
      document.getElementById('storeName').textContent = 'Store Not Found';
      document.getElementById('storeHandle').textContent = '';
      document.getElementById('storeBio').textContent = '';
    }

    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-spinner fa-spin"></i><h3>Loading products...</h3></div>';

      try {
        let products = [];

        try {
          const snapshot = await db.collection('products')
            .where('sellerId', '==', sellerId)
            .get();
          products = snapshot.docs.map(function(doc) { return Object.assign({ id: doc.id }, doc.data()); });
          console.log('Products loaded:', products.length);
        } catch(queryErr) {
          console.warn('Query failed, trying fallback...');
          throw queryErr;
        }

        if (products.length === 0) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-box-open"></i><h3>No products yet</h3><p>This seller hasn\'t uploaded any items.</p></div>';
          document.getElementById('productCount').textContent = '0';          return;
        }

        allProducts = products;
        document.getElementById('productCount').textContent = allProducts.length;

        const categories = [...new Set(allProducts.map(function(p) { return p.category || 'Other'; }))];
        const filterTabs = document.getElementById('filterTabs');
        filterTabs.innerHTML = '<button class="filter-tab active" data-category="all">All (' + allProducts.length + ')</button>';
        categories.forEach(function(cat) {
          if (cat) {
            const count = allProducts.filter(function(p) { return (p.category || 'Other') === cat; }).length;
            filterTabs.innerHTML += '<button class="filter-tab" data-category="' + cat + '">' + cat + ' (' + count + ')</button>';
          }
        });
        filterTabs.querySelectorAll('.filter-tab').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            filterTabs.querySelectorAll('.filter-tab').forEach(function(b) { b.classList.remove('active'); });
            e.target.classList.add('active');
            currentFilter = e.target.dataset.category;
            renderProducts();
          });
        });

        renderProducts();

      } catch (error) {
        console.error('Load products error:', error);
        grid.innerHTML =
          '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-exclamation-triangle" style="color:var(--coral)"></i>' +
          '<h3>Could not load products</h3>' +
          '<p>' + (error.message || 'Permission denied or network error. Please try again.') + '</p>' +
          '<button onclick="loadProducts()" class="btn-buy" style="display:inline-flex;margin-top:1rem;padding:0.75rem 1.5rem;border-radius:8px;border:none;cursor:pointer;">' +
          '<i class="fas fa-redo"></i> Retry</button></div>';
      }
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const filtered = currentFilter === 'all'
        ? allProducts
        : allProducts.filter(function(p) { return (p.category || 'Other') === currentFilter; });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-search"></i><h3>No products</h3><p>No products in this category.</p></div>';
        return;
      }
      grid.innerHTML = '';
      filtered.forEach(function(product) { grid.appendChild(createProductCard(product)); });
    }
    function createProductCard(product) {
      const div = document.createElement('div');
      div.className = 'product-card';
      const productId = product.id;
      const sellerName = document.getElementById('storeName').textContent;
      const isOutOfStock = product.stock === 0;
      const isLowStock   = product.stock > 0 && product.stock <= 5;

      div.innerHTML =
        '<div class="product-img" onclick="window.location.href=\'product-detail.html?id=' + productId + '\'">' +
          '<img src="' + (product.image || product.imageUrl || 'https://via.placeholder.com/400?text=No+Image') + '" alt="' + (product.name||'') + '" onerror="this.src=\'https://via.placeholder.com/400?text=Image+Not+Found\'"/>' +
          (isLowStock ? '<span class="product-badge">Low Stock</span>' : '') +
          (isOutOfStock ? '<span class="product-badge" style="background:var(--gray)">Out of Stock</span>' : '') +
        '</div>' +
        '<div class="product-body">' +
          '<div class="product-cat">' + (product.category || 'General') + '</div>' +
          '<div class="product-name">' + (product.name || 'Unnamed') + '</div>' +
          '<div class="product-price">' + formatCurrency(product.price) + '</div>' +
          '<div class="product-footer">' +
            '<button class="btn-cart" onclick="addToCart(\'' + productId + '\',\'' + (sellerName).replace(/'/g, "\\'") + '\',\'' + (product.name||'').replace(/'/g, "\\'") + '\',' + (product.price||0) + ',\'' + (product.image||product.imageUrl||'') + '\',' + (product.stock||0) + ')" ' + (isOutOfStock ? 'disabled' : '') + '>' +
              '<i class="fas fa-cart-plus"></i> ' + (isOutOfStock ? 'Out of Stock' : 'Add') +
            '</button>' +
            '<button class="btn-buy" onclick="buyNow(\'' + productId + '\')" ' + (isOutOfStock ? 'disabled' : '') + '>' +
              '<i class="fas fa-bolt"></i> Buy' +
            '</button>' +
          '</div>' +
        '</div>';
      return div;
    }

    window.addToCart = function(productId, sellerName, productName, price, image, stock) {
      if (!currentUser) {
        showToast('Please login to add to cart', 'info');
        setTimeout(function() { window.location.href = 'login.html'; }, 1500);
        return;
      }
      if (stock === 0) { showToast('Out of stock', 'error'); return; }

      try { cart = JSON.parse(localStorage.getItem('yanflows_cart') || '[]'); } catch(e) { cart = []; }

      const idx = cart.findIndex(function(i) { return i.productId === productId; });
      if (idx >= 0) {
        if (cart[idx].quantity >= stock) { showToast('Max quantity reached', 'error'); return; }
        cart[idx].quantity++;
      } else {
        cart.push({
          productId: productId, sellerId: sellerId,
          sellerName: sellerName, name: productName,
          price: parseFloat(price) || 0, image: image,          stock: stock, quantity: 1
        });
      }
      localStorage.setItem('yanflows_cart', JSON.stringify(cart));
      updateCartBadge();
      showToast('✅ Added to cart!', 'success');

      if (currentUser) {
        createNotification(sellerId, 'cart_add',
          (userData.fullName || 'A user') + ' added "' + productName + '" to cart',
          { productId: productId, productName: productName, price: price }
        );
      }
    };

    window.buyNow = function(productId) {
      if (!currentUser) {
        showToast('Please login to buy', 'info');
        setTimeout(function() { window.location.href = 'login.html'; }, 1500);
        return;
      }
      const product = allProducts.find(function(p) { return p.id === productId; });
      if (product) {
        addToCart(productId, document.getElementById('storeName').textContent,
          product.name, product.price, product.image || product.imageUrl || '', product.stock || 0);
        setTimeout(function() { window.location.href = 'checkout.html'; }, 500);
      }
    };

    window.toggleFollow = async function() {
      if (!currentUser) {
        showToast('Please login to follow', 'info');
        setTimeout(function() { window.location.href = 'login.html'; }, 1500);
        return;
      }
      const btn  = document.getElementById('followBtn');
      const text = document.getElementById('followText');
      const icon = btn.querySelector('i');
      const isFollowing = btn.classList.contains('following');

      btn.disabled = true;
      try {
        const followRef = db.collection('users').doc(currentUser.uid).collection('following').doc(sellerId);
        if (isFollowing) {
          try { await followRef.delete(); } catch(e) {}
          await db.collection('users').doc(currentUser.uid).update({
            following: firebase.firestore.FieldValue.arrayRemove(sellerId),
            followingCount: firebase.firestore.FieldValue.increment(-1)
          }).catch(function(){});
          await db.collection('users').doc(sellerId).update({            followersCount: firebase.firestore.FieldValue.increment(-1)
          }).catch(function(){});

          btn.classList.remove('following');
          text.textContent = 'Follow';
          icon.className = 'fas fa-plus';
          const countEl = document.getElementById('followerCount');
          if (countEl) countEl.textContent = Math.max(0, parseInt(countEl.textContent || '0') - 1);
          showToast('Unfollowed', 'info');

        } else {
          await followRef.set({
            followedAt: firebase.firestore.FieldValue.serverTimestamp(),
            sellerName: document.getElementById('storeName').textContent
          });
          await db.collection('users').doc(currentUser.uid).update({
            following: firebase.firestore.FieldValue.arrayUnion(sellerId),
            followingCount: firebase.firestore.FieldValue.increment(1)
          }).catch(function(){});
          await db.collection('users').doc(sellerId).update({
            followersCount: firebase.firestore.FieldValue.increment(1)
          }).catch(function(){});

          btn.classList.add('following');
          text.textContent = 'Following';
          icon.className = 'fas fa-check';
          const countEl = document.getElementById('followerCount');
          if (countEl) countEl.textContent = parseInt(countEl.textContent || '0') + 1;
          showToast('✅ Now following!', 'success');

          createNotification(sellerId, 'new_follower',
            (userData.fullName || 'Someone') + ' started following you'
          );
        }
      } catch(e) {
        console.error('Follow error:', e);
        showToast('Error: ' + (e.message || 'Please try again'), 'error');
      }
      btn.disabled = false;
    };

    async function createNotification(userId, type, message, extra) {
      extra = extra || {};
      try {
        await db.collection('notifications').add(Object.assign({
          userId: userId, type: type, message: message,
          read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          fromUserId: currentUser ? currentUser.uid : null,
          fromUserName: userData.fullName || 'Someone'
        }, extra));      } catch(e) { console.error('Notification error:', e); }
    }

    // Load storefront
    loadStorefront();
  </script>
</body>
</html>
