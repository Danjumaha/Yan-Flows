<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D; --light-gray: #ADB5BD;
      --coral: #FF6B6B; --teal: #4ECDC4; --gold: #FFD93D;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --radius-sm: 8px; --radius-md: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); min-height: 100vh; padding: 2rem 1rem; }
    
    .orders-container { max-width: 900px; margin: 0 auto; }
    .page-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--white); display: flex; align-items: center; justify-content: center; color: var(--navy); text-decoration: none; box-shadow: var(--shadow-sm); }
    .page-title { font-size: 1.75rem; font-weight: 700; color: var(--navy); }

    .filter-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
    .filter-tab { padding: 0.6rem 1.25rem; border-radius: var(--radius-md); background: var(--white); color: var(--gray); font-weight: 600; border: 1px solid #E5E7EB; cursor: pointer; white-space: nowrap; transition: var(--transition); }
    .filter-tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

    .order-card { background: var(--white); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1rem; transition: var(--transition); }
    .order-card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .order-id { font-weight: 700; color: var(--navy); }
    .order-date { color: var(--gray); font-size: 0.9rem; }
    .order-status { padding: 0.375rem 0.75rem; border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: #FFF3CD; color: #856404; }
    .status-completed { background: #D4EDDA; color: #155724; }
    .status-cancelled { background: #F8D7DA; color: #721C24; }

    .order-items { margin-bottom: 1rem; }
    .order-item { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid #F0F0F0; }
    .order-item:last-child { border-bottom: none; }
    .item-img { width: 50px; height: 50px; border-radius: 8px; background: var(--light-bg); overflow: hidden; }
    .item-img img { width: 100%; height: 100%; object-fit: cover; }
    .item-info { flex: 1; }
    .item-name { font-weight: 600; color: var(--navy-dark); font-size: 0.95rem; }
    .item-qty { color: var(--gray); font-size: 0.85rem; }
    .item-price { font-weight: 700; color: var(--navy); }
    .order-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #F0F0F0; padding-top: 1rem; flex-wrap: wrap; gap: 0.75rem; }
    .order-total { font-size: 1.1rem; font-weight: 800; color: var(--navy); }
    .order-actions { display: flex; gap: 0.5rem; }
    .btn-action { padding: 0.5rem 1rem; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; transition: var(--transition); display: flex; align-items: center; gap: 0.375rem; }
    .btn-reorder { background: var(--navy); color: white; }
    .btn-reorder:hover { background: var(--navy-light); }
    .btn-contact { background: var(--light-bg); color: var(--navy); }
    .btn-contact:hover { background: #E5E7EB; }

    .empty-state { text-align: center; padding: 4rem 2rem; background: var(--white); border-radius: var(--radius-md); }
    .empty-state i { font-size: 3rem; color: var(--light-gray); margin-bottom: 1rem; }
    .yf-toast { position: fixed; top: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 0.75rem; box-shadow: var(--shadow-lg); z-index: 9999; opacity: 0; transform: translateX(100%); transition: all 0.3s ease; font-weight: 600; font-size: 0.9rem; }
    .yf-toast.show { opacity: 1; transform: translateX(0); }
    .yf-toast--success { background: #2ECC71; color: white; }
    @media (max-width: 640px) { .order-header { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <div class="orders-container">
    <div class="page-header">
      <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
      <h1 class="page-title">My Orders</h1>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All Orders</button>
      <button class="filter-tab" data-filter="pending">Pending</button>
      <button class="filter-tab" data-filter="completed">Completed</button>
      <button class="filter-tab" data-filter="cancelled">Cancelled</button>
    </div>

    <div id="ordersList">
      <div class="empty-state">
        <i class="fas fa-spinner fa-spin"></i>
        <h3>Loading orders...</h3>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    let allOrders = [];
    let currentFilter = 'all';

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = 'login.html';
      else loadOrders(user.uid);    });

    async function loadOrders(uid) {
      const container = document.getElementById('ordersList');
      try {
        const snapshot = await db.collection('orders').where('buyerId', '==', uid).orderBy('createdAt', 'desc').get();
        allOrders = [];
        snapshot.forEach(doc => allOrders.push({ id: doc.id, ...doc.data() }));
        renderOrders();
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-bug"></i><h3>Error loading orders</h3></div>`;
      }
    }

    function renderOrders() {
      const container = document.getElementById('ordersList');
      const filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-shopping-bag"></i><h3>No orders found</h3><p>Your order history will appear here</p></div>`;
        return;
      }

      container.innerHTML = filtered.map(order => {
        const date = order.createdAt ? YF.formatDate(order.createdAt) : 'Recently';
        const statusClass = `status-${order.status || 'pending'}`;
        const statusLabel = (order.status || 'pending').charAt(0).toUpperCase() + (order.status || 'pending').slice(1);
        
        return `
          <div class="order-card">
            <div class="order-header">
              <div>
                <div class="order-id">Order #${order.orderId || order.id.slice(-6).toUpperCase()}</div>
                <div class="order-date">${date} • From: ${order.sellerName}</div>
              </div>
              <span class="order-status ${statusClass}">${statusLabel}</span>
            </div>
            <div class="order-items">
              ${(order.items || []).map(item => `
                <div class="order-item">
                  <div class="item-img"><img src="${item.image || 'https://via.placeholder.com/50'}" alt="${item.name}"/></div>
                  <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-qty">Qty: ${item.quantity}</div>
                  </div>
                  <div class="item-price">${YF.formatCurrency(item.price * item.quantity)}</div>
                </div>
              `).join('')}
            </div>
            <div class="order-footer">              <div class="order-total">Total: ${YF.formatCurrency(order.total)}</div>
              <div class="order-actions">
                <button class="btn-action btn-reorder" onclick="reorder('${order.id}')"><i class="fas fa-redo"></i> Reorder</button>
                <button class="btn-action btn-contact" onclick="contactSeller('${order.sellerId}')"><i class="fab fa-whatsapp"></i> Contact</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Filter Tabs
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderOrders();
      });
    });

    function reorder(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (order) {
        localStorage.setItem('yanflows_cart', JSON.stringify(order.items.map(i => ({...i, productId: i.productId || i.id, stock: i.stock || 99}))));
        window.location.href = 'cart.html';
        YF.showToast('Items added to cart!', 'success');
      }
    }

    function contactSeller(sellerId) {
      window.location.href = `storefront.html?id=${sellerId}`;
    }
  </script>
</body>
</html>
