<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D; --light-gray: #ADB5BD;
      --coral: #FF6B6B; --teal: #4ECDC4; --gold: #FFD93D;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --radius-sm: 8px; --radius-md: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); min-height: 100vh; padding: 2rem 1rem; }
    
    .orders-container { max-width: 900px; margin: 0 auto; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--white); display: flex; align-items: center; justify-content: center; color: var(--navy); text-decoration: none; box-shadow: var(--shadow-sm); transition: var(--transition); }
    .back-btn:hover { transform: translateY(-2px); }
    .page-title { font-size: 1.75rem; font-weight: 700; color: var(--navy); }

    /* Dual Role Switcher */
    .role-switcher { display: grid; grid-template-columns: 1fr 1fr; background: #E5E7EB; padding: 4px; border-radius: 12px; margin-bottom: 1.5rem; }
    .role-btn { padding: 0.75rem; border: none; background: transparent; font-weight: 700; font-size: 1rem; color: var(--navy); cursor: pointer; border-radius: 10px; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .role-btn.active { background: var(--white); box-shadow: var(--shadow-sm); color: var(--navy-dark); }

    .filter-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
    .filter-tab { padding: 0.6rem 1.25rem; border-radius: var(--radius-md); background: var(--white); color: var(--gray); font-weight: 600; border: 1px solid #E5E7EB; cursor: pointer; white-space: nowrap; transition: var(--transition); }
    .filter-tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

    /* Redesigned Premium Cards matching Checkout Layout UI */
    .order-card { background: var(--white); border-radius: var(--radius-md); padding: 2rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; transition: var(--transition); border: 1px solid rgba(229, 231, 235, 0.6); }
    .order-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
    
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--light-bg); flex-wrap: wrap; gap: 0.5rem; }
    .order-id { font-weight: 700; font-size: 1.1rem; color: var(--navy); }
    .order-date { color: var(--gray); font-size: 0.9rem; margin-top: 0.25rem; }
    
    .order-status { padding: 0.4rem 1rem; border-radius: 30px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; tracking: 0.05em; }
    .status-pending { background: #FFF3CD; color: #856404; }
    .status-completed { background: #D4EDDA; color: #155724; }
    .status-cancelled { background: #F8D7DA; color: #721C24; }

    /* Delivery Context Blocks */
    .delivery-context-box { background: var(--light-bg); padding: 1.25rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; font-size: 0.95rem; border-left: 4px solid var(--teal); line-height: 1.5; }
    .delivery-context-box div { margin-bottom: 0.4rem; color: var(--navy-dark); }
    .delivery-context-box div:last-child { margin-bottom: 0; }
    .delivery-context-box strong { color: var(--navy); font-weight: 600; }

    .order-items { margin-bottom: 1.5rem; }
    .order-item { display: flex; align-items: center; gap: 1.25rem; padding: 1rem 0; border-bottom: 1px solid #E5E7EB; }
    .order-item:last-child { border-bottom: none; }
    .item-img { width: 60px; height: 60px; border-radius: var(--radius-sm); background: var(--light-bg); overflow: hidden; border: 1px solid #E5E7EB; }
    .item-img img { width: 100%; height: 100%; object-fit: cover; }
    .item-info { flex: 1; }
    .item-name { font-weight: 600; color: var(--navy); font-size: 1rem; margin-bottom: 0.25rem; }
    .item-qty { color: var(--gray); font-size: 0.85rem; }
    .item-price { font-weight: 700; color: var(--teal); font-size: 1rem; }
    
    .order-footer { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid var(--light-bg); padding-top: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
    .order-total { font-size: 1.25rem; font-weight: 800; color: var(--navy); }
    
    .order-actions { display: flex; gap: 0.75rem; align-items: center; }
    .btn-action { padding: 0.75rem 1.25rem; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none; transition: var(--transition); display: flex; align-items: center; gap: 0.5rem; }
    .btn-reorder { background: var(--navy); color: white; }
    .btn-reorder:hover { background: var(--navy-light); transform: translateY(-1px); }
    .btn-contact { background: linear-gradient(135deg, #25D366, #128C7E); color: white; box-shadow: var(--shadow-sm); }
    .btn-contact:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,211,102,0.2); }
    
    .select-status-dropdown { padding: 0.6rem 1rem; border-radius: var(--radius-sm); border: 2px solid #E5E7EB; font-weight: 600; font-size: 0.9rem; color: var(--navy); background: var(--white); outline: none; transition: var(--transition); }
    .select-status-dropdown:focus { border-color: var(--teal); }

    .empty-state { text-align: center; padding: 5rem 2rem; background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
    .empty-state i { font-size: 3.5rem; color: var(--light-gray); margin-bottom: 1.5rem; }
    .empty-state h3 { color: var(--navy); font-weight: 700; margin-bottom: 0.5rem; }
    .empty-state p { color: var(--gray); }
    
    .spinner-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6rem 2rem; background: var(--white); border-radius: var(--radius-md); }
    .custom-spinner { width: 50px; height: 50px; border: 4px solid #E5E7EB; border-top-color: var(--navy); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .yf-toast { position: fixed; top: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 0.75rem; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 9999; opacity: 0; transform: translateX(100%); transition: all 0.3s ease; font-weight: 600; font-size: 0.9rem; }
    .yf-toast.show { opacity: 1; transform: translateX(0); }
    .yf-toast--success { background: #2ECC71; color: white; }
    @media (max-width: 640px) { .order-header { flex-direction: column; align-items: flex-start; } .order-footer { flex-direction: column; align-items: flex-start; } .order-actions { width: 100%; justify-content: space-between; } }
  </style>
</head>
<body>
  <div class="orders-container">
    <div class="page-header">
      <div class="header-left">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="page-title">Order Dashboard</h1>
      </div>
    </div>

    <div class="role-switcher">
      <button class="role-btn active" id="buyerRoleTab" onclick="switchRole('buyer')">
        <i class="fas fa-shopping-bag"></i> My Purchases
      </button>
      <button class="role-btn" id="sellerRoleTab" onclick="switchRole('seller')">
        <i class="fas fa-store"></i> Received Orders
      </button>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="pending">Pending</button>
      <button class="filter-tab" data-filter="completed">Completed</button>
      <button class="filter-tab" data-filter="cancelled">Cancelled</button>
    </div>

    <div id="ordersList">
      <div class="spinner-box">
        <div class="custom-spinner"></div>
        <h3 style="color: var(--navy); font-weight:600;">Loading orders...</h3>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBJ4t5SDaryYcjIzG737tLPNIwXRnL9Qlc",
      authDomain: "yan-flow.firebaseapp.com",
      projectId: "yan-flow",
      storageBucket: "yan-flow.firebasestorage.app",
      messagingSenderId: "373204559623",
      appId: "1:373204559623:web:56e1c8abf07945c53187a2"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let buyerOrders = [];
    let sellerOrders = [];
    let activeRole = 'buyer'; 
    let currentFilter = 'all';
    let currentUid = "";

    function formatCurrency(amount) {
      return '₦' + Number(amount).toLocaleString('en-NG');
    }

    function formatDate(timestamp) {
      if(!timestamp) return 'Just Now';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = `yf-toast yf-toast--success`;
      toast.innerHTML = `<i class="fas fa-check-circle"></i><span>${message}</span>`;
      document.body.appendChild(toast);      
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        currentUid = user.uid;
        loadAllOrderData();
      }
    });

    async function loadAllOrderData() {
      try {
        // FALLBACK-SAFE QUERY ARCHITECTURE
        let buyerSnap, sellerSnap;
        try {
          buyerSnap = await db.collection('orders').where('buyerId', '==', currentUid).orderBy('createdAt', 'desc').get();
        } catch(e) {
          console.warn("Index building or missing for buyer tracking. Running client-side sort fallback.");
          buyerSnap = await db.collection('orders').where('buyerId', '==', currentUid).get();
        }

        try {
          sellerSnap = await db.collection('orders').where('sellerId', '==', currentUid).orderBy('createdAt', 'desc').get();
        } catch(e) {
          console.warn("Index building or missing for vendor tracking. Running client-side sort fallback.");
          sellerSnap = await db.collection('orders').where('sellerId', '==', currentUid).get();
        }

        buyerOrders = [];
        buyerSnap.forEach(doc => buyerOrders.push({ docId: doc.id, ...doc.data() }));
        if(buyerSnap.metadata.fromCache || !buyerOrders[0]?.createdAt?.seconds) {
          buyerOrders.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        }

        sellerOrders = [];
        sellerSnap.forEach(doc => sellerOrders.push({ docId: doc.id, ...doc.data() }));
        if(sellerSnap.metadata.fromCache || !sellerOrders[0]?.createdAt?.seconds) {
          sellerOrders.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        }

        renderOrders();
      } catch (err) {
        console.error(err);
        document.getElementById('ordersList').innerHTML = `<div class="empty-state"><i class="fas fa-bug"></i><h3>Unable to retrieve orders</h3><p>Please build indices if prompted in the console log errors.</p></div>`;
      }
    }

    function switchRole(role) {
      activeRole = role;
      document.getElementById('buyerRoleTab').classList.toggle('active', role === 'buyer');
      document.getElementById('sellerRoleTab').classList.toggle('active', role === 'seller');
      renderOrders();
    }

    function renderOrders() {
      const container = document.getElementById('ordersList');
      const collectionToRender = activeRole === 'buyer' ? buyerOrders : sellerOrders;
      const filtered = currentFilter === 'all' ? collectionToRender : collectionToRender.filter(o => o.status === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-shopping-bag"></i>
            <h3>No orders found</h3>
            <p>There are no logged orders matching status tracking inside your ${activeRole} stream pipeline.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(order => {
        const dateString = formatDate(order.createdAt);
        const statusClass = `status-${order.status || 'pending'}`;
        const statusLabel = (order.status || 'pending').toUpperCase();
        const delivery = order.deliveryDetails || {};
        
        const deliveryHtml = `
          <div class="delivery-context-box">
            <div><strong><i class="fas fa-user"></i> Recipient:</strong> ${delivery.fullName || order.buyerName || 'N/A'} (${delivery.phoneNumber || order.buyerPhone || 'N/A'})</div>
            <div><strong><i class="fas fa-map-marker-alt"></i> Destination:</strong> ${delivery.address1 || 'N/A'}${delivery.address2 ? ', ' + delivery.address2 : ''}, ${delivery.city || ''}, ${delivery.state || ''}</div>
            ${delivery.instructions ? `<div><strong><i class="fas fa-comment-dots"></i> Instructions:</strong> ${delivery.instructions}</div>` : ''}
          </div>
        `;

        let actionButtons = '';
        if (activeRole === 'buyer') {
          actionButtons = `
            <button class="btn-action btn-reorder" onclick="reorder('${order.docId}')"><i class="fas fa-redo"></i> Reorder</button>
            <button class="btn-action btn-contact" onclick="contactSeller('${delivery.phoneNumber || order.buyerPhone}')"><i class="fab fa-whatsapp"></i> Contact Vendor</button>
          `;
        } else {
          actionButtons = `
            <select class="select-status-dropdown" onchange="updateOrderStatus('${order.docId}', this.value)">
              <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
              <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>Completed</option>
              <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
            <button class="btn-action btn-contact" onclick="contactSeller('${delivery.phoneNumber || order.buyerPhone}')"><i class="fab fa-whatsapp"></i> Chat Buyer</button>
          `;
        }

        return `
          <div class="order-card">
            <div class="order-header">
              <div>
                <div class="order-id">Order ID: #${order.orderId || 'N/A'}</div>
                <div class="order-date">${dateString} • ${activeRole === 'buyer' ? `Vendor: ${order.sellerName || 'Merchant'}` : `Client: ${order.buyerName || 'Buyer'}`}</div>
              </div>
              <span class="order-status ${statusClass}">${statusLabel}</span>
            </div>
            
            ${deliveryHtml}

            <div class="order-items">
              ${(order.items || []).map(item => `
                <div class="order-item">
                  <div class="item-img"><img src="${item.image || 'https://via.placeholder.com/60'}" onerror="this.src='https://via.placeholder.com/60'"/></div>
                  <div class="item-info">
                    <div class="item-name">${item.name || 'Product'}</div>
                    <div class="item-qty">Quantity: ${item.quantity || 1}</div>
                  </div>
                  <div class="item-price">${formatCurrency((item.price || 0) * (item.quantity || 1))}</div>
                </div>
              `).join('')}
            </div>
            <div class="order-footer">
              <div class="order-total">Total: ${formatCurrency(order.total || 0)}</div>
              <div class="order-actions">${actionButtons}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateOrderStatus(docId, newStatus) {
      try {
        await db.collection('orders').doc(docId).update({ status: newStatus });
        showToast(`Order updated to ${newStatus.toUpperCase()}`);
        await loadAllOrderData();
      } catch (err) {
        alert('Failed to modify status configurations.');
      }
    }

    function reorder(docId) {
      const order = buyerOrders.find(o => o.docId === docId);
      if (order && order.items) {
        localStorage.setItem('yanflows_cart', JSON.stringify(order.items));
        window.location.href = 'cart.html';
      }
    }

    function contactSeller(phone) {
      if(!phone) { alert('No linked contact found.'); return; }
      window.open(`https://wa.me/${phone.replace(/\D/g, '')}`, '_blank');
    }

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderOrders();
      });
    });
  </script>
</body>
</html>
