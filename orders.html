<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Management | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* ========================================
       YAN-FLOWS - ORDERS PAGE STYLES
       Luxury Theme: Navy Blue + White + Accents
       ======================================== */
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D;
      --coral: #FF6B6B; --coral-hover: #EE5A5A;
      --teal: #4ECDC4; --teal-hover: #3DBDB4;
      --gold: #FFD93D; --danger: #FF4757;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --shadow-md: 0 4px 20px rgba(27, 58, 95, 0.12);
      --shadow-lg: 0 8px 40px rgba(27, 58, 95, 0.18);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --radius-sm: 8px; --radius-md: 16px;
      --space-sm: 1rem; --space-md: 2rem;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); color: var(--navy); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; }
    input, select { font-family: inherit; }

    /* ===== NAVBAR ===== */
    .navbar { background: var(--white); box-shadow: var(--shadow-sm); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
    .navbar-container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-sm); display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 800; color: var(--navy); }
    .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--navy), var(--teal)); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 700; }
    .nav-back { font-weight: 500; color: var(--gray); display: flex; align-items: center; gap: 0.5rem; }
    .nav-back:hover { color: var(--navy); }

    /* ===== MAIN CONTAINER ===== */
    .main-container { flex: 1; padding: var(--space-md) var(--space-sm); max-width: 1200px; margin: 0 auto; width: 100%; }
    
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); flex-wrap: wrap; gap: 1rem; }
    .page-title h1 { font-size: 1.75rem; color: var(--navy-dark); margin-bottom: 0.25rem; }
    .page-title p { color: var(--gray); font-size: 0.95rem; }

    /* Filter Tabs */    .filter-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .filter-tab {
      padding: 0.5rem 1rem; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 600;
      background: var(--white); color: var(--gray); border: 1px solid #E2E8F0; cursor: pointer; transition: var(--transition);
    }
    .filter-tab:hover { background: var(--light-bg); color: var(--navy); }
    .filter-tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .filter-tab .count { background: rgba(255,255,255,0.2); padding: 0.1rem 0.4rem; border-radius: 50%; font-size: 0.7rem; margin-left: 0.25rem; }
    .filter-tab.active .count { background: rgba(255,255,255,0.3); }

    /* Orders List */
    .orders-list { display: flex; flex-direction: column; gap: 1rem; }
    .order-card {
      background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
      overflow: hidden; transition: var(--transition); border-left: 4px solid var(--gray);
    }
    .order-card:hover { box-shadow: var(--shadow-md); }
    .order-card.status-pending { border-left-color: var(--gold); }
    .order-card.status-confirmed { border-left-color: var(--teal); }
    .order-card.status-processing { border-left-color: var(--navy-light); }
    .order-card.status-out_for_delivery { border-left-color: var(--coral); }
    .order-card.status-delivered { border-left-color: #2ED573; }
    .order-card.status-cancelled { border-left-color: var(--danger); }

    .order-header {
      padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; user-select: none;
    }
    .order-id { font-weight: 700; color: var(--navy-dark); }
    .order-date { font-size: 0.85rem; color: var(--gray); margin-top: 0.25rem; }
    .order-status-badge {
      padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    }
    .badge-pending { background: rgba(255,217,61,0.15); color: #B7860B; }
    .badge-confirmed { background: rgba(78,205,196,0.15); color: #1A8A7D; }
    .badge-processing { background: rgba(44,82,130,0.15); color: var(--navy-light); }
    .badge-out_for_delivery { background: rgba(255,107,107,0.15); color: var(--coral); }
    .badge-delivered { background: rgba(46,213,115,0.15); color: #15803D; }
    .badge-cancelled { background: rgba(255,71,87,0.15); color: var(--danger); }

    .order-details {
      padding: 0 1.25rem; max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease;
    }
    .order-card.expanded .order-details { max-height: 1000px; padding: 0 1.25rem 1.25rem; }
    .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .detail-item h4 { font-size: 0.8rem; color: var(--gray); text-transform: uppercase; margin-bottom: 0.25rem; }
    .detail-item p { font-weight: 500; color: var(--navy); }
    .order-items { margin: 1rem 0; }
    .order-item-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px dashed #F1F5F9; font-size: 0.9rem; }
    .order-item-row:last-child { border-bottom: none; }    .order-totals { background: var(--light-bg); padding: 1rem; border-radius: var(--radius-sm); margin-top: 1rem; }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    .total-row.grand { font-weight: 800; color: var(--navy-dark); font-size: 1.1rem; border-top: 1px solid #E2E8F0; padding-top: 0.5rem; margin-top: 0.5rem; }

    /* Status Update Actions */
    .status-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #F1F5F9; }
    .status-btn {
      padding: 0.5rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600;
      border: 1px solid #E2E8F0; background: var(--white); color: var(--gray); cursor: pointer; transition: var(--transition);
    }
    .status-btn:hover { background: var(--light-bg); color: var(--navy); }
    .status-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .status-btn.cancel { border-color: var(--danger); color: var(--danger); }
    .status-btn.cancel:hover { background: var(--danger); color: var(--white); }

    /* Empty State */
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--gray); }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
    .empty-state h3 { color: var(--navy); margin-bottom: 0.5rem; }

    /* Toast */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--white); padding: 1rem 1.25rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 0.75rem; min-width: 280px; transform: translateX(120%); transition: transform 0.3s ease; border-left: 4px solid var(--coral); }
    .toast.success { border-left-color: var(--teal); }
    .toast.show { transform: translateX(0); }

    /* Responsive */
    @media (max-width: 768px) {
      .details-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .status-actions { flex-direction: column; }
      .status-btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="dashboard.html" class="logo">
        <div class="logo-icon">YF</div>
        YAN-FLOWS
      </a>
      <a href="dashboard.html" class="nav-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
  </nav>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>
  <!-- Main Content -->
  <main class="main-container">
    <header class="page-header">
      <div class="page-title">
        <h1>Order Management</h1>
        <p>Track, update, and fulfill customer orders</p>
      </div>
    </header>

    <!-- Filter Tabs -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-status="all">All <span class="count" id="count-all">0</span></button>
      <button class="filter-tab" data-status="pending">Pending <span class="count" id="count-pending">0</span></button>
      <button class="filter-tab" data-status="confirmed">Confirmed <span class="count" id="count-confirmed">0</span></button>
      <button class="filter-tab" data-status="processing">Processing <span class="count" id="count-processing">0</span></button>
      <button class="filter-tab" data-status="out_for_delivery">Out for Delivery <span class="count" id="count-out_for_delivery">0</span></button>
      <button class="filter-tab" data-status="delivered">Delivered <span class="count" id="count-delivered">0</span></button>
      <button class="filter-tab" data-status="cancelled">Cancelled <span class="count" id="count-cancelled">0</span></button>
    </div>

    <!-- Orders List -->
    <div class="orders-list" id="ordersList">
      <div class="empty-state" id="emptyState">
        <i class="fas fa-inbox"></i>
        <h3>No orders yet</h3>
        <p>When customers place orders, they will appear here in real-time.</p>
      </div>
    </div>
  </main>

  <!-- Core Engine -->
  <script src="app.js"></script>

  <!-- Page Script -->
  <script>
    // ===== DOM ELEMENTS =====
    const ordersList = document.getElementById('ordersList');
    const emptyState = document.getElementById('emptyState');
    const filterTabs = document.getElementById('filterTabs');
    const toastContainer = document.getElementById('toastContainer');

    // State
    let allOrders = [];
    let currentFilter = 'all';
    let currentUser = null;

    // ===== AUTH GUARD =====
    YF.requireAuth('login.html');
    // Initialize
    firebase.auth().onAuthStateChanged(async user => {
      if (!user) return;
      currentUser = user;
      setupRealtimeOrders();
    });

    // ===== REALTIME ORDERS LISTENER =====
    function setupRealtimeOrders() {
      if (!currentUser) return;
      
      firebase.firestore().collection('orders')
        .where('sellerId', '==', currentUser.uid)
        .orderBy('createdAt', 'desc')
        .onSnapshot(snapshot => {
          allOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          updateCounts();
          renderOrders();
        }, error => {
          console.error('Orders listener error:', error);
          YF.ui.toast('Failed to load orders.', 'error');
        });
    }

    // ===== UPDATE COUNTS =====
    function updateCounts() {
      const counts = { all: allOrders.length, pending: 0, confirmed: 0, processing: 0, out_for_delivery: 0, delivered: 0, cancelled: 0 };
      
      allOrders.forEach(order => {
        if (counts.hasOwnProperty(order.status)) {
          counts[order.status]++;
        }
      });

      document.getElementById('count-all').textContent = counts.all;
      document.getElementById('count-pending').textContent = counts.pending;
      document.getElementById('count-confirmed').textContent = counts.confirmed;
      document.getElementById('count-processing').textContent = counts.processing;
      document.getElementById('count-out_for_delivery').textContent = counts.out_for_delivery;
      document.getElementById('count-delivered').textContent = counts.delivered;
      document.getElementById('count-cancelled').textContent = counts.cancelled;
    }

    // ===== RENDER ORDERS =====
    function renderOrders() {
      const filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);
      
      if (allOrders.length === 0) {
        ordersList.innerHTML = '';
        ordersList.appendChild(emptyState);        emptyState.style.display = 'block';
        return;
      }

      ordersList.innerHTML = '';
      
      if (filtered.length === 0) {
        const noMatch = document.createElement('div');
        noMatch.className = 'empty-state';
        noMatch.innerHTML = `<i class="fas fa-filter"></i><h3>No ${currentFilter} orders</h3><p>Try changing the filter to see other orders.</p>`;
        ordersList.appendChild(noMatch);
        return;
      }

      filtered.forEach(order => {
        const card = document.createElement('div');
        card.className = `order-card status-${order.status}`;
        card.dataset.id = order.id;
        
        const date = order.createdAt ? YF.ui.formatDate(order.createdAt) : 'Just now';
        const statusBadge = `<span class="order-status-badge badge-${order.status}">${order.status.replace(/_/g, ' ')}</span>`;
        
        // Build items list
        const itemsHtml = order.items.map(item => `
          <div class="order-item-row">
            <span>${item.name} x${item.qty}</span>
            <span>${YF.ui.formatNaira(item.price * item.qty)}</span>
          </div>
        `).join('');

        // Build status buttons
        const statusButtons = getStatusButtons(order.status);

        card.innerHTML = `
          <div class="order-header" onclick="toggleOrder('${order.id}')">
            <div>
              <div class="order-id">Order #${order.id.substring(0, 8).toUpperCase()}</div>
              <div class="order-date">${date}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-weight:700; color:var(--navy-dark); margin-bottom:0.25rem;">${YF.ui.formatNaira(order.totals.grandTotal)}</div>
              ${statusBadge}
            </div>
          </div>
          <div class="order-details" id="details-${order.id}">
            <div class="details-grid">
              <div class="detail-item">
                <h4>Customer</h4>
                <p>${order.customer.name}</p>
                <p style="font-size:0.9rem; color:var(--gray);">${order.customer.phone}</p>              </div>
              <div class="detail-item">
                <h4>Delivery Address</h4>
                <p>${order.customer.address}, ${order.customer.city}</p>
                ${order.customer.note ? `<p style="font-size:0.85rem; color:var(--gray); margin-top:0.25rem;"><i class="fas fa-sticky-note"></i> ${order.customer.note}</p>` : ''}
              </div>
            </div>
            
            <div class="order-items">
              <h4 style="font-size:0.9rem; color:var(--gray); margin-bottom:0.5rem;">Items Ordered</h4>
              ${itemsHtml}
            </div>

            <div class="order-totals">
              <div class="total-row"><span>Subtotal</span><span>${YF.ui.formatNaira(order.totals.subtotal)}</span></div>
              <div class="total-row"><span>Delivery Fee</span><span>${YF.ui.formatNaira(order.totals.delivery)}</span></div>
              <div class="total-row grand"><span>Total</span><span>${YF.ui.formatNaira(order.totals.grandTotal)}</span></div>
            </div>

            <div class="status-actions">
              ${statusButtons}
            </div>
          </div>
        `;
        ordersList.appendChild(card);
      });
    }

    // ===== GET STATUS BUTTONS =====
    function getStatusButtons(currentStatus) {
      const statuses = [
        { id: 'pending', label: 'Pending' },
        { id: 'confirmed', label: 'Confirmed' },
        { id: 'processing', label: 'Processing' },
        { id: 'out_for_delivery', label: 'Out for Delivery' },
        { id: 'delivered', label: 'Delivered' },
        { id: 'cancelled', label: 'Cancelled' }
      ];

      // Define valid transitions
      const transitions = {
        pending: ['confirmed', 'cancelled'],
        confirmed: ['processing', 'cancelled'],
        processing: ['out_for_delivery', 'cancelled'],
        out_for_delivery: ['delivered', 'cancelled'],
        delivered: [],
        cancelled: []
      };

      const allowed = transitions[currentStatus] || [];      
      return statuses
        .filter(s => allowed.includes(s.id))
        .map(s => `
          <button class="status-btn ${currentStatus === s.id ? 'active' : ''} ${s.id === 'cancelled' ? 'cancel' : ''}" 
                  onclick="updateOrderStatus('${s.id}', this)">
            ${s.label}
          </button>
        `).join('');
    }

    // ===== TOGGLE ORDER DETAILS =====
    window.toggleOrder = (id) => {
      const details = document.getElementById(`details-${id}`);
      const card = details.parentElement;
      const isExpanded = card.classList.contains('expanded');
      
      // Close all others
      document.querySelectorAll('.order-card.expanded').forEach(c => c.classList.remove('expanded'));
      
      if (!isExpanded) {
        card.classList.add('expanded');
      }
    };

    // ===== UPDATE ORDER STATUS =====
    window.updateOrderStatus = async (newStatus, btn) => {
      const card = btn.closest('.order-card');
      const orderId = card.dataset.id;
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

      try {
        await firebase.firestore().collection('orders').doc(orderId).update({
          status: newStatus,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        YF.ui.toast(`Order marked as ${newStatus.replace(/_/g, ' ')}! ✅`, 'success');
      } catch (err) {
        console.error('Update error:', err);
        YF.ui.toast('Failed to update order status.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = btn.textContent.replace('Updating...', '').trim();
      }
    };

    // ===== FILTER TABS =====    filterTabs.addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-tab') || e.target.closest('.filter-tab')) {
        const tab = e.target.closest('.filter-tab');
        currentFilter = tab.dataset.status;
        
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        renderOrders();
      }
    });

    console.log('✅ Orders Management Page Loaded');
    console.log('🔄 Real-time Firestore Listener Active');
    console.log('📊 Status Workflow & Filtering Ready');
  </script>
<script src="app.js"></script>
</body>
</html>
