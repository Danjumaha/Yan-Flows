<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Product | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D;
      --coral: #FF6B6B; --teal: #4ECDC4; --gold: #FFD93D;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --radius-sm: 8px; --radius-md: 16px;
      --transition: all 0.3s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); min-height: 100vh; }

    .top-nav { position: fixed; top: 0; left: 0; right: 0; height: 64px; background: var(--white); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; z-index: 1000; }
    .nav-logo { display: flex; align-items: center; gap: 0.75rem; font-size: 1.5rem; font-weight: 800; color: var(--navy); text-decoration: none; }
    .nav-logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--navy), var(--teal)); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; }
    .nav-actions { display: flex; gap: 0.75rem; }
    .nav-btn { padding: 0.5rem 1rem; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; text-decoration: none; transition: var(--transition); cursor: pointer; border: none; background: var(--light-bg); color: var(--navy); }
    .nav-btn:hover { background: #E5E7EB; }
    .nav-btn.primary { background: var(--navy); color: white; }
    .nav-btn.primary:hover { background: var(--navy-light); }

    .container { max-width: 800px; margin: 90px auto 2rem; padding: 0 1.5rem; }
    .page-header { background: var(--white); border-radius: var(--radius-md); padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--shadow-sm); }
    .page-header h1 { font-size: 1.5rem; color: var(--navy); font-weight: 700; margin-bottom: 0.5rem; }
    .page-header p { color: var(--gray); font-size: 0.95rem; }

    .form-card { background: var(--white); border-radius: var(--radius-md); padding: 2rem; box-shadow: var(--shadow-sm); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 0; }
    .form-group.full { grid-column: 1/-1; }
    .form-label { display: block; font-weight: 600; color: var(--navy); margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 0.875rem 1rem; border: 2px solid #E5E7EB; border-radius: var(--radius-sm); font-size: 1rem; font-family: inherit; transition: var(--transition); background: var(--white); }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(78,205,196,0.15); }
    .form-textarea { resize: vertical; min-height: 120px; }
    
    .image-upload { border: 2px dashed #E5E7EB; border-radius: var(--radius-sm); padding: 2rem; text-align: center; cursor: pointer; transition: var(--transition); margin-bottom: 1.5rem; }
    .image-upload:hover { border-color: var(--teal); background: rgba(78,205,196,0.05); }
    .image-upload i { font-size: 2.5rem; color: var(--gray); margin-bottom: 0.5rem; }
    .image-upload input { display: none; }
    .image-preview { max-width: 100%; max-height: 200px; border-radius: var(--radius-sm); margin-top: 1rem; display: none; }
    .image-preview.show { display: block; }
    .btn-submit { width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--navy), var(--navy-light)); color: white; border: none; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 700; cursor: pointer; transition: var(--transition); }
    .btn-submit:hover { opacity: 0.95; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .yf-toast { position: fixed; top: 80px; right: 2rem; padding: 1rem 1.5rem; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 0.75rem; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 9999; opacity: 0; transform: translateX(100%); transition: all 0.3s ease; font-weight: 600; font-size: 0.9rem; }
    .yf-toast.show { opacity: 1; transform: translateX(0); }
    .yf-toast--success { background: #2ECC71; color: white; }
    .yf-toast--error { background: var(--coral); color: white; }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .container { padding: 0 1rem; }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="dashboard.html" class="nav-logo">
      <div class="nav-logo-icon">YF</div>
      <span>YAN-FLOWS</span>
    </a>
    <div class="nav-actions">
      <a href="profile.html" class="nav-btn">Back to Profile</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1 id="pageTitle">📦 Add New Product</h1>
      <p id="pageSubtitle">Fill in the details below to list your product</p>
    </div>

    <form class="form-card" id="productForm">
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label">Product Name *</label>
          <input type="text" id="productName" class="form-input" required placeholder="e.g., Premium Sneakers"/>
        </div>
        <div class="form-group">
          <label class="form-label">Price (₦) *</label>
          <input type="number" id="productPrice" class="form-input" required min="0" step="0.01" placeholder="5000"/>
        </div>
        <div class="form-group">
          <label class="form-label">Stock Quantity *</label>
          <input type="number" id="productStock" class="form-input" required min="0" placeholder="10"/>
        </div>
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select id="productCategory" class="form-select" required>
            <option value="">Select Category</option>            <option value="Fashion">Fashion</option>
            <option value="Food">Food</option>
            <option value="Electronics">Electronics</option>
            <option value="Beauty">Beauty</option>
            <option value="Home">Home & Living</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group full">
          <label class="form-label">Description *</label>
          <textarea id="productDescription" class="form-textarea" required placeholder="Describe your product..."></textarea>
        </div>
      </div>

      <label class="form-label">Product Image</label>
      <div class="image-upload" onclick="document.getElementById('productImage').click()">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>Click to upload image</p>
        <small style="color:var(--gray)">JPG, PNG up to 5MB</small>
        <input type="file" id="productImage" accept="image/*" onchange="previewImage(event)"/>
      </div>
      <img id="imagePreview" class="image-preview" alt="Preview"/>

      <button type="submit" class="btn-submit" id="submitBtn"><i class="fas fa-save"></i> <span id="btnText">Save Product</span></button>
    </form>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBJ4t5SDaryYcjIzG737tLPNIwXRnL9Qlc",
      authDomain: "yan-flow.firebaseapp.com",
      projectId: "yan-flow",
      storageBucket: "yan-flow.firebasestorage.app",
      messagingSenderId: "373204559623",
      appId: "1:373204559623:web:56e1c8abf07945c53187a2"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `yf-toast yf-toast--${type}`;
      toast.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle':'fa-exclamation-circle'}"></i><span>${message}</span>`;
      document.body.appendChild(toast);      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    let currentUser = null, editProductId = null, uploadedImageUrl = '';

    auth.onAuthStateChanged((user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      checkEditMode();
    });

    // Check if editing existing product
    function checkEditMode() {
      const params = new URLSearchParams(window.location.search);
      editProductId = params.get('edit');
      
      if (editProductId) {
        document.getElementById('pageTitle').textContent = '✏️ Edit Product';
        document.getElementById('pageSubtitle').textContent = 'Update your product details';
        document.getElementById('btnText').textContent = 'Update Product';
        loadProductData(editProductId);
      }
    }

    // Load existing product data into form
    async function loadProductData(productId) {
      try {
        const doc = await db.collection('products').doc(productId).get();
        if (!doc.exists) { showToast('Product not found', 'error'); setTimeout(()=>window.location.href='profile.html',1500); return; }
        
        const product = doc.data();
        document.getElementById('productName').value = product.name || '';
        document.getElementById('productPrice').value = product.price || '';
        document.getElementById('productStock').value = product.stock || '';
        document.getElementById('productCategory').value = product.category || '';
        document.getElementById('productDescription').value = product.description || '';
        
        if (product.image) {
          uploadedImageUrl = product.image;
          const preview = document.getElementById('imagePreview');
          preview.src = product.image;
          preview.classList.add('show');
        }
      } catch (error) {
        console.error('Load product error:', error);
        showToast('Error loading product', 'error');
      }
    }
    // Image preview
    window.previewImage = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { showToast('Image too large (max 5MB)', 'error'); return; }
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.classList.add('show');
      };
      reader.readAsDataURL(file);
    };

    // Upload image to Cloudinary
    async function uploadImage(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', 'Yan-Flow');
      
      const res = await fetch('https://api.cloudinary.com/v1_1/dytzpxabq/image/upload', { method: 'POST', body: formData });
      const data = await res.json();
      return data.secure_url;
    }

    // Form submit
    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      try {
        const file = document.getElementById('productImage').files[0];
        let imageUrl = uploadedImageUrl; // Keep existing if not changed
        
        if (file) {
          showToast('Uploading image...', 'info');
          imageUrl = await uploadImage(file);
        }

        const productData = {
          name: document.getElementById('productName').value.trim(),
          price: parseFloat(document.getElementById('productPrice').value),
          stock: parseInt(document.getElementById('productStock').value),
          category: document.getElementById('productCategory').value,
          description: document.getElementById('productDescription').value.trim(),
          image: imageUrl,
          sellerId: currentUser.uid,          sellerName: currentUser.displayName || 'Seller',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (editProductId) {
          // Update existing
          await db.collection('products').doc(editProductId).update(productData);
          showToast('✅ Product updated!', 'success');
        } else {
          // Create new
          productData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          productData.views = 0;
          await db.collection('products').add(productData);
          showToast('✅ Product listed!', 'success');
        }
        
        setTimeout(() => window.location.href = 'profile.html', 1500);
      } catch (error) {
        console.error('Save error:', error);
        showToast('Error: ' + error.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> <span id="btnText">' + (editProductId ? 'Update Product' : 'Save Product') + '</span>';
      }
    });
  </script>
</body>
</html>
