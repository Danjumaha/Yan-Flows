<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In | YAN-FLOWS</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    :root {
      --navy: #1B3A5F;
      --navy-dark: #0F1F33;
      --navy-light: #2C5282;
      --white: #FFFFFF;
      --light-bg: #F8F9FA;
      --gray: #6C757D;
      --light-gray: #ADB5BD;
      --coral: #FF6B6B;
      --teal: #4ECDC4;
      --gold: #FFD93D;
      --shadow-lg: 0 8px 40px rgba(27, 58, 95, 0.18);
      --radius-sm: 8px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #F8F9FA 0%, #E8EEF5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .login-logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--navy), var(--teal));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .login-logo-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--navy-dark);
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      color: var(--gray);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .form-label {
      display: block;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .input-wrapper { position: relative; }

    .form-input {
      width: 100%;
      padding: 0.875rem 1rem;
      padding-right: 2.75rem;
      border: 2px solid #E5E7EB;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      transition: var(--transition);
      background: var(--white);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.15);
    }

    .form-input.error { border-color: var(--coral); }
    .form-input.success { border-color: #2ECC71; }

    .input-icon {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--light-gray);
      cursor: pointer;
      transition: var(--transition);
      z-index: 2;
    }
    .input-icon:hover { color: var(--navy); }

    .validation-icon {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      opacity: 0;
      transition: var(--transition);
      pointer-events: none;
    }
    .validation-icon.show { opacity: 1; }
    .validation-icon.valid { color: #2ECC71; }
    .validation-icon.invalid { color: var(--coral); }

    .error-message {
      color: var(--coral);
      font-size: 0.8rem;
      margin-top: 0.375rem;
      display: none;
      align-items: center;
      gap: 0.375rem;
    }
    .error-message.show { display: flex; }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .checkbox-wrapper input {
      width: 18px;
      height: 18px;
      accent-color: var(--teal);
      cursor: pointer;
    }
    .checkbox-wrapper span { font-size: 0.9rem; color: var(--gray); }

    .forgot-link {
      color: var(--teal);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .forgot-link:hover { text-decoration: underline; }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-submit .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    .btn-submit.loading .spinner { display: block; }
    .btn-submit.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .signup-link {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #E5E7EB;
    }
    .signup-link p { color: var(--gray); font-size: 0.9rem; }
    .signup-link a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 700;
    }
    .signup-link a:hover { text-decoration: underline; }

    /* Toast */
    .yf-toast {
      position: fixed;
      top: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: var(--shadow-lg);
      z-index: 9999;
      opacity: 0;
      transform: translateX(100%);
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 0.9rem;
      pointer-events: none;
      max-width: 350px;
    }
    .yf-toast.show {
      opacity: 1;
      transform: translateX(0);
    }
    .yf-toast--success { background: #2ECC71; color: white; }
    .yf-toast--error { background: var(--coral); color: white; }
    .yf-toast--info { background: var(--navy); color: white; }

    /* Loading Overlay */
    .yf-loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 31, 51, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: white;
    }
    .yf-loading__spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    .yf-loading p { font-weight: 600; font-size: 1rem; }

    @media (max-width: 480px) {
      .login-card { padding: 1.5rem; }
      .login-title { font-size: 1.5rem; }
      .form-options { flex-direction: column; align-items: flex-start; }
      .yf-toast {
        top: 1rem; right: 1rem; left: 1rem;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">

      <!-- Header -->
      <div class="login-header">
        <div class="login-logo">
          <div class="login-logo-icon">YF</div>
          <span class="login-logo-text">YAN-FLOWS</span>
        </div>
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to continue to your dashboard</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-input" placeholder="Enter your email" autocomplete="email" required/>
            <i class="fas fa-check validation-icon" id="emailValid"></i>
          </div>
          <div class="error-message" id="emailError">
            <i class="fas fa-exclamation-circle"></i>
            <span>Please enter a valid email address</span>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required/>
            <i class="fas fa-eye input-icon" id="togglePassword"></i>
          </div>
          <div class="error-message" id="passwordError">
            <i class="fas fa-exclamation-circle"></i>
            <span>Password is required</span>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-options">
          <label class="checkbox-wrapper">
            <input type="checkbox" id="rememberMe"/>
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text">Sign In</span>
          <div class="spinner"></div>
        </button>
      </form>

      <!-- Sign Up Link -->
      <div class="signup-link">
        <p>Don't have an account? <a href="signup.html">Create Account</a></p>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- Core Engine -->
  <script src="app.js"></script>

  <!-- Login Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      console.log('✅ Login page loaded');

      // ===== DOM Elements =====
      const form             = document.getElementById('loginForm');
      const emailInput       = document.getElementById('email');
      const passwordInput    = document.getElementById('password');
      const submitBtn        = document.getElementById('submitBtn');
      const rememberMeChk    = document.getElementById('rememberMe');
      const togglePassword   = document.getElementById('togglePassword');
      const emailValidIcon   = document.getElementById('emailValid');
      const emailError       = document.getElementById('emailError');
      const passwordError    = document.getElementById('passwordError');

      // ===== Auto-fill remembered email =====
      const rememberedEmail = localStorage.getItem('rememberedEmail');
      if (rememberedEmail && YF.isValidEmail(rememberedEmail)) {
        emailInput.value = rememberedEmail;
        rememberMeChk.checked = true;
        emailInput.classList.add('success');
        emailValidIcon.classList.add('show', 'valid');
      }

      // ===== Toggle Password Visibility =====
      togglePassword.addEventListener('click', (e) => {
        e.preventDefault();
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        togglePassword.classList.toggle('fa-eye', !isHidden);
        togglePassword.classList.toggle('fa-eye-slash', isHidden);
        passwordInput.focus();
      });

      // ===== Field Validation Helper =====
      function setFieldState(input, validIcon, errorEl, isValid, errorMsg) {
        const value = input.value.trim();

        if (!value) {
          input.classList.remove('success', 'error');
          if (validIcon) validIcon.classList.remove('show', 'valid', 'invalid');
          if (errorEl)  errorEl.classList.remove('show');
          return;
        }

        input.classList.toggle('success', isValid);
        input.classList.toggle('error', !isValid);

        if (validIcon) {
          validIcon.classList.add('show');
          validIcon.classList.toggle('valid', isValid);
          validIcon.classList.toggle('invalid', !isValid);
        }

        if (errorEl) {
          const span = errorEl.querySelector('span');
          if (span) span.textContent = errorMsg;
          errorEl.classList.toggle('show', !isValid);
        }
      }

      // Real-time email validation
      emailInput.addEventListener('input', () => {
        setFieldState(
          emailInput, emailValidIcon, emailError,
          YF.isValidEmail(emailInput.value.trim()),
          'Please enter a valid email address'
        );
      });

      // Real-time password validation
      passwordInput.addEventListener('input', () => {
        setFieldState(
          passwordInput, null, passwordError,
          passwordInput.value.length > 0,
          'Password is required'
        );
      });

      // ===== Form Submission =====
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email    = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        // Client-side validation
        let hasError = false;

        if (!YF.isValidEmail(email)) {
          setFieldState(emailInput, emailValidIcon, emailError, false, 'Please enter a valid email address');
          emailInput.focus();
          hasError = true;
        }

        if (password.length === 0) {
          setFieldState(passwordInput, null, passwordError, false, 'Password is required');
          if (!hasError) passwordInput.focus();
          hasError = true;
        }

        if (hasError) {
          YF.showToast('Please fix the errors above', 'error');
          return;
        }

        // Start loading
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
        YF.showLoading('Signing in...');

        try {
          const userCredential = await auth.signInWithEmailAndPassword(email, password);
          const user = userCredential.user;
          console.log('✅ Login successful:', user.uid);

          // Save "Remember Me"
          if (rememberMeChk.checked) {
            localStorage.setItem('rememberedEmail', email);
          } else {
            localStorage.removeItem('rememberedEmail');
          }

          YF.hideLoading();
          YF.showToast('✅ Welcome back! Redirecting...', 'success');

          setTimeout(() => {
            YF.redirectAfterLogin(user);
          }, 1200);

        } catch (error) {
          YF.hideLoading();
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;

          console.error('Login error:', error.code, error.message);

          const errorMessages = {
            'auth/user-not-found'        : 'No account found with this email. <a href="signup.html" style="color:white;text-decoration:underline">Sign up instead?</a>',
            'auth/wrong-password'        : 'Incorrect password. <a href="forgot-password.html" style="color:white;text-decoration:underline">Reset password?</a>',
            'auth/invalid-email'         : 'Invalid email format. Please check and try again.',
            'auth/too-many-requests'     : 'Too many failed attempts. Please wait a few minutes.',
            'auth/network-request-failed': 'Network error. Check your internet connection.',
            'auth/invalid-credential'    : 'Invalid credentials. Please check your email and password.',
            'auth/user-disabled'         : 'This account has been disabled. Contact support.'
          };

          const message = errorMessages[error.code] || 'Invalid email or password. Please try again.';

          const toast = document.createElement('div');
          toast.className = 'yf-toast yf-toast--error';
          toast.innerHTML = `<i class="fas fa-exclamation-circle"></i><span>${message}</span>`;
          document.body.appendChild(toast);
          requestAnimationFrame(() => toast.classList.add('show'));

          setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
          }, 7000);

        } finally {
          submitBtn.disabled = false;
        }
      });

      // Enter key support on password field
      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !submitBtn.disabled) {
          form.requestSubmit();
        }
      });

      console.log('✅ Login page fully initialized');
    });
  </script>
</body>
</html>
