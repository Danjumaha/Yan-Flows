<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | YAN-FLOWS Commerce Platform</title>
  <meta name="description" content="Secure login to your YAN-FLOWS seller or buyer dashboard. Manage orders, products, and growth."/>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* ========================================
       YAN-FLOWS - LOGIN PAGE STYLES
       Luxury Theme: Navy Blue + White + Accents
       ======================================== */
    :root {
      --navy: #1B3A5F;
      --navy-dark: #0F1F33;
      --navy-light: #2C5282;
      --white: #FFFFFF;
      --light-bg: #F8F9FA;
      --gray: #6C757D;
      --light-gray: #ADB5BD;
      --coral: #FF6B6B;
      --coral-hover: #EE5A5A;
      --teal: #4ECDC4;
      --teal-hover: #3DBDB4;
      --gold: #FFD93D;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --shadow-md: 0 4px 20px rgba(27, 58, 95, 0.12);
      --shadow-lg: 0 8px 40px rgba(27, 58, 95, 0.18);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-full: 9999px;
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 2rem;
      --space-lg: 4rem;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--light-bg) 0%, #E8EDF2 100%);
      color: var(--navy);      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { text-decoration: none; color: inherit; transition: var(--transition); }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input { font-family: inherit; }

    /* ===== NAVBAR ===== */
    .navbar {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--space-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--navy), var(--teal));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-weight: 700;
      font-size: 1rem;
    }
    .nav-link {
      font-weight: 500;
      color: var(--gray);      padding: 0.5rem 1rem;
      border-radius: var(--radius-full);
    }
    .nav-link:hover { color: var(--navy); background: rgba(27,58,95,0.05); }

    /* ===== MAIN LAYOUT ===== */
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md) var(--space-sm);
    }
    .auth-card {
      background: var(--white);
      width: 100%;
      max-width: 460px;
      padding: var(--space-md);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      text-align: center;
      animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header h1 {
      font-size: 1.75rem;
      margin-bottom: 0.25rem;
      color: var(--navy-dark);
    }
    .auth-header p {
      color: var(--gray);
      margin-bottom: var(--space-md);
      font-size: 0.95rem;
    }

    /* ===== FORM ELEMENTS ===== */
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
      position: relative;
    }
    .form-label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;      margin-bottom: 0.5rem;
      color: var(--navy);
    }
    .input-wrapper {
      position: relative;
    }
    .form-input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid #E2E8F0;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      transition: var(--transition);
      background: var(--light-bg);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--teal);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.15);
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      cursor: pointer;
      font-size: 1.1rem;
      transition: var(--transition);
    }
    .toggle-password:hover { color: var(--navy); }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .form-actions a {
      color: var(--navy-light);
      font-weight: 500;
    }
    .form-actions a:hover { color: var(--coral); text-decoration: underline; }

    .btn {
      width: 100%;
      padding: 1rem;
      font-weight: 600;      font-size: 1rem;
      border-radius: var(--radius-full);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: var(--coral);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }
    .btn-primary:hover {
      background: var(--coral-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: var(--light-gray);
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E2E8F0;
    }
    .divider span { padding: 0 1rem; }

    .btn-google {
      background: var(--white);
      border: 2px solid #E2E8F0;
      color: var(--navy);
    }
    .btn-google:hover {
      background: var(--light-bg);
      border-color: var(--navy-light);
    }

    .auth-footer {      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--gray);
    }
    .auth-footer a {
      color: var(--teal);
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    /* ===== TOAST NOTIFICATION ===== */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: var(--white);
      padding: 1rem 1.25rem;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 280px;
      transform: translateX(120%);
      transition: transform 0.3s ease;
      border-left: 4px solid var(--coral);
    }
    .toast.success { border-left-color: var(--teal); }
    .toast.show { transform: translateX(0); }
    .toast-icon { font-size: 1.25rem; }
    .toast.success .toast-icon { color: var(--teal); }
    .toast.error .toast-icon { color: var(--coral); }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--gray);
      font-size: 0.85rem;
      background: var(--white);
      border-top: 1px solid #E2E8F0;
    }

    /* ===== RESPONSIVE ===== */    @media (max-width: 480px) {
      .auth-card { padding: 1.5rem 1.25rem; }
      h1 { font-size: 1.5rem !important; }
      .form-actions { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">YF</div>
        YAN-FLOWS
      </a>
      <a href="index.html" class="nav-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </nav>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main Content -->
  <main class="main-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Log in to manage your store, orders, and analytics</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email"/>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password"/>
            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
          </div>
        </div>

        <div class="form-actions">
          <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
            <input type="checkbox" id="rememberMe" style="accent-color:var(--navy);"/>            <span>Remember me</span>
          </label>
          <a href="#" id="forgotPasswordLink">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i>
          <span>Log In</span>
        </button>
      </form>

      <div class="divider"><span>or continue with</span></div>

      <button class="btn btn-google" id="googleLoginBtn">
        <i class="fab fa-google"></i>
        <span>Google Account</span>
      </button>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create one free</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2026 YAN-FLOWS. Secure authentication powered by Firebase.
  </footer>

  <!-- Firebase SDK (Compat for single-file usage) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- Page Script -->
  <script>
    // ===== FIREBASE INITIALIZATION =====
    const firebaseConfig = {
      apiKey: "AIzaSyBJ4t5SDaryYcjIzG737tLPNIwXRnL9Qlc",
      authDomain: "yan-flow.firebaseapp.com",
      projectId: "yan-flow",
      storageBucket: "yan-flow.firebasestorage.app",
      messagingSenderId: "373204559623",
      appId: "1:373204559623:web:56e1c8abf07945c53187a2",
      measurementId: "G-4PC6ENND61"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ===== DOM ELEMENTS =====    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const googleBtn = document.getElementById('googleLoginBtn');
    const togglePass = document.getElementById('togglePassword');
    const forgotLink = document.getElementById('forgotPasswordLink');
    const toastContainer = document.getElementById('toastContainer');

    // ===== CHECK AUTH STATE =====
    auth.onAuthStateChanged(user => {
      if (user) {
        // Already logged in, redirect to dashboard
        window.location.replace('dashboard.html');
      }
    });

    // ===== TOAST NOTIFICATION SYSTEM =====
    function showToast(message, type = 'error') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <i class="toast-icon fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
        <span>${message}</span>
      `;
      toastContainer.appendChild(toast);
      
      // Trigger animation
      requestAnimationFrame(() => toast.classList.add('show'));
      
      // Auto remove
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // ===== PASSWORD VISIBILITY TOGGLE =====
    togglePass.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      togglePass.classList.toggle('fa-eye');
      togglePass.classList.toggle('fa-eye-slash');
    });

    // ===== FORM SUBMISSION =====
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();      const password = passwordInput.value;
      
      // Basic validation
      if (!email || !password) {
        showToast('Please fill in all fields.', 'error');
        return;
      }
      
      // UI Loading State
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
      
      try {
        // Firebase Email/Password Sign In
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        
        // Success
        showToast('Login successful! Redirecting...', 'success');
        
        // Redirect to dashboard after brief delay
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
        
      } catch (error) {
        console.error('Login Error:', error);
        
        // Map Firebase error codes to user-friendly messages
        let message = 'Login failed. Please try again.';
        switch (error.code) {
          case 'auth/user-not-found':
            message = 'No account found with this email.';
            break;
          case 'auth/wrong-password':
            message = 'Incorrect password. Please try again.';
            break;
          case 'auth/invalid-email':
            message = 'Please enter a valid email address.';
            break;
          case 'auth/too-many-requests':
            message = 'Too many attempts. Please wait a moment.';
            break;
          case 'auth/network-request-failed':
            message = 'Network error. Check your connection.';
            break;
        }
        showToast(message, 'error');
      } finally {
        // Reset UI
        loginBtn.disabled = false;        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Log In</span>';
      }
    });

    // ===== GOOGLE SIGN IN =====
    googleBtn.addEventListener('click', async () => {
      googleBtn.disabled = true;
      googleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting...';
      
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        showToast('Google login successful!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } catch (error) {
        console.error('Google Auth Error:', error);
        showToast('Google login failed. Try again.', 'error');
      } finally {
        googleBtn.disabled = false;
        googleBtn.innerHTML = '<i class="fab fa-google"></i> <span>Google Account</span>';
      }
    });

    // ===== PASSWORD RESET =====
    forgotLink.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      
      if (!email) {
        showToast('Enter your email first to reset password.', 'error');
        emailInput.focus();
        return;
      }
      
      try {
        await auth.sendPasswordResetEmail(email);
        showToast('Password reset link sent to your email!', 'success');
      } catch (error) {
        showToast('Failed to send reset link. Check email format.', 'error');
      }
    });

    console.log('✅ YAN-FLOWS Login Page Loaded');
    console.log('🔐 Firebase Auth Ready');
    console.log('🚀 Next: signup.html → dashboard.html');
  </script>

  <script src="app.js"></script>
 
</body>
</html>
