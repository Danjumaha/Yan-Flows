<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orders Received | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D; --light-gray: #ADB5BD;
      --coral: #FF6B6B; --teal: #4ECDC4; --gold: #FFD93D;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --radius-sm: 8px; --radius-md: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); min-height: 100vh; padding: 2rem 1rem; }
    
    .orders-container { max-width: 1000px; margin: 0 auto; }
    .page-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--white); display: flex; align-items: center; justify-content: center; color: var(--navy); text-decoration: none; box-shadow: var(--shadow-sm); }
    .page-title { font-size: 1.75rem; font-weight: 700; color: var(--navy); }
    .page-stats { margin-left: auto; display: flex; gap: 1rem; }
    .stat-badge { background: var(--white); padding: 0.5rem 1rem; border-radius: var(--radius-md); font-weight: 700; font-size: 0.9rem; box-shadow: var(--shadow-sm); }
    .stat-badge span { color: var(--teal); }

    .order-card { background: var(--white); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1rem; border-left: 4px solid var(--gray); }
    .order-card.status-pending { border-left-color: #FFC107; }
    .order-card.status-completed { border-left-color: #28A745; }
    .order-card.status-cancelled { border-left-color: #DC3545; }

    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .order-id { font-weight: 700; color: var(--navy); }
    .order-meta { color: var(--gray); font-size: 0.9rem; }
    .order-status { padding: 0.375rem 0.75rem; border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; background: #F0F0F0; color: var(--gray); }
    .status-pending .order-status { background: #FFF3CD; color: #856404; }
    .status-completed .order-status { background: #D4EDDA; color: #155724; }

    .customer-info { background: var(--light-bg); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .info-group label { display: block; font-size: 0.8rem; color: var(--gray); font-weight: 600; margin-bottom: 0.25rem; }
    .info-group div { font-weight: 600; color: var(--navy-dark); }

    .order-items { margin-bottom: 1rem; }
    .order-item { display: flex; align-items: center; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px solid #F0F0F0; }
    .item-img { width: 45px; height: 45px; border-radius: 6px; background: var(--light-bg); overflow: hidden; }
    .item-img img { width: 100%; height: 100%; object-fit: cover; }
    .item-info { flex: 1; }
    .item-name { font-weight: 600; color: var(--navy-dark); }    .item-qty { color: var(--gray); font-size: 0.85rem; }
    .item-price { font-weight: 700; color: var(--navy); }

    .order-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #F0F0F0; padding-top: 1rem; flex-wrap: wrap; gap: 0.75rem; }
    .order-total { font-size: 1.1rem; font-weight: 800; color: var(--navy); }
    .order-actions { display: flex; gap: 0.5rem; }
    .btn-action { padding: 0.6rem 1rem; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; transition: var(--transition); display: flex; align-items: center; gap: 0.375rem; }
    .btn-complete { background: #28A745; color: white; }
    .btn-cancel { background: #DC3545; color: white; }
    .btn-crm { background: var(--navy); color: white; }
    .btn-whatsapp { background: #25D366; color: white; }
    .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }

    .empty-state { text-align: center; padding: 4rem 2rem; background: var(--white); border-radius: var(--radius-md); }
    .yf-toast { position: fixed; top: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 0.75rem; box-shadow: var(--shadow-lg); z-index: 9999; opacity: 0; transform: translateX(100%); transition: all 0.3s ease; font-weight: 600; font-size: 0.9rem; }
    .yf-toast.show { opacity: 1; transform: translateX(0); }
    .yf-toast--success { background: #2ECC71; color: white; }
    .yf-toast--error { background: var(--coral); color: white; }
    @media (max-width: 640px) { .order-header { flex-direction: column; align-items: flex-start; } .page-stats { display: none; } }
  </style>
</head>
<body>
  <div class="orders-container">
    <div class="page-header">
      <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
      <h1 class="page-title">Orders Received</h1>
      <div class="page-stats">
        <div class="stat-badge">Pending: <span id="pendingCount">0</span></div>
        <div class="stat-badge">Total: <span id="totalCount">0</span></div>
      </div>
    </div>

    <div id="ordersList">
      <div class="empty-state">
        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--light-gray); margin-bottom: 1rem;"></i>
        <h3>Loading orders...</h3>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    let allOrders = [];
    let currentUser = null;

    auth.onAuthStateChanged(async user => {
      if (!user) window.location.href = 'login.html';      currentUser = user;
      loadOrders(user.uid);
    });

    async function loadOrders(uid) {
      const container = document.getElementById('ordersList');
      try {
        // Query orders where this user is the seller
        const snapshot = await db.collection('orders').where('sellerId', '==', uid).orderBy('createdAt', 'desc').get();
        allOrders = [];
        snapshot.forEach(doc => allOrders.push({ id: doc.id, ...doc.data() }));
        
        document.getElementById('pendingCount').textContent = allOrders.filter(o => o.status === 'pending').length;
        document.getElementById('totalCount').textContent = allOrders.length;
        renderOrders();
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-bug"></i><h3>Error loading orders</h3></div>`;
      }
    }

    function renderOrders() {
      const container = document.getElementById('ordersList');
      if (allOrders.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><h3>No orders yet</h3><p>Orders from customers will appear here</p></div>`;
        return;
      }

      container.innerHTML = allOrders.map(order => {
        const date = order.createdAt ? YF.formatDate(order.createdAt) : 'Recently';
        const status = order.status || 'pending';
        const delivery = order.deliveryDetails || {};
        
        return `
          <div class="order-card status-${status}">
            <div class="order-header">
              <div>
                <div class="order-id">Order #${order.orderId || order.id.slice(-6).toUpperCase()}</div>
                <div class="order-meta">${date} • Buyer: ${order.buyerName}</div>
              </div>
              <span class="order-status">${status.charAt(0).toUpperCase() + status.slice(1)}</span>
            </div>

            <div class="customer-info">
              <div class="info-group"><label>Phone</label><div>${delivery.phoneNumber || 'N/A'}</div></div>
              <div class="info-group"><label>Address</label><div>${delivery.address1 || ''}, ${delivery.city || ''}</div></div>
              <div class="info-group"><label>State</label><div>${delivery.state || 'N/A'}</div></div>
              ${delivery.instructions ? `<div class="info-group" style="grid-column: 1/-1;"><label>Instructions</label><div>${delivery.instructions}</div></div>` : ''}
            </div>

            <div class="order-items">              ${(order.items || []).map(item => `
                <div class="order-item">
                  <div class="item-img"><img src="${item.image || 'https://via.placeholder.com/45'}" alt="${item.name}"/></div>
                  <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-qty">Qty: ${item.quantity}</div>
                  </div>
                  <div class="item-price">${YF.formatCurrency(item.price * item.quantity)}</div>
                </div>
              `).join('')}
            </div>

            <div class="order-footer">
              <div class="order-total">Total: ${YF.formatCurrency(order.total)}</div>
              <div class="order-actions">
                ${status === 'pending' ? `
                  <button class="btn-action btn-complete" onclick="updateStatus('${order.id}', 'completed')"><i class="fas fa-check"></i> Complete</button>
                  <button class="btn-action btn-cancel" onclick="updateStatus('${order.id}', 'cancelled')"><i class="fas fa-times"></i> Cancel</button>
                ` : ''}
                <button class="btn-action btn-crm" onclick="saveToCRM('${order.id}')"><i class="fas fa-user-plus"></i> Save to CRM</button>
                <a href="https://wa.me/${delivery.phoneNumber ? delivery.phoneNumber.replace(/\D/g, '') : ''}" target="_blank" class="btn-action btn-whatsapp"><i class="fab fa-whatsapp"></i> Chat</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateStatus(orderId, newStatus) {
      try {
        await db.collection('orders').doc(orderId).update({ status: newStatus });
        YF.showToast(`Order marked as ${newStatus}`, 'success');
        loadOrders(currentUser.uid);
      } catch (err) {
        YF.showToast('Error updating status', 'error');
      }
    }

    async function saveToCRM(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order || !order.deliveryDetails) {
        YF.showToast('No customer data to save', 'error');
        return;
      }

      try {
        const d = order.deliveryDetails;
        // Check if customer already exists
        const existing = await db.collection('customers').where('phone', '==', d.phoneNumber).where('sellerId', '==', currentUser.uid).get();
                let customerData = {
          sellerId: currentUser.uid,
          name: d.fullName,
          phone: d.phoneNumber,
          addresses: [{ address1: d.address1, address2: d.address2, city: d.city, state: d.state, country: d.country }],
          totalSpent: order.total,
          orderCount: 1,
          lastOrderDate: firebase.firestore.FieldValue.serverTimestamp(),
          notes: d.instructions || '',
          tags: []
        };

        if (!existing.empty) {
          // Update existing
          const doc = existing.docs[0];
          const current = doc.data();
          customerData.totalSpent = (current.totalSpent || 0) + order.total;
          customerData.orderCount = (current.orderCount || 0) + 1;
          customerData.addresses = [...(current.addresses || []), ...customerData.addresses];
          await db.collection('customers').doc(doc.id).update(customerData);
          YF.showToast('Customer updated in CRM', 'success');
        } else {
          // Create new with classification
          customerData.classification = classifyCustomer(customerData.totalSpent, customerData.orderCount);
          await db.collection('customers').add(customerData);
          YF.showToast('Customer saved to CRM', 'success');
        }
      } catch (err) {
        console.error(err);
        YF.showToast('Error saving to CRM', 'error');
      }
    }

    function classifyCustomer(spent, orders) {
      if (spent >= 50000) return 'VIP';
      if (orders >= 5) return 'Bulk Buyer';
      if (orders >= 2) return 'Returning';
      return 'General';
    }
  </script>
</body>
</html>
