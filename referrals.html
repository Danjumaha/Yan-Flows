<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Referrals | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D; --light-gray: #ADB5BD;
      --coral: #FF6B6B; --teal: #4ECDC4; --gold: #FFD93D;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --radius-sm: 8px; --radius-md: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); min-height: 100vh; padding: 2rem 1rem; }

    .ref-container { max-width: 900px; margin: 0 auto; }
    .page-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--white); display: flex; align-items: center; justify-content: center; color: var(--navy); text-decoration: none; box-shadow: var(--shadow-sm); }
    .page-title { font-size: 1.75rem; font-weight: 700; color: var(--navy); }

    .ref-hero { background: linear-gradient(135deg, var(--teal), var(--navy-light)); color: white; border-radius: var(--radius-lg); padding: 2rem; text-align: center; margin-bottom: 2rem; box-shadow: var(--shadow-md); }
    .ref-hero h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .ref-hero p { opacity: 0.9; margin-bottom: 1.5rem; }
    
    .ref-code-box { background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); padding: 1rem; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; gap: 1rem; max-width: 400px; margin: 0 auto 1.5rem; }
    .ref-code-text { font-family: monospace; font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; }
    .btn-copy { background: var(--white); color: var(--navy); border: none; padding: 0.5rem 1rem; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; }

    .share-buttons { display: flex; justify-content: center; gap: 1rem; }
    .btn-share { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.25rem; cursor: pointer; transition: var(--transition); text-decoration: none; }
    .btn-share:hover { transform: scale(1.1); }
    .bg-wa { background: #25D366; }
    .bg-fb { background: #1877F2; }
    .bg-tw { background: #1DA1F2; }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--white); padding: 1.25rem; border-radius: var(--radius-md); text-align: center; box-shadow: var(--shadow-sm); }
    .stat-value { font-size: 1.75rem; font-weight: 800; color: var(--navy); }
    .stat-label { color: var(--gray); font-size: 0.9rem; }

    .ref-list-section { background: var(--white); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-sm); }
    .section-title { font-size: 1.25rem; font-weight: 700; color: var(--navy); margin-bottom: 1rem; }
    .ref-item { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid #F0F0F0; }
    .ref-item:last-child { border-bottom: none; }
    .ref-user { display: flex; align-items: center; gap: 1rem; }    .ref-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--light-bg); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--navy); }
    .ref-info h4 { font-weight: 600; color: var(--navy-dark); font-size: 0.95rem; }
    .ref-info p { font-size: 0.8rem; color: var(--gray); }
    .ref-status { font-size: 0.85rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); }
    .status-bonus { background: #D4EDDA; color: #155724; }
    .status-pending { background: #FFF3CD; color: #856404; }

    .yf-toast { position: fixed; top: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 0.75rem; box-shadow: var(--shadow-lg); z-index: 9999; opacity: 0; transform: translateX(100%); transition: all 0.3s ease; font-weight: 600; font-size: 0.9rem; }
    .yf-toast.show { opacity: 1; transform: translateX(0); }
    .yf-toast--success { background: #2ECC71; color: white; }
    
    @media (max-width: 640px) { .stats-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="ref-container">
    <div class="page-header">
      <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
      <h1 class="page-title">Referrals</h1>
    </div>

    <div class="ref-hero">
      <h2>Earn 20 Coins Per Referral!</h2>
      <p>Invite friends to YAN-FLOWS. When they sign up and buy coins, you get 20 free coins.</p>
      
      <div class="ref-code-box">
        <span class="ref-code-text" id="refCode">LOADING...</span>
        <button class="btn-copy" onclick="copyReferral()"><i class="fas fa-copy"></i> Copy</button>
      </div>

      <div class="share-buttons">
        <a href="#" class="btn-share bg-wa" onclick="shareVia('whatsapp')"><i class="fab fa-whatsapp"></i></a>
        <a href="#" class="btn-share bg-fb" onclick="shareVia('facebook')"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="btn-share bg-tw" onclick="shareVia('twitter')"><i class="fab fa-twitter"></i></a>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-value" id="statReferrals">0</div><div class="stat-label">Total Referrals</div></div>
      <div class="stat-card"><div class="stat-value" id="statConversions">0</div><div class="stat-label">Conversions (Coins Bought)</div></div>
      <div class="stat-card"><div class="stat-value" id="statEarnings">0</div><div class="stat-label">Coins Earned</div></div>
    </div>

    <div class="ref-list-section">
      <h2 class="section-title">Referral History</h2>
      <div id="refList">
        <p style="text-align: center; color: var(--gray);">Loading referrals...</p>
      </div>
    </div>  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>

  <script>
    let currentUser = null;
    let myReferralCode = '';

    auth.onAuthStateChanged(async user => {
      if (!user) window.location.href = 'login.html';
      currentUser = user;
      loadData();
    });

    async function loadData() {
      const userData = await YF.getUserData(currentUser.uid);
      if (userData) {
        myReferralCode = userData.referralCode || 'N/A';
        document.getElementById('refCode').textContent = myReferralCode;
        
        loadReferrals();
      }
    }

    async function loadReferrals() {
      const container = document.getElementById('refList');
      try {
        // Get referrals where this user is the referrer
        const snapshot = await db.collection('referrals').where('referrerId', '==', currentUser.uid).orderBy('date', 'desc').get();
        
        const referrals = [];
        let conversions = 0;
        let earnings = 0;

        for (const doc of snapshot.docs) {
          const ref = doc.data();
          referrals.push({ id: doc.id, ...ref });
          
          // Get referred user's data to show name
          const userDoc = await db.collection('users').doc(ref.referredId).get();
          ref.referredUserData = userDoc.exists ? userDoc.data() : { fullName: 'Unknown' };
          
          if (ref.bonusGiven) {
            conversions++;
            earnings += 20;
          }
        }
        document.getElementById('statReferrals').textContent = referrals.length;
        document.getElementById('statConversions').textContent = conversions;
        document.getElementById('statEarnings').textContent = earnings;

        if (referrals.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: var(--gray); padding: 1rem;">No referrals yet. Share your link to get started!</p>';
          return;
        }

        container.innerHTML = referrals.map(ref => `
          <div class="ref-item">
            <div class="ref-user">
              <div class="ref-avatar">${(ref.referredUserData.fullName || 'U')[0]}</div>
              <div class="ref-info">
                <h4>${ref.referredUserData.fullName || 'Unknown User'}</h4>
                <p>Joined: ${ref.date ? YF.formatDate(ref.date) : 'Recently'}</p>
              </div>
            </div>
            <div class="ref-status ${ref.bonusGiven ? 'status-bonus' : 'status-pending'}">
              ${ref.bonusGiven ? '+20 Coins Earned' : 'Waiting for purchase'}
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    function copyReferral() {
      const link = `${window.location.origin}/signup.html?ref=${myReferralCode}`;
      navigator.clipboard.writeText(link).then(() => {
        YF.showToast('Referral link copied!', 'success');
      });
    }

    function shareVia(platform) {
      const link = `${window.location.origin}/signup.html?ref=${myReferralCode}`;
      const text = `Join me on YAN-FLOWS! Use my referral code: ${myReferralCode} to get started. `;
      let url = '';

      if (platform === 'whatsapp') {
        url = `https://wa.me/?text=${encodeURIComponent(text + link)}`;
      } else if (platform === 'facebook') {
        url = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}`;
      } else if (platform === 'twitter') {
        url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(link)}`;
      }
      
      window.open(url, '_blank');    }
  </script>
</body>
</html>
