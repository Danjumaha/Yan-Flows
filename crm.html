<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer CRM | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D; --light-gray: #ADB5BD;
      --coral: #FF6B6B; --teal: #4ECDC4; --gold: #FFD93D; --vip-gold: #FFD700;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --radius-sm: 8px; --radius-md: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); min-height: 100vh; padding: 2rem 1rem; }
    
    .crm-container { max-width: 1100px; margin: 0 auto; }
    .page-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--white); display: flex; align-items: center; justify-content: center; color: var(--navy); text-decoration: none; box-shadow: var(--shadow-sm); }
    .page-title { font-size: 1.75rem; font-weight: 700; color: var(--navy); }
    .search-box { margin-left: auto; position: relative; width: 300px; }
    .search-box input { width: 100%; padding: 0.6rem 1rem 0.6rem 2.5rem; border: 2px solid #E5E7EB; border-radius: var(--radius-full); font-size: 0.95rem; }
    .search-box input:focus { outline: none; border-color: var(--teal); }
    .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--light-gray); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--white); padding: 1.25rem; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); text-align: center; }
    .stat-value { font-size: 1.75rem; font-weight: 800; color: var(--navy); margin-bottom: 0.25rem; }
    .stat-label { color: var(--gray); font-size: 0.9rem; font-weight: 500; }
    .stat-card.vip { border-top: 4px solid var(--vip-gold); }
    .stat-card.bulk { border-top: 4px solid var(--coral); }

    .filter-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
    .filter-tab { padding: 0.6rem 1.25rem; border-radius: var(--radius-md); background: var(--white); color: var(--gray); font-weight: 600; border: 1px solid #E5E7EB; cursor: pointer; white-space: nowrap; transition: var(--transition); }
    .filter-tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

    .customer-list { display: flex; flex-direction: column; gap: 1rem; }
    .customer-card { background: var(--white); border-radius: var(--radius-md); padding: 1.25rem; box-shadow: var(--shadow-sm); display: grid; grid-template-columns: 60px 1fr auto; gap: 1.25rem; align-items: center; transition: var(--transition); }
    .customer-card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .customer-avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--light-bg); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; color: var(--navy); overflow: hidden; }
    .customer-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .customer-info { flex: 1; }
    .customer-name { font-weight: 700; color: var(--navy-dark); margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
    .customer-phone { color: var(--gray); font-size: 0.9rem; margin-bottom: 0.375rem; }    .customer-meta { display: flex; gap: 1rem; font-size: 0.85rem; color: var(--navy); }
    .customer-meta span { display: flex; align-items: center; gap: 0.375rem; }
    
    .classification-badge { padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-vip { background: #FFF3CD; color: #856404; }
    .badge-bulk { background: #F8D7DA; color: #721C24; }
    .badge-returning { background: #D1ECF1; color: #0C5460; }
    .badge-general { background: #E2E3E5; color: #383D41; }

    .customer-actions { display: flex; flex-direction: column; gap: 0.5rem; }
    .btn-action { padding: 0.5rem 1rem; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 0.375rem; text-decoration: none; }
    .btn-whatsapp { background: #25D366; color: white; }
    .btn-view { background: var(--light-bg); color: var(--navy); }
    .btn-action:hover { opacity: 0.9; }

    .empty-state { text-align: center; padding: 4rem 2rem; background: var(--white); border-radius: var(--radius-md); }
    .yf-toast { position: fixed; top: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 0.75rem; box-shadow: var(--shadow-lg); z-index: 9999; opacity: 0; transform: translateX(100%); transition: all 0.3s ease; font-weight: 600; font-size: 0.9rem; }
    .yf-toast.show { opacity: 1; transform: translateX(0); }
    .yf-toast--success { background: #2ECC71; color: white; }
    @media (max-width: 768px) { .customer-card { grid-template-columns: 1fr; text-align: center; } .customer-avatar { margin: 0 auto; } .customer-meta { justify-content: center; } .customer-actions { flex-direction: row; justify-content: center; } .search-box { width: 100%; margin-top: 1rem; } }
  </style>
</head>
<body>
  <div class="crm-container">
    <div class="page-header">
      <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
      <h1 class="page-title">Customer CRM</h1>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search customers..."/>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total Customers</div></div>
      <div class="stat-card vip"><div class="stat-value" id="statVip">0</div><div class="stat-label">VIP Buyers</div></div>
      <div class="stat-card bulk"><div class="stat-value" id="statBulk">0</div><div class="stat-label">Bulk Buyers</div></div>
      <div class="stat-card"><div class="stat-value" id="statRevenue">₦0</div><div class="stat-label">Total Revenue</div></div>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All Customers</button>
      <button class="filter-tab" data-filter="VIP">VIP</button>
      <button class="filter-tab" data-filter="Bulk Buyer">Bulk Buyers</button>
      <button class="filter-tab" data-filter="Returning">Returning</button>
      <button class="filter-tab" data-filter="General">General</button>
    </div>

    <div class="customer-list" id="customerList">
      <div class="empty-state">        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--light-gray); margin-bottom: 1rem;"></i>
        <h3>Loading customers...</h3>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    let allCustomers = [];
    let currentFilter = 'all';
    let searchQuery = '';

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = 'login.html';
      else loadCustomers(user.uid);
    });

    async function loadCustomers(uid) {
      const container = document.getElementById('customerList');
      try {
        const snapshot = await db.collection('customers').where('sellerId', '==', uid).orderBy('lastOrderDate', 'desc').get();
        allCustomers = [];
        let totalRevenue = 0;
        snapshot.forEach(doc => {
          const c = { id: doc.id, ...doc.data() };
          allCustomers.push(c);
          totalRevenue += c.totalSpent || 0;
        });

        document.getElementById('statTotal').textContent = allCustomers.length;
        document.getElementById('statVip').textContent = allCustomers.filter(c => c.classification === 'VIP').length;
        document.getElementById('statBulk').textContent = allCustomers.filter(c => c.classification === 'Bulk Buyer').length;
        document.getElementById('statRevenue').textContent = YF.formatCurrency(totalRevenue);
        
        renderCustomers();
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-bug"></i><h3>Error loading CRM</h3></div>`;
      }
    }

    function renderCustomers() {
      const container = document.getElementById('customerList');
      let filtered = allCustomers;
      
      if (currentFilter !== 'all') {
        filtered = filtered.filter(c => c.classification === currentFilter);
      }      
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(c => 
          (c.name || '').toLowerCase().includes(q) || 
          (c.phone || '').includes(q)
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-users"></i><h3>No customers found</h3><p>Save customers from orders to build your CRM</p></div>`;
        return;
      }

      container.innerHTML = filtered.map(c => {
        const badgeClass = `badge-${(c.classification || 'general').toLowerCase().replace(' ', '-')}`;
        const initials = (c.name || 'U').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        
        return `
          <div class="customer-card">
            <div class="customer-avatar">${initials}</div>
            <div class="customer-info">
              <div class="customer-name">${c.name || 'Unknown'} <span class="classification-badge ${badgeClass}">${c.classification || 'General'}</span></div>
              <div class="customer-phone"><i class="fas fa-phone"></i> ${c.phone || 'N/A'}</div>
              <div class="customer-meta">
                <span><i class="fas fa-coins"></i> ${YF.formatCurrency(c.totalSpent || 0)}</span>
                <span><i class="fas fa-box"></i> ${c.orderCount || 0} orders</span>
                <span><i class="fas fa-map-marker-alt"></i> ${c.addresses ? c.addresses[0].city : 'N/A'}</span>
              </div>
            </div>
            <div class="customer-actions">
              <a href="https://wa.me/${c.phone ? c.phone.replace(/\D/g, '') : ''}" target="_blank" class="btn-action btn-whatsapp"><i class="fab fa-whatsapp"></i> Chat</a>
              <button class="btn-action btn-view" onclick="viewCustomer('${c.id}')"><i class="fas fa-eye"></i> View</button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderCustomers();
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;      renderCustomers();
    });

    function viewCustomer(id) {
      window.location.href = `customer-details.html?id=${id}`;
    }
  </script>
</body>
</html>
