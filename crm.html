<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer CRM | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* ========================================
       YAN-FLOWS - CRM PAGE STYLES
       Luxury Theme: Navy Blue + White + Accents
       ======================================== */
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D;
      --coral: #FF6B6B; --coral-hover: #EE5A5A;
      --teal: #4ECDC4; --teal-hover: #3DBDB4;
      --gold: #FFD93D; --danger: #FF4757;
      --vip: #8B5CF6; --bulk: #F59E0B;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --shadow-md: 0 4px 20px rgba(27, 58, 95, 0.12);
      --shadow-lg: 0 8px 40px rgba(27, 58, 95, 0.18);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --radius-sm: 8px; --radius-md: 16px;
      --space-sm: 1rem; --space-md: 2rem;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); color: var(--navy); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; }
    input, textarea, select { font-family: inherit; }

    /* ===== NAVBAR ===== */
    .navbar { background: var(--white); box-shadow: var(--shadow-sm); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
    .navbar-container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-sm); display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 800; color: var(--navy); }
    .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--navy), var(--teal)); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 700; }
    .nav-back { font-weight: 500; color: var(--gray); display: flex; align-items: center; gap: 0.5rem; }
    .nav-back:hover { color: var(--navy); }

    /* ===== MAIN CONTAINER ===== */
    .main-container { flex: 1; padding: var(--space-md) var(--space-sm); max-width: 1200px; margin: 0 auto; width: 100%; }
    
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); flex-wrap: wrap; gap: 1rem; }
    .page-title h1 { font-size: 1.75rem; color: var(--navy-dark); margin-bottom: 0.25rem; }
    .page-title p { color: var(--gray); font-size: 0.95rem; }
    .btn { padding: 0.75rem 1.5rem; font-weight: 600; font-size: 0.95rem; border-radius: var(--radius-sm); transition: var(--transition); display: inline-flex; align-items: center; gap: 0.5rem; }    .btn-primary { background: var(--coral); color: var(--white); box-shadow: 0 4px 12px rgba(255,107,107,0.3); }
    .btn-primary:hover { background: var(--coral-hover); transform: translateY(-2px); }
    .btn-secondary { background: var(--teal); color: var(--navy-dark); }
    .btn-secondary:hover { background: var(--teal-hover); }
    .btn-outline { background: transparent; border: 1px solid #E2E8F0; color: var(--navy); }
    .btn-outline:hover { background: var(--light-bg); }
    .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }

    /* Stats Bar */
    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: var(--space-md); }
    .stat-pill { background: var(--white); padding: 0.875rem 1rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); text-align: center; }
    .stat-pill h3 { font-size: 1.5rem; font-weight: 800; color: var(--navy-dark); margin-bottom: 0.25rem; }
    .stat-pill p { font-size: 0.8rem; color: var(--gray); font-weight: 500; }

    /* Filter Tabs */
    .filter-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .filter-tab {
      padding: 0.5rem 1rem; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 600;
      background: var(--white); color: var(--gray); border: 1px solid #E2E8F0; cursor: pointer; transition: var(--transition);
    }
    .filter-tab:hover { background: var(--light-bg); color: var(--navy); }
    .filter-tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

    /* CRM Grid */
    .crm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; }
    .customer-card {
      background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
      padding: 1.25rem; transition: var(--transition); border-top: 3px solid var(--gray); position: relative;
    }
    .customer-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .customer-card.cat-vip { border-top-color: var(--vip); }
    .customer-card.cat-bulk { border-top-color: var(--bulk); }
    .customer-card.cat-returning { border-top-color: var(--teal); }
    .customer-card.cat-special { border-top-color: var(--coral); }
    .customer-card.cat-general { border-top-color: var(--gray); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
    .customer-avatar { width: 48px; height: 48px; background: linear-gradient(135deg, var(--navy), var(--teal)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 700; font-size: 1.1rem; flex-shrink: 0; }
    .customer-info { flex: 1; margin-left: 1rem; }
    .customer-name { font-weight: 700; color: var(--navy-dark); font-size: 1.05rem; }
    .customer-phone { font-size: 0.85rem; color: var(--gray); margin-top: 0.25rem; }
    .category-badge { padding: 0.25rem 0.6rem; border-radius: var(--radius-full); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; margin-top: 0.5rem; display: inline-block; }
    .badge-vip { background: rgba(139,92,246,0.15); color: var(--vip); }
    .badge-bulk { background: rgba(245,158,11,0.15); color: var(--bulk); }
    .badge-returning { background: rgba(78,205,196,0.15); color: #1A8A7D; }
    .badge-special { background: rgba(255,107,107,0.15); color: var(--coral); }
    .badge-general { background: rgba(108,117,125,0.15); color: var(--gray); }

    .card-stats { display: flex; gap: 1rem; margin: 1rem 0; padding: 0.75rem 0; border-top: 1px solid #F1F5F9; border-bottom: 1px solid #F1F5F9; }
    .card-stat { text-align: center; flex: 1; }    .card-stat span { display: block; font-size: 0.75rem; color: var(--gray); text-transform: uppercase; }
    .card-stat strong { display: block; font-size: 1.1rem; font-weight: 700; color: var(--navy-dark); margin-top: 0.25rem; }

    .card-notes { background: var(--light-bg); padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.85rem; color: var(--gray); margin-bottom: 1rem; min-height: 40px; }
    .card-actions { display: flex; gap: 0.5rem; }
    .card-actions button { flex: 1; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--white); border-radius: var(--radius-md); width: 100%; max-width: 500px; padding: var(--space-md); box-shadow: var(--shadow-lg); animation: modalIn 0.3s ease; }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .modal-title { font-size: 1.25rem; font-weight: 700; }
    .modal-close { color: var(--gray); font-size: 1.25rem; cursor: pointer; }
    .modal-close:hover { color: var(--danger); }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 0.875rem 1rem; border: 2px solid #E2E8F0; border-radius: var(--radius-sm); font-size: 1rem; transition: var(--transition); }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(78,205,196,0.15); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }

    /* Empty State */
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--gray); }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
    .empty-state h3 { color: var(--navy); margin-bottom: 0.5rem; }

    /* Toast */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--white); padding: 1rem 1.25rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 0.75rem; min-width: 280px; transform: translateX(120%); transition: transform 0.3s ease; border-left: 4px solid var(--coral); }
    .toast.success { border-left-color: var(--teal); }
    .toast.show { transform: translateX(0); }

    /* Responsive */
    @media (max-width: 768px) {
      .crm-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="dashboard.html" class="logo">
        <div class="logo-icon">YF</div>
        YAN-FLOWS      </a>
      <a href="dashboard.html" class="nav-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
  </nav>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main Content -->
  <main class="main-container">
    <header class="page-header">
      <div class="page-title">
        <h1>Customer CRM</h1>
        <p>Manage relationships, track spending, and segment buyers</p>
      </div>
      <div style="display:flex; gap:0.75rem;">
        <button class="btn btn-outline" id="syncOrdersBtn"><i class="fas fa-sync"></i> Sync from Orders</button>
        <button class="btn btn-primary" id="addCustomerBtn"><i class="fas fa-plus"></i> Add Customer</button>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-pill"><h3 id="stat-total">0</h3><p>Total Customers</p></div>
      <div class="stat-pill"><h3 id="stat-vip">0</h3><p>VIP Buyers</p></div>
      <div class="stat-pill"><h3 id="stat-bulk">0</h3><p>Bulk Orders</p></div>
      <div class="stat-pill"><h3 id="stat-revenue">₦0</h3><p>Total Revenue</p></div>
    </div>

    <!-- Filters -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-cat="all">All Customers</button>
      <button class="filter-tab" data-cat="vip">VIP</button>
      <button class="filter-tab" data-cat="bulk">Bulk Buyers</button>
      <button class="filter-tab" data-cat="returning">Returning</button>
      <button class="filter-tab" data-cat="special">Special</button>
      <button class="filter-tab" data-cat="general">General</button>
    </div>

    <!-- CRM Grid -->
    <div class="crm-grid" id="crmGrid">
      <div class="empty-state" id="emptyState">
        <i class="fas fa-users"></i>
        <h3>No customers yet</h3>
        <p>Add customers manually or sync from your order history.</p>
      </div>
    </div>
  </main>

  <!-- Add/Edit Modal -->  <div class="modal-overlay" id="customerModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add New Customer</h2>
        <i class="fas fa-times modal-close" id="modalClose"></i>
      </div>
      <form id="customerForm">
        <input type="hidden" id="editCustomerId"/>
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="custName" class="form-input" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number *</label>
          <input type="tel" id="custPhone" class="form-input" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Email (Optional)</label>
          <input type="email" id="custEmail" class="form-input"/>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="custCategory" class="form-select">
            <option value="general">General</option>
            <option value="vip">VIP</option>
            <option value="bulk">Bulk Buyer</option>
            <option value="returning">Returning</option>
            <option value="special">Special</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea id="custNotes" class="form-textarea" placeholder="Add preferences, history, or reminders..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="modalCancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modalSubmit">Save Customer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Core Engine -->
  <script src="app.js"></script>

  <!-- Page Script -->
  <script>
    // ===== DOM ELEMENTS =====
    const crmGrid = document.getElementById('crmGrid');
    const emptyState = document.getElementById('emptyState');    const filterTabs = document.getElementById('filterTabs');
    const customerModal = document.getElementById('customerModal');
    const customerForm = document.getElementById('customerForm');
    const modalTitle = document.getElementById('modalTitle');
    const editIdInput = document.getElementById('editCustomerId');
    
    // Stats
    const statTotal = document.getElementById('stat-total');
    const statVip = document.getElementById('stat-vip');
    const statBulk = document.getElementById('stat-bulk');
    const statRevenue = document.getElementById('stat-revenue');

    // State
    let customers = [];
    let currentFilter = 'all';
    let currentUser = null;

    // ===== AUTH GUARD =====
    YF.requireAuth('login.html');

    // Initialize
    firebase.auth().onAuthStateChanged(user => {
      if (!user) return;
      currentUser = user;
      setupRealtimeCustomers();
    });

    // ===== REALTIME CUSTOMERS =====
    function setupRealtimeCustomers() {
      if (!currentUser) return;
      
      firebase.firestore().collection('customers')
        .where('sellerId', '==', currentUser.uid)
        .orderBy('createdAt', 'desc')
        .onSnapshot(snapshot => {
          customers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          updateStats();
          renderCustomers();
        }, err => {
          console.error('CRM Error:', err);
          YF.ui.toast('Failed to load customers.', 'error');
        });
    }

    // ===== UPDATE STATS =====
    function updateStats() {
      const total = customers.length;
      const vip = customers.filter(c => c.category === 'vip').length;
      const bulk = customers.filter(c => c.category === 'bulk').length;
      const revenue = customers.reduce((sum, c) => sum + (c.totalSpent || 0), 0);
      statTotal.textContent = total;
      statVip.textContent = vip;
      statBulk.textContent = bulk;
      statRevenue.textContent = YF.ui.formatNaira(revenue);
    }

    // ===== RENDER CUSTOMERS =====
    function renderCustomers() {
      crmGrid.innerHTML = '';
      const filtered = currentFilter === 'all' ? customers : customers.filter(c => c.category === currentFilter);

      if (customers.length === 0) {
        crmGrid.appendChild(emptyState);
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = filtered.length === 0 ? 'block' : 'none';
      if (filtered.length === 0) {
        const noMatch = document.createElement('div');
        noMatch.className = 'empty-state';
        noMatch.innerHTML = `<i class="fas fa-filter"></i><h3>No ${currentFilter} customers</h3>`;
        crmGrid.appendChild(noMatch);
        return;
      }

      filtered.forEach(c => {
        const initials = (c.name || 'U').split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
        const card = document.createElement('div');
        card.className = `customer-card cat-${c.category || 'general'}`;
        card.innerHTML = `
          <div class="card-header">
            <div class="customer-avatar">${initials}</div>
            <div class="customer-info">
              <div class="customer-name">${c.name}</div>
              <div class="customer-phone">${c.phone || 'No phone'}</div>
              <span class="category-badge badge-${c.category || 'general'}">${c.category || 'General'}</span>
            </div>
          </div>
          <div class="card-stats">
            <div class="card-stat"><span>Orders</span><strong>${c.orderCount || 0}</strong></div>
            <div class="card-stat"><span>Spent</span><strong>${YF.ui.formatNaira(c.totalSpent || 0)}</strong></div>
          </div>
          <div class="card-notes">${c.notes || 'No notes added yet.'}</div>
          <div class="card-actions">
            <button class="btn btn-outline btn-sm" onclick="editCustomer('${c.id}')"><i class="fas fa-edit"></i> Edit</button>
            <button class="btn btn-outline btn-sm" onclick="deleteCustomer('${c.id}')" style="color:var(--danger);border-color:var(--danger);"><i class="fas fa-trash"></i> Delete</button>
          </div>
        `;        crmGrid.appendChild(card);
      });
    }

    // ===== MODAL CONTROLS =====
    function openModal(isEdit = false) {
      customerModal.classList.add('active');
      if (!isEdit) {
        customerForm.reset();
        editIdInput.value = '';
        modalTitle.textContent = 'Add New Customer';
        document.getElementById('modalSubmit').innerHTML = 'Save Customer';
      }
    }
    function closeModal() { customerModal.classList.remove('active'); }

    document.getElementById('addCustomerBtn').addEventListener('click', () => openModal(false));
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    customerModal.addEventListener('click', (e) => { if (e.target === customerModal) closeModal(); });

    // ===== FORM SUBMIT =====
    customerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const email = document.getElementById('custEmail').value.trim();
      const category = document.getElementById('custCategory').value;
      const notes = document.getElementById('custNotes').value.trim();
      const editId = editIdInput.value;

      if (!name || !phone) { YF.ui.toast('Name and Phone are required.', 'error'); return; }

      const submitBtn = document.getElementById('modalSubmit');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      try {
        const data = {
          sellerId: currentUser.uid,
          name, phone, email, category, notes,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (editId) {
          await firebase.firestore().collection('customers').doc(editId).update(data);
          YF.ui.toast('Customer updated successfully! ✅', 'success');
        } else {
          data.totalSpent = 0;          data.orderCount = 0;
          data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await firebase.firestore().collection('customers').add(data);
          YF.ui.toast('Customer added successfully! 🚀', 'success');
        }
        closeModal();
      } catch (err) {
        console.error('CRM Save Error:', err);
        YF.ui.toast('Failed to save customer.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Save Customer';
      }
    });

    // ===== EDIT & DELETE =====
    window.editCustomer = async (id) => {
      const c = customers.find(c => c.id === id);
      if (!c) return;
      
      editIdInput.value = id;
      document.getElementById('custName').value = c.name || '';
      document.getElementById('custPhone').value = c.phone || '';
      document.getElementById('custEmail').value = c.email || '';
      document.getElementById('custCategory').value = c.category || 'general';
      document.getElementById('custNotes').value = c.notes || '';
      modalTitle.textContent = 'Edit Customer';
      document.getElementById('modalSubmit').innerHTML = 'Update Customer';
      openModal(true);
    };

    window.deleteCustomer = async (id) => {
      if (!confirm('Delete this customer? This cannot be undone.')) return;
      try {
        await firebase.firestore().collection('customers').doc(id).delete();
        YF.ui.toast('Customer deleted.', 'info');
      } catch (err) {
        YF.ui.toast('Delete failed.', 'error');
      }
    };

    // ===== FILTER TABS =====
    filterTabs.addEventListener('click', (e) => {
      const tab = e.target.closest('.filter-tab');
      if (!tab) return;
      currentFilter = tab.dataset.cat;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderCustomers();
    });
    // ===== SYNC FROM ORDERS =====
    document.getElementById('syncOrdersBtn').addEventListener('click', async () => {
      const btn = document.getElementById('syncOrdersBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Syncing...';

      try {
        // Fetch all orders for this seller
        const ordersSnap = await firebase.firestore().collection('orders')
          .where('sellerId', '==', currentUser.uid)
          .get();
        
        if (ordersSnap.empty) {
          YF.ui.toast('No orders to sync.', 'info');
          return;
        }

        let synced = 0;
        for (const doc of ordersSnap.docs) {
          const order = doc.data();
          const cust = order.customer;
          if (!cust || !cust.phone) continue;

          // Check if exists
          const existing = await firebase.firestore().collection('customers')
            .where('sellerId', '==', currentUser.uid)
            .where('phone', '==', cust.phone)
            .limit(1)
            .get();
          
          if (!existing.empty) {
            // Update existing
            const ref = existing.docs[0].ref;
            await ref.update({
              orderCount: firebase.firestore.FieldValue.increment(1),
              totalSpent: firebase.firestore.FieldValue.increment(order.totals.grandTotal || 0),
              lastOrderDate: firebase.firestore.FieldValue.serverTimestamp(),
              name: cust.name || existing.docs[0].data().name,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            // Create new
            await firebase.firestore().collection('customers').add({
              sellerId: currentUser.uid,
              name: cust.name || 'Unknown',
              phone: cust.phone,
              email: cust.altPhone || '',
              category: 'general',
              notes: `First order: ${YF.ui.formatDate(order.createdAt)}`,              orderCount: 1,
              totalSpent: order.totals.grandTotal || 0,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            synced++;
          }
        }
        YF.ui.toast(`Synced ${synced} new customers! 🔄`, 'success');
      } catch (err) {
        console.error('Sync Error:', err);
        YF.ui.toast('Sync failed. Check console.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sync"></i> Sync from Orders';
      }
    });

    console.log('✅ CRM Page Loaded');
    console.log('👥 Customer Tracking & Segmentation Active');
    console.log('🔄 Auto-Sync from Orders Ready');
  </script>

<script src="app.js"></script>
</body>
</html>
