<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Setup Business | YAN-FLOWS</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    :root {
      --navy: #1B3A5F;
      --navy-dark: #0F1F33;
      --navy-light: #2C5282;
      --white: #FFFFFF;
      --light-bg: #F8F9FA;
      --gray: #6C757D;
      --light-gray: #ADB5BD;
      --coral: #FF6B6B;
      --teal: #4ECDC4;
      --gold: #FFD93D;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --shadow-md: 0 4px 20px rgba(27, 58, 95, 0.12);
      --shadow-lg: 0 8px 40px rgba(27, 58, 95, 0.18);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #F8F9FA 0%, #E8EEF5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .setup-container {
      width: 100%;
      max-width: 800px;
    }

    .setup-card {      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
    }

    /* ===== HEADER ===== */
    .setup-header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #E5E7EB;
    }

    .setup-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .setup-logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--navy), var(--teal));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .setup-logo-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
    }

    .setup-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--navy-dark);
      margin-bottom: 0.5rem;
    }

    .setup-subtitle {
      color: var(--gray);      font-size: 0.95rem;
    }

    /* ===== PROFILE PICTURE UPLOAD ===== */
    .profile-upload-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .profile-image-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--white);
      box-shadow: var(--shadow-md);
      background: #E5E7EB;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .profile-image-wrapper:hover { opacity: 0.9; }

    .profile-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-image-wrapper .profile-placeholder-icon {
      font-size: 2rem;
      color: var(--gray);
    }

    .upload-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: var(--transition);
      color: white;
    }
    .profile-image-wrapper:hover .upload-overlay { opacity: 1; }

    .profile-upload-label {
      display: inline-block;
      margin-top: 0.75rem;
      color: var(--teal);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .upload-progress {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--gray);
      display: none;
    }
    .upload-progress.show { display: block; }

    #profileInput { display: none; }

    /* ===== FORM GRID ===== */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .form-group { margin-bottom: 0; }

    .form-group.full-width { grid-column: 1 / -1; }

    .form-label {
      display: block;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid #E5E7EB;
      border-radius: var(--radius-sm);
      font-size: 1rem;      font-family: inherit;
      transition: var(--transition);
      background: var(--white);
      color: var(--navy-dark);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.15);
    }

    .form-input.error { border-color: var(--coral); }

    .input-with-icon { position: relative; }

    .input-with-icon i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--light-gray);
    }

    .input-with-icon .form-input { padding-left: 2.75rem; }

    /* ===== SECTION DIVIDER ===== */
    .section-divider {
      margin: 1.75rem 0 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .section-divider::before,
    .section-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E5E7EB;
    }

    .section-divider span {      font-weight: 700;
      color: var(--navy);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* ===== SUBMIT BUTTON ===== */
    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-submit .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .btn-submit.loading .spinner { display: block; }
    .btn-submit.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== TOAST ===== */
    .yf-toast {
      position: fixed;
      top: 2rem; right: 2rem;
      padding: 1rem 1.5rem;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: var(--shadow-lg);
      z-index: 9999;
      opacity: 0;
      transform: translateX(100%);
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 0.9rem;
      max-width: 350px;
    }
    .yf-toast.show { opacity: 1; transform: translateX(0); }
    .yf-toast--success { background: #2ECC71; color: white; }
    .yf-toast--error   { background: var(--coral); color: white; }
    .yf-toast--info    { background: var(--navy); color: white; }

    /* ===== LOADING OVERLAY ===== */
    .yf-loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 31, 51, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: white;
    }
    .yf-loading__spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    .yf-loading p { font-weight: 600; font-size: 1rem; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {      .form-grid { grid-template-columns: 1fr; }
      .setup-card { padding: 1.5rem; }
      .setup-title { font-size: 1.25rem; }
      .yf-toast { top: 1rem; right: 1rem; left: 1rem; max-width: none; }
    }
  </style>
</head>
<body>

  <div class="setup-container">
    <div class="setup-card">

      <!-- Header -->
      <div class="setup-header">
        <div class="setup-logo">
          <div class="setup-logo-icon">YF</div>
          <span class="setup-logo-text">YAN-FLOWS</span>
        </div>
        <h1 class="setup-title">Complete Your Business Setup</h1>
        <p class="setup-subtitle">Add your details so customers can find you and pay you easily.</p>
      </div>

      <form id="setupForm" novalidate>

        <!-- Profile Picture -->
        <div class="profile-upload-section">
          <label for="profileInput" class="profile-image-wrapper" id="profileWrapper">
            <img id="profilePreview" src="" alt="" style="display:none;"/>
            <i class="fas fa-camera profile-placeholder-icon" id="profileIcon"></i>
            <div class="upload-overlay">
              <i class="fas fa-camera"></i>
            </div>
          </label>
          <input type="file" id="profileInput" accept="image/*"/>
          <label for="profileInput" class="profile-upload-label">Upload Profile Picture</label>
          <div class="upload-progress" id="uploadProgress">Uploading...</div>
        </div>

        <!-- Business Information -->
        <div class="section-divider"><span>Business Information</span></div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="businessName">Business / Store Name *</label>
            <input type="text" id="businessName" class="form-input" placeholder="e.g., Mary's Kitchen" required/>
          </div>

          <div class="form-group">
            <label class="form-label" for="whatsapp">WhatsApp Number *</label>
            <div class="input-with-icon">              <i class="fab fa-whatsapp"></i>
              <input type="tel" id="whatsapp" class="form-input" placeholder="2348012345678" required/>
            </div>
          </div>

          <div class="form-group full-width">
            <label class="form-label" for="description">Business Description</label>
            <textarea id="description" class="form-textarea" placeholder="Tell customers about your business..."></textarea>
          </div>

          <div class="form-group full-width">
            <label class="form-label" for="location">Location (City, State)</label>
            <input type="text" id="location" class="form-input" placeholder="e.g., Lagos, Nigeria"/>
          </div>
        </div>

        <!-- Payment Details -->
        <div class="section-divider"><span>Payment Details</span></div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="bankName">Bank Name *</label>
            <select id="bankName" class="form-select" required>
              <option value="">Select Bank</option>
              <option value="Access Bank">Access Bank</option>
              <option value="GTBank">GTBank</option>
              <option value="UBA">UBA</option>
              <option value="First Bank">First Bank</option>
              <option value="Zenith Bank">Zenith Bank</option>
              <option value="Kuda Bank">Kuda Bank</option>
              <option value="Opay">Opay</option>
              <option value="Palmpay">Palmpay</option>
              <option value="Moniepoint">Moniepoint</option>
              <option value="Sterling Bank">Sterling Bank</option>
              <option value="Wema Bank">Wema Bank</option>
              <option value="Others">Others</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="accountNumber">Account Number *</label>
            <input type="text" id="accountNumber" class="form-input" placeholder="10 digits" maxlength="10" required/>
          </div>

          <div class="form-group full-width">
            <label class="form-label" for="accountName">Account Name *</label>
            <input type="text" id="accountName" class="form-input" placeholder="Name on bank account" required/>
          </div>
        </div>
        <!-- Order Message Template -->
        <div class="section-divider"><span>Order Message Template</span></div>

        <div class="form-group">
          <label class="form-label" for="customMessage">Custom WhatsApp Message</label>
          <textarea id="customMessage" class="form-textarea" placeholder="Message sent with every order...">Please pay before delivery. We deliver within 24hrs.</textarea>
          <p style="font-size: 0.8rem; color: var(--gray); margin-top: 0.5rem;">
            <i class="fas fa-info-circle"></i>
            This message will appear at the bottom of every order sent to your WhatsApp.
          </p>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text"><i class="fas fa-check-circle"></i> Save & Go to Dashboard</span>
          <div class="spinner"></div>
        </button>

      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>

  <script>
    // ===== Cloudinary Config =====
    const CLOUDINARY_CLOUD_NAME = 'dytzpxabq';
    const CLOUDINARY_UPLOAD_PRESET = 'Yan-Flow';

    // ===== DOM Elements =====
    const form           = document.getElementById('setupForm');
    const profileInput   = document.getElementById('profileInput');
    const profilePreview = document.getElementById('profilePreview');
    const profileIcon    = document.getElementById('profileIcon');
    const uploadProgress = document.getElementById('uploadProgress');
    const submitBtn      = document.getElementById('submitBtn');

    let uploadedImageUrl = '';

    // ===== Auth Guard =====
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      // If already set up, skip to dashboard      const userData = await YF.getUserData(user.uid);
      if (userData && userData.businessSetup) {
        window.location.href = 'dashboard.html';
      }
    });

    // ===== Profile Image Upload =====
    profileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Show local preview immediately
      const localURL = URL.createObjectURL(file);
      profilePreview.src = localURL;
      profilePreview.style.display = 'block';
      profileIcon.style.display    = 'none';

      // Upload to Cloudinary
      uploadProgress.textContent = 'Uploading image...';
      uploadProgress.classList.add('show');
      submitBtn.disabled = true;

      try {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

        const response = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
          { method: 'POST', body: formData }
        );

        const data = await response.json();

        if (data.secure_url) {
          uploadedImageUrl = data.secure_url;
          profilePreview.src = uploadedImageUrl;
          uploadProgress.textContent = '✅ Image uploaded successfully!';
          YF.showToast('Profile picture uploaded!', 'success');
        } else {
          throw new Error(data.error?.message || 'Upload failed');
        }
      } catch (error) {
        console.error('Image upload error:', error);
        uploadProgress.textContent = '❌ Upload failed. You can still save without a picture.';
        YF.showToast('Image upload failed: ' + error.message, 'error');
        uploadedImageUrl = '';
      } finally {
        submitBtn.disabled = false;
      }    });

    // Only allow digits in account number
    document.getElementById('accountNumber').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
    });

    // ===== Form Submission =====
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const user = auth.currentUser;
      if (!user) {
        YF.showToast('Session expired. Please log in again.', 'error');
        window.location.href = 'login.html';
        return;
      }

      // Get values
      const businessName   = document.getElementById('businessName').value.trim();
      const whatsapp       = document.getElementById('whatsapp').value.trim();
      const description    = document.getElementById('description').value.trim();
      const location       = document.getElementById('location').value.trim();
      const bankName       = document.getElementById('bankName').value;
      const accountNumber  = document.getElementById('accountNumber').value.trim();
      const accountName    = document.getElementById('accountName').value.trim();
      const customMessage  = document.getElementById('customMessage').value.trim();

      // Validation
      const required = [
        { val: businessName,  id: 'businessName',  label: 'Business Name' },
        { val: whatsapp,      id: 'whatsapp',      label: 'WhatsApp Number' },
        { val: bankName,      id: 'bankName',      label: 'Bank Name' },
        { val: accountNumber, id: 'accountNumber', label: 'Account Number' },
        { val: accountName,   id: 'accountName',   label: 'Account Name' }
      ];

      let firstError = null;
      required.forEach(field => {
        const el = document.getElementById(field.id);
        if (!field.val) {
          el.classList.add('error');
          if (!firstError) firstError = field.label;
        } else {
          el.classList.remove('error');
        }
      });

      if (accountNumber && accountNumber.length !== 10) {
        document.getElementById('accountNumber').classList.add('error');        firstError = firstError || 'Account Number must be exactly 10 digits';
      }

      if (firstError) {
        YF.showToast(`Please fill in: ${firstError}`, 'error');
        return;
      }

      // Show loading
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      YF.showLoading('Saving business details...');

      try {
        // ✅ Save to business_profiles collection (matches Firestore rules)
        await db.collection('business_profiles').doc(user.uid).set({
          userId:        user.uid,
          businessName:  businessName,
          whatsapp:      whatsapp,
          description:   description,
          location:      location,
          profilePic:    uploadedImageUrl || '',
          bankDetails: {
            bankName:      bankName,
            accountNumber: accountNumber,
            accountName:   accountName
          },
          customMessage:   customMessage || 'Please pay before delivery. We deliver within 24hrs.',
          thankYouMessage: 'Thanks for patronage! 🙏',
          updatedAt:       firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        // ✅ Update users collection
        await db.collection('users').doc(user.uid).update({
          businessSetup: true,
          businessName:  businessName,
          profilePic:    uploadedImageUrl || '',
          updatedAt:     firebase.firestore.FieldValue.serverTimestamp()
        });

        YF.hideLoading();
        YF.showToast('✅ Business setup complete!', 'success');

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);

      } catch (error) {
        YF.hideLoading();
        submitBtn.classList.remove('loading');        submitBtn.disabled = false;
        
        console.error('Setup error:', error.code, error.message);
        
        if (error.code === 'permission-denied') {
          YF.showToast('❌ Permission denied. Check Firestore rules.', 'error');
        } else {
          YF.showToast('Error saving: ' + error.message, 'error');
        }
      }
    });

    // Clear error highlight on input
    document.querySelectorAll('.form-input, .form-select, .form-textarea').forEach(el => {
      el.addEventListener('input', () => el.classList.remove('error'));
      el.addEventListener('change', () => el.classList.remove('error'));
    });
  </script>
</body>
</html>
