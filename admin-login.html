<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D; --light-gray: #ADB5BD;
      --coral: #FF6B6B; --teal: #4ECDC4; --gold: #FFD93D;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --shadow-md: 0 4px 20px rgba(27, 58, 95, 0.12);
      --shadow-lg: 0 8px 40px rgba(27, 58, 95, 0.18);
      --radius-sm: 8px; --radius-md: 16px; --radius-lg: 24px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0F1F33 0%, #1B3A5F 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    
    .admin-container { width: 100%; max-width: 440px; }
    .admin-card { background: var(--white); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-lg); }
    
    .admin-header { text-align: center; margin-bottom: 2rem; }
    .admin-logo { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 1.5rem; }
    .admin-logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, var(--coral), var(--gold)); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 700; font-size: 1.25rem; }
    .admin-logo-text { font-size: 1.5rem; font-weight: 800; color: var(--navy); }
    .admin-badge { display: inline-block; background: rgba(255, 107, 107, 0.1); color: var(--coral); padding: 0.375rem 1rem; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 700; margin-bottom: 1rem; }
    .admin-title { font-size: 1.5rem; font-weight: 700; color: var(--navy-dark); margin-bottom: 0.5rem; }
    .admin-subtitle { color: var(--gray); font-size: 0.95rem; }
    
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-weight: 600; color: var(--navy); margin-bottom: 0.5rem; font-size: 0.9rem; }
    .input-wrapper { position: relative; }
    .form-input { width: 100%; padding: 0.875rem 1rem; padding-right: 2.5rem; border: 2px solid #E5E7EB; border-radius: var(--radius-sm); font-size: 1rem; font-family: inherit; transition: var(--transition); background: var(--white); }
    .form-input:focus { outline: none; border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15); }
    .form-input.error { border-color: var(--coral); }
    .input-icon { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: var(--light-gray); cursor: pointer; }
    .error-message { color: var(--coral); font-size: 0.8rem; margin-top: 0.375rem; display: none; }
    .error-message.show { display: block; }
    
    .btn-submit { width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--coral), #EE5A5A); color: var(--white); border: none; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 700; font-family: inherit; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; }
    .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: var(--white); border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
    .btn-submit.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
        .back-link { text-align: center; margin-top: 1.5rem; }
    .back-link a { color: var(--gray); text-decoration: none; font-size: 0.9rem; }
    .back-link a:hover { color: var(--navy); }
    
    .yf-toast { position: fixed; top: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 0.75rem; box-shadow: var(--shadow-lg); z-index: 9999; opacity: 0; transform: translateX(100%); transition: all 0.3s ease; font-weight: 600; font-size: 0.9rem; }
    .yf-toast.show { opacity: 1; transform: translateX(0); }
    .yf-toast--success { background: #2ECC71; color: white; }
    .yf-toast--error { background: var(--coral); color: white; }
    .yf-toast--warning { background: var(--gold); color: var(--navy-dark); }
    
    @media (max-width: 480px) { .admin-card { padding: 1.5rem; } }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-card">
      <div class="admin-header">
        <div class="admin-logo">
          <div class="admin-logo-icon"><i class="fas fa-shield-alt"></i></div>
          <span class="admin-logo-text">YAN-FLOWS</span>
        </div>
        <div class="admin-badge"><i class="fas fa-lock"></i> Admin Access Only</div>
        <h1 class="admin-title">Admin Login</h1>
        <p class="admin-subtitle">Secure access to platform management</p>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label">Admin Email</label>
          <div class="input-wrapper">
            <input type="email" id="adminEmail" class="form-input" placeholder="admin@yanflows.com" autocomplete="email" required/>
          </div>
          <div class="error-message" id="emailError">Invalid admin email</div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="adminPassword" class="form-input" placeholder="Enter admin password" autocomplete="current-password" required/>
            <i class="fas fa-eye input-icon" id="togglePassword"></i>
          </div>
          <div class="error-message" id="passwordError">Password is required</div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Access Admin Panel</span>
          <div class="spinner"></div>
        </button>
      </form>
      <div class="back-link">
        <a href="login.html"><i class="fas fa-arrow-left"></i> Back to User Login</a>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>

  <script>
    // Admin emails - Add your email here
    const ADMIN_EMAILS = ["admin@yanflows.com", "youremail@gmail.com"];

    const form = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('adminEmail');
    const passwordInput = document.getElementById('adminPassword');
    const submitBtn = document.getElementById('submitBtn');
    const togglePassword = document.getElementById('togglePassword');

    // Toggle Password
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.classList.toggle('fa-eye');
      togglePassword.classList.toggle('fa-eye-slash');
    });

    // Validation
    emailInput.addEventListener('input', () => {
      const isValid = YF.isValidEmail(emailInput.value) && ADMIN_EMAILS.includes(emailInput.value.trim());
      document.getElementById('emailError').classList.toggle('show', !isValid && emailInput.value.length > 0);
    });

    // Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!ADMIN_EMAILS.includes(email)) {
        YF.showToast('This email is not authorized for admin access', 'error');
        return;
      }

      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Verify admin role in Firestore
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (!userDoc.exists || userDoc.data().role !== 'admin') {
          await auth.signOut();
          YF.showToast('Account does not have admin privileges', 'error');
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
          return;
        }

        YF.showToast('✅ Welcome Admin! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'admin-panel.html', 1500);

      } catch (error) {
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        
        let message = 'Invalid credentials. Please try again.';
        if (error.code === 'auth/user-not-found') message = 'No admin account found with this email.';
        if (error.code === 'auth/wrong-password') message = 'Incorrect password.';
        if (error.code === 'auth/too-many-requests') message = 'Too many attempts. Please wait.';
        
        YF.showToast(message, 'error');
      }
    });

    // Auto-redirect if already admin logged in
    auth.onAuthStateChanged(async (user) => {
      if (user && ADMIN_EMAILS.includes(user.email)) {
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists && doc.data().role === 'admin') {
          window.location.href = 'admin-panel.html';
        }
      }
    });
  </script>
</body>
</html>
