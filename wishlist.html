<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Wishlist | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* ========================================
       YAN-FLOWS - WISHLIST PAGE STYLES
       Luxury Theme: Navy Blue + White + Accents
       ======================================== */
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D;
      --coral: #FF6B6B; --coral-hover: #EE5A5A;
      --teal: #4ECDC4; --teal-hover: #3DBDB4;
      --gold: #FFD93D; --danger: #FF4757;
      --shadow-sm: 0 2px 8px rgba(27, 58, 95, 0.08);
      --shadow-md: 0 4px 20px rgba(27, 58, 95, 0.12);
      --shadow-lg: 0 8px 40px rgba(27, 58, 95, 0.18);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --radius-sm: 8px; --radius-md: 16px;
      --space-sm: 1rem; --space-md: 2rem;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); color: var(--navy); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; }

    /* ===== NAVBAR ===== */
    .navbar { background: var(--white); box-shadow: var(--shadow-sm); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
    .navbar-container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-sm); display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 800; color: var(--navy); }
    .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--navy), var(--teal)); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 700; }
    .nav-back { font-weight: 500; color: var(--gray); display: flex; align-items: center; gap: 0.5rem; }
    .nav-back:hover { color: var(--navy); }

    /* ===== MAIN CONTAINER ===== */
    .main-container { flex: 1; padding: var(--space-md) var(--space-sm); max-width: 1200px; margin: 0 auto; width: 100%; }
    
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); flex-wrap: wrap; gap: 1rem; }
    .page-title h1 { font-size: 1.75rem; color: var(--navy-dark); margin-bottom: 0.25rem; }
    .page-title p { color: var(--gray); font-size: 0.95rem; }
    
    .wishlist-stats { display: flex; gap: 1rem; align-items: center; }
    .stat-badge { background: var(--white); padding: 0.5rem 1rem; border-radius: var(--radius-full); font-size: 0.9rem; font-weight: 600; box-shadow: var(--shadow-sm); }    .stat-badge i { color: var(--coral); margin-right: 0.5rem; }

    /* Wishlist Grid */
    .wishlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    
    .wishlist-item {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: var(--transition);
      position: relative;
      border: 2px solid transparent;
    }
    .wishlist-item:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--teal); }
    
    .item-image-wrap { position: relative; height: 220px; overflow: hidden; background: #E2E8F0; }
    .item-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .wishlist-item:hover .item-image { transform: scale(1.05); }
    
    .remove-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--danger);
      cursor: pointer;
      transition: var(--transition);
      z-index: 2;
      box-shadow: var(--shadow-sm);
    }
    .remove-btn:hover { background: var(--danger); color: var(--white); transform: rotate(90deg); }
    
    .stock-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 2;
    }
    .badge-in-stock { background: rgba(46,213,115,0.9); color: white; }    .badge-out-stock { background: rgba(108,117,125,0.9); color: white; }
    
    .item-content { padding: 1.25rem; }
    .item-category { font-size: 0.8rem; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.25rem; }
    .item-name { font-weight: 700; font-size: 1.05rem; color: var(--navy-dark); margin-bottom: 0.5rem; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .item-price { font-size: 1.25rem; font-weight: 800; color: var(--navy); margin-bottom: 1rem; }
    
    .item-actions { display: flex; gap: 0.5rem; }
    .btn { padding: 0.75rem 1rem; font-weight: 600; font-size: 0.9rem; border-radius: var(--radius-sm); transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 0.5rem; flex: 1; }
    .btn-primary { background: var(--navy); color: var(--white); }
    .btn-primary:hover { background: var(--coral); }
    .btn-outline { background: transparent; border: 1px solid #E2E8F0; color: var(--navy); }
    .btn-outline:hover { background: var(--light-bg); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Empty State */
    .empty-state { text-align: center; padding: 4rem 1rem; }
    .empty-state i { font-size: 4rem; color: var(--gray); opacity: 0.3; margin-bottom: 1rem; }
    .empty-state h2 { color: var(--navy); margin-bottom: 0.5rem; }
    .empty-state p { color: var(--gray); margin-bottom: 1.5rem; max-width: 400px; margin-left: auto; margin-right: auto; }
    .empty-state .btn { display: inline-flex; }

    /* Toast */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--white); padding: 1rem 1.25rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 0.75rem; min-width: 280px; transform: translateX(120%); transition: transform 0.3s ease; border-left: 4px solid var(--coral); }
    .toast.success { border-left-color: var(--teal); }
    .toast.show { transform: translateX(0); }

    /* Responsive */
    @media (max-width: 640px) {
      .page-header { flex-direction: column; align-items: flex-start; }
      .wishlist-grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.5rem !important; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">YF</div>
        YAN-FLOWS
      </a>
      <a href="storefront.html" class="nav-back"><i class="fas fa-arrow-left"></i> Back to Store</a>
    </div>
  </nav>

  <!-- Toast Container -->  <div class="toast-container" id="toastContainer"></div>

  <!-- Main Content -->
  <main class="main-container">
    <header class="page-header">
      <div class="page-title">
        <h1>My Wishlist</h1>
        <p>Save your favorite products and shop them later</p>
      </div>
      <div class="wishlist-stats">
        <div class="stat-badge"><i class="fas fa-heart"></i> <span id="wishlistCount">0</span> Items</div>
        <button class="btn btn-outline" onclick="clearWishlist()" style="padding:0.5rem 1rem;font-size:0.85rem;">
          <i class="fas fa-trash-alt"></i> Clear All
        </button>
      </div>
    </header>

    <!-- Wishlist Grid -->
    <div class="wishlist-grid" id="wishlistGrid">
      <div class="empty-state" id="emptyState">
        <i class="fas fa-heart-broken"></i>
        <h2>Your wishlist is empty</h2>
        <p>Start browsing our stores and add products you love to your wishlist for later.</p>
        <a href="storefront.html" class="btn btn-primary">
          <i class="fas fa-store"></i> Browse Stores
        </a>
      </div>
    </div>
  </main>

  <!-- Core Engine -->
  <script src="app.js"></script>

  <!-- Page Script -->
  <script>
    // ===== DOM ELEMENTS =====
    const wishlistGrid = document.getElementById('wishlistGrid');
    const emptyState = document.getElementById('emptyState');
    const wishlistCountEl = document.getElementById('wishlistCount');
    const toastContainer = document.getElementById('toastContainer');

    // State
    let wishlist = JSON.parse(localStorage.getItem('yf_wishlist') || '[]');
    let allProducts = []; // Will be populated from Firestore

    // ===== INITIALIZATION =====
    document.addEventListener('DOMContentLoaded', () => {
      renderWishlist();
      loadWishlistProducts();
    });
    // ===== LOAD PRODUCTS FROM FIRESTORE =====
    async function loadWishlistProducts() {
      if (wishlist.length === 0) return;
      
      try {
        // Fetch all products and filter by wishlist IDs
        const snapshot = await firebase.firestore().collection('products').get();
        allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        // Filter to only wishlist items
        const wishlistProducts = allProducts.filter(p => wishlist.includes(p.id));
        
        if (wishlistProducts.length !== wishlist.length) {
          // Some products may have been deleted, clean up wishlist
          const validIds = wishlistProducts.map(p => p.id);
          wishlist = wishlist.filter(id => validIds.includes(id));
          localStorage.setItem('yf_wishlist', JSON.stringify(wishlist));
        }
        
        renderWishlist();
      } catch (err) {
        console.error('Load products error:', err);
        YF.ui.toast('Failed to load wishlist items.', 'error');
      }
    }

    // ===== RENDER WISHLIST =====
    function renderWishlist() {
      wishlistCountEl.textContent = wishlist.length;
      
      if (wishlist.length === 0) {
        wishlistGrid.innerHTML = '';
        wishlistGrid.appendChild(emptyState);
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      wishlistGrid.innerHTML = '';

      // Get products that are in wishlist
      const wishlistProducts = allProducts.filter(p => wishlist.includes(p.id));

      wishlistProducts.forEach(product => {
        const inStock = product.stock > 0;
        const card = document.createElement('div');
        card.className = 'wishlist-item';
        card.innerHTML = `
          <div class="item-image-wrap">            <img src="${product.imageUrl || 'https://via.placeholder.com/400x300/E2E8F0/6C757D?text=No+Image'}" class="item-image" alt="${product.name}"/>
            <button class="remove-btn" onclick="removeFromWishlist('${product.id}')" title="Remove from wishlist">
              <i class="fas fa-times"></i>
            </button>
            <span class="stock-badge ${inStock ? 'badge-in-stock' : 'badge-out-stock'}">
              ${inStock ? 'In Stock' : 'Out of Stock'}
            </span>
          </div>
          <div class="item-content">
            <div class="item-category">${product.category || 'General'}</div>
            <div class="item-name">${product.name}</div>
            <div class="item-price">${YF.ui.formatNaira(product.price)}</div>
            <div class="item-actions">
              <button class="btn btn-primary" onclick="addToCart('${product.id}')" ${!inStock ? 'disabled' : ''}>
                <i class="fas fa-cart-plus"></i> ${inStock ? 'Add to Cart' : 'Out of Stock'}
              </button>
              <button class="btn btn-outline" onclick="viewProduct('${product.id}')">
                <i class="fas fa-eye"></i> View
              </button>
            </div>
          </div>
        `;
        wishlistGrid.appendChild(card);
      });
    }

    // ===== REMOVE FROM WISHLIST =====
    window.removeFromWishlist = (productId) => {
      const index = wishlist.indexOf(productId);
      if (index > -1) {
        wishlist.splice(index, 1);
        localStorage.setItem('yf_wishlist', JSON.stringify(wishlist));
        renderWishlist();
        YF.ui.toast('Removed from wishlist', 'info');
      }
    };

    // ===== CLEAR WISHLIST =====
    window.clearWishlist = () => {
      if (wishlist.length === 0) return;
      
      if (confirm(`Are you sure you want to remove all ${wishlist.length} items from your wishlist?`)) {
        wishlist = [];
        localStorage.setItem('yf_wishlist', JSON.stringify(wishlist));
        renderWishlist();
        YF.ui.toast('Wishlist cleared', 'success');
      }
    };

    // ===== ADD TO CART =====    window.addToCart = (productId) => {
      const product = allProducts.find(p => p.id === productId);
      if (!product) return;

      // Get existing cart
      let cart = JSON.parse(localStorage.getItem('yf_cart') || '[]');
      
      // Check if already in cart
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          price: product.price,
          qty: 1,
          image: product.imageUrl,
          sellerId: product.sellerId
        });
      }

      localStorage.setItem('yf_cart', JSON.stringify(cart));
      YF.ui.toast('Added to cart! 🛒', 'success');
      
      // Update cart count if navbar has it
      updateCartCount(cart.length);
    };

    // ===== VIEW PRODUCT =====
    window.viewProduct = (productId) => {
      // Redirect to storefront with product filter or detail
      window.location.href = `storefront.html?product=${productId}`;
    };

    // ===== UPDATE CART COUNT =====
    function updateCartCount(count) {
      // This would update the cart badge in navbar if it exists
      const cartBadge = document.querySelector('.cart-count');
      if (cartBadge) {
        cartBadge.textContent = count;
      }
    }

    console.log('✅ Wishlist Page Loaded');
    console.log('❤️ Wishlist Management Active');
    console.log('🛒 Cart Integration Ready');
  </script>
<script src="app.js"></script>
</body>
</html>
