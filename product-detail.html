<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="pageTitle">Product | YAN-FLOWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --navy: #1B3A5F; --navy-dark: #0F1F33; --navy-light: #2C5282;
      --white: #FFFFFF; --light-bg: #F8F9FA; --gray: #6C757D;
      --coral: #FF6B6B; --teal: #4ECDC4; --gold: #FFD93D;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.12);
      --radius-sm: 8px; --radius-md: 16px;
      --transition: all 0.3s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light-bg); color: var(--navy-dark); line-height: 1.6; }

    .top-navbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 70px; background: var(--white); box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; z-index: 1000;
    }
    .navbar-logo {
      display: flex; align-items: center; gap: 0.75rem;
      font-size: 1.3rem; font-weight: 800; color: var(--navy); text-decoration: none;
    }
    .navbar-logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--navy), var(--teal));
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; color: white; font-weight: 700;
    }
    .navbar-actions { display: flex; align-items: center; gap: 0.75rem; }
    .nav-icon-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--light-bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--navy); cursor: pointer; transition: var(--transition);
      position: relative; text-decoration: none; border: none;
    }
    .nav-icon-btn:hover { background: #E5E7EB; transform: translateY(-2px); }
    .nav-icon-btn .badge {
      position: absolute; top: -2px; right: -2px;
      width: 20px; height: 20px; background: var(--coral); color: white;
      font-size: 0.7rem; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-weight: 700; border: 2px solid white;
    }
    .user-menu {
      display: flex; align-items: center; gap: 0.5rem;
      cursor: pointer; padding: 0.25rem 0.75rem;
      border-radius: 9999px; transition: var(--transition); background: var(--light-bg);
    }
    .user-menu:hover { background: #E5E7EB; }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--navy); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; overflow: hidden; font-size: 0.85rem;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-name { font-weight: 600; color: var(--navy); font-size: 0.85rem; }

    .back-bar {
      position: fixed; top: 70px; left: 0; right: 0;
      background: var(--white); padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #E5E7EB; z-index: 999;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .back-btn {
      display: flex; align-items: center; gap: 0.5rem;
      color: var(--navy); font-weight: 600; text-decoration: none;
      font-size: 0.9rem; cursor: pointer; background: none; border: none;
      padding: 0.375rem 0.75rem; border-radius: var(--radius-sm);
      transition: var(--transition);
    }
    .back-btn:hover { background: var(--light-bg); }
    .breadcrumb { font-size: 0.85rem; color: var(--gray); }

    .main-content {
      max-width: 1200px; margin: 130px auto 2rem;
      padding: 0 1.5rem;
      display: grid; grid-template-columns: 1fr 420px; gap: 2rem;
    }

    /* Gallery */
    .product-gallery {
      background: var(--white); border-radius: var(--radius-md);
      padding: 1.5rem; box-shadow: var(--shadow-sm);
    }
    .main-image-container {
      width: 100%; aspect-ratio: 1/1;
      background: var(--light-bg); border-radius: var(--radius-md);
      overflow: hidden; margin-bottom: 1rem; position: relative;
    }
    .main-image {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s ease; cursor: zoom-in;
    }
    .main-image:hover { transform: scale(1.03); }
    .image-badge {
      position: absolute; top: 1rem; left: 1rem;
      padding: 0.4rem 0.9rem; border-radius: 9999px;
      font-weight: 700; font-size: 0.8rem; z-index: 2;
    }
    .badge-sale { background: var(--coral); color: white; }
    .badge-new { background: var(--teal); color: var(--navy-dark); }
    .thumbnail-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem;
    }
    .thumbnail {
      aspect-ratio: 1/1; border-radius: var(--radius-sm); overflow: hidden;
      cursor: pointer; border: 3px solid transparent; transition: var(--transition);
      background: var(--light-bg);
    }
    .thumbnail:hover, .thumbnail.active { border-color: var(--teal); transform: scale(1.05); }
    .thumbnail img { width: 100%; height: 100%; object-fit: cover; }

    /* Product Info Panel */
    .product-info {
      background: var(--white); border-radius: var(--radius-md);
      padding: 1.75rem; box-shadow: var(--shadow-sm);
      position: sticky; top: 130px; height: fit-content;
    }
    .product-title {
      font-size: 1.6rem; font-weight: 800;
      color: var(--navy-dark); margin-bottom: 0.75rem; line-height: 1.3;
    }
    .product-meta {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1.25rem; flex-wrap: wrap;
    }
    .product-rating {
      display: flex; align-items: center; gap: 0.375rem;
      color: var(--gold); font-weight: 600;
    }
    .product-rating span { color: var(--gray); font-weight: 400; }
    .product-stock {
      padding: 0.35rem 0.75rem; border-radius: 9999px;
      font-size: 0.8rem; font-weight: 600;
    }
    .in-stock { background: #D1FAE5; color: #065F46; }
    .low-stock { background: #FEE2E2; color: #991B1B; }
    .out-stock { background: #E5E7EB; color: var(--gray); }

    .seller-card {
      display: flex; align-items: center; gap: 0.875rem;
      padding: 1rem; background: var(--light-bg);
      border-radius: var(--radius-sm); margin-bottom: 1.25rem;
    }
    .seller-avatar-wrap {
      width: 50px; height: 50px; border-radius: 50%;
      overflow: hidden; border: 2px solid var(--teal);
      cursor: pointer; flex-shrink: 0;
      background: var(--light-bg); display: flex;
      align-items: center; justify-content: center; color: var(--gray);
    }
    .seller-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .seller-info { flex: 1; }
    .seller-name-text {
      font-weight: 700; color: var(--navy); font-size: 1rem; cursor: pointer;
    }
    .seller-name-text:hover { color: var(--teal); text-decoration: underline; }
    .seller-stats-text { font-size: 0.8rem; color: var(--gray); margin-top: 0.2rem; }
    .follow-btn {
      padding: 0.45rem 1.1rem; border-radius: 9999px;
      border: 2px solid var(--navy); background: transparent;
      color: var(--navy); font-weight: 600; cursor: pointer;
      transition: var(--transition); font-size: 0.85rem; white-space: nowrap;
    }
    .follow-btn:hover { background: var(--navy); color: white; }
    .follow-btn.following { background: var(--light-bg); border-color: var(--gray); color: var(--gray); }
    .follow-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .price-section {
      margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid #E5E7EB;
    }
    .current-price { font-size: 2rem; font-weight: 800; color: var(--teal); }
    .original-price { color: var(--gray); text-decoration: line-through; margin-right: 0.5rem; font-size: 1rem; }
    .discount-badge {
      background: var(--coral); color: white;
      padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 700;
    }
    .price-note { color: var(--gray); font-size: 0.85rem; margin-top: 0.5rem; }

    .quantity-selector {
      display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem;
    }
    .quantity-label { font-weight: 600; color: var(--navy); }
    .quantity-controls {
      display: flex; align-items: center;
      border: 2px solid #E5E7EB; border-radius: var(--radius-sm); overflow: hidden;
    }
    .quantity-btn {
      width: 38px; height: 38px; border: none; background: var(--light-bg);
      color: var(--navy); font-size: 1.2rem; cursor: pointer; transition: var(--transition);
    }
    .quantity-btn:hover { background: #E5E7EB; }
    .quantity-input {
      width: 48px; text-align: center; border: none;
      font-weight: 700; font-size: 1.05rem; padding: 0.4rem;
    }
    .quantity-input:focus { outline: none; }

    .action-buttons { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem; }
    .btn-primary {
      width: 100%; padding: 1.1rem; background: var(--navy); color: white;
      border: none; border-radius: var(--radius-sm); font-weight: 700;
      font-size: 1rem; cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    }
    .btn-primary:hover { background: var(--navy-light); transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary {
      width: 100%; padding: 0.9rem; background: var(--light-bg); color: var(--navy);
      border: 2px solid var(--navy); border-radius: var(--radius-sm); font-weight: 600;
      cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-secondary:hover { background: var(--navy); color: white; }
    .btn-whatsapp { background: #25D366 !important; color: white !important; border-color: #25D366 !important; }
    .btn-whatsapp:hover { background: #128C7E !important; border-color: #128C7E !important; }

    .share-section {
      display: flex; align-items: center; gap: 0.75rem;
      padding-top: 1.25rem; border-top: 1px solid #E5E7EB; flex-wrap: wrap;
    }
    .share-label { font-weight: 600; color: var(--navy); font-size: 0.9rem; }
    .share-btn {
      width: 38px; height: 38px; border-radius: 50%; border: none;
      background: var(--light-bg); color: var(--navy); cursor: pointer;
      transition: var(--transition); display: flex; align-items: center; justify-content: center;
    }
    .share-btn:hover { background: #E5E7EB; transform: translateY(-2px); }

    /* Description & Specs */
    .product-details-section, .reviews-section, .related-section {
      background: var(--white); border-radius: var(--radius-md);
      padding: 1.75rem; box-shadow: var(--shadow-sm);
      margin-top: 1.5rem; grid-column: 1 / -1;
    }
    .section-title {
      font-size: 1.25rem; font-weight: 700; color: var(--navy);
      margin-bottom: 1.25rem; padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--teal);
    }
    .product-description-text {
      color: var(--gray); font-size: 1rem; line-height: 1.8;
    }
    .specs-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.25rem;
    }
    .spec-item { display: flex; flex-direction: column; gap: 0.25rem; }
    .spec-label { font-weight: 600; color: var(--navy); font-size: 0.9rem; }
    .spec-value { color: var(--gray); }

    /* Reviews */
    .review-summary {
      display: flex; align-items: center; gap: 2rem; margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .average-rating { text-align: center; }
    .average-rating .number { font-size: 2.75rem; font-weight: 800; color: var(--gold); line-height: 1; }
    .average-rating .total { color: var(--gray); font-size: 0.85rem; margin-top: 0.25rem; }
    .rating-bars { flex: 1; min-width: 200px; }
    .rating-bar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem; }
    .rating-bar .stars { width: 55px; font-size: 0.8rem; color: var(--gray); }
    .rating-bar .bar { flex: 1; height: 7px; background: #E5E7EB; border-radius: 4px; overflow: hidden; }
    .rating-bar .fill { height: 100%; background: var(--gold); border-radius: 4px; }
    .rating-bar .count { width: 28px; text-align: right; font-size: 0.8rem; color: var(--gray); }
    .review-list { display: flex; flex-direction: column; gap: 1.25rem; }
    .review-item { padding-bottom: 1.25rem; border-bottom: 1px solid #E5E7EB; }
    .review-item:last-child { padding-bottom: 0; border-bottom: none; }
    .review-header { display: flex; align-items: center; gap: 0.875rem; margin-bottom: 0.6rem; }
    .reviewer-avatar {
      width: 44px; height: 44px; border-radius: 50%; background: var(--light-bg);
      overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .reviewer-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .reviewer-name { font-weight: 700; color: var(--navy); }
    .reviewer-date { font-size: 0.8rem; color: var(--gray); }
    .review-rating { color: var(--gold); margin-left: auto; }
    .review-text { color: var(--gray); line-height: 1.6; font-size: 0.95rem; }

    /* Related */
    .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.25rem; }
    .related-card { cursor: pointer; transition: var(--transition); }
    .related-card:hover { transform: translateY(-4px); }
    .related-image { width: 100%; aspect-ratio: 1/1; background: var(--light-bg); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 0.6rem; }
    .related-image img { width: 100%; height: 100%; object-fit: cover; }
    .related-name { font-weight: 600; color: var(--navy); font-size: 0.9rem; margin-bottom: 0.25rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .related-price { font-weight: 800; color: var(--teal); }

    /* Toast */
    .yf-toast {
      position: fixed; top: 90px; right: 1.5rem;
      padding: 1rem 1.25rem; border-radius: var(--radius-sm);
      display: flex; align-items: center; gap: 0.75rem;
      box-shadow: var(--shadow-md); z-index: 9999;
      opacity: 0; transform: translateX(100%); transition: all 0.3s ease;
      font-weight: 600; font-size: 0.9rem; max-width: 360px;
    }
    .yf-toast.show { opacity: 1; transform: translateX(0); }
    .yf-toast--success { background: #2ECC71; color: white; }
    .yf-toast--error { background: var(--coral); color: white; }
    .yf-toast--info { background: var(--navy); color: white; }

    .loading-spinner {
      width: 48px; height: 48px; border: 4px solid var(--light-bg);
      border-top-color: var(--teal); border-radius: 50%;
      animation: spin 1s linear infinite; margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1024px) {
      .main-content { grid-template-columns: 1fr; }
      .product-info { position: static; }
    }
    @media (max-width: 768px) {
      .top-navbar { padding: 0 1rem; }
      .back-bar { padding: 0.6rem 1rem; }
      .main-content { margin-top: 120px; padding: 0 1rem; gap: 1rem; }
      .product-gallery, .product-info { padding: 1.25rem; }
      .product-details-section, .reviews-section, .related-section { padding: 1.25rem; }
      .product-title { font-size: 1.35rem; }
      .current-price { font-size: 1.6rem; }
      .specs-grid { grid-template-columns: 1fr 1fr; }
      .yf-toast { right: 1rem; left: 1rem; max-width: none; }
    }
  </style>
</head>
<body>

<nav class="top-navbar">
  <a href="dashboard.html" class="navbar-logo">
    <div class="navbar-logo-icon">YF</div>
    <span>YAN-FLOWS</span>
  </a>
  <div class="navbar-actions">
    <a href="cart.html" class="nav-icon-btn" title="Cart">
      <i class="fas fa-shopping-cart"></i>
      <span class="badge" id="cartBadge" style="display:none;">0</span>
    </a>
    <a href="notification.html" class="nav-icon-btn" title="Notifications">
      <i class="fas fa-bell"></i>
    </a>
    <div class="user-menu" onclick="window.location.href='profile.html'">
      <div class="user-avatar" id="navAvatar"><i class="fas fa-user"></i></div>
      <span class="user-name" id="navUserName">User</span>
    </div>
  </div>
</nav>

<div class="back-bar">
  <button class="back-btn" onclick="history.back()">
    <i class="fas fa-arrow-left"></i> Back
  </button>
  <span class="breadcrumb" id="breadcrumb">/ Product</span>
</div>

<main class="main-content" id="mainContent">
  <div style="grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--gray);">
    <div class="loading-spinner"></div>
    <p style="font-size:1.05rem;">Loading product...</p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBJ4t5SDaryYcjIzG737tLPNIwXRnL9Qlc",
    authDomain: "yan-flow.firebaseapp.com",
    projectId: "yan-flow",
    storageBucket: "yan-flow.firebasestorage.app",
    messagingSenderId: "373204559623",
    appId: "1:373204559623:web:56e1c8abf07945c53187a2"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  const productId = new URLSearchParams(window.location.search).get('id');

  let currentUser     = null;
  let currentUserData = null;
  let product         = null;
  let sellerData      = null;
  let cart            = [];
  let quantity        = 1;
  let maxStock        = 0;

  // ── Helpers ────────────────────────────────────────────────────────────────

  function formatCurrency(n) {
    return '₦' + Number(n || 0).toLocaleString('en-NG');
  }

  function resolveDisplayName(data) {
    if (!data) return 'Unknown';
    return data.businessName || data.shopName || data.storeName ||
           data.fullName || data.displayName || data.username || 'Unknown Seller';
  }

  function showToast(msg, type) {
    type = type || 'success';
    const t = document.createElement('div');
    t.className = 'yf-toast yf-toast--' + type;
    const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
    t.innerHTML = '<i class="fas ' + icon + '"></i><span>' + msg + '</span>';
    document.body.appendChild(t);
    setTimeout(function() { t.classList.add('show'); }, 10);
    setTimeout(function() { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 300); }, 3000);
  }

  // ── Cart ────────────────────────────────────────────────────────────────────
  // FIX: Load cart immediately on script run (not inside auth guard)
  // so the badge shows correctly even before auth resolves.

  function loadCart() {
    try {
      cart = JSON.parse(localStorage.getItem('yanflows_cart') || '[]');
    } catch(e) {
      cart = [];
    }
    updateCartBadge();
  }

  function updateCartBadge() {
    // FIX: always re-read from localStorage so badge is always accurate
    try {
      cart = JSON.parse(localStorage.getItem('yanflows_cart') || '[]');
    } catch(e) {
      cart = [];
    }
    const b = document.getElementById('cartBadge');
    if (!b) return;
    const c = cart.reduce(function(s, i) { return s + (i.quantity || 1); }, 0);
    b.textContent = c;
    b.style.display = c > 0 ? 'flex' : 'none';
  }

  // FIX: Call loadCart immediately so the badge is visible on page load
  loadCart();

  // ── Auth ────────────────────────────────────────────────────────────────────

  auth.onAuthStateChanged(async function(user) {
    currentUser = user;
    if (user) {
      // Load user profile for navbar
      try {
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
          currentUserData = doc.data();
          const name = resolveDisplayName(currentUserData);
          document.getElementById('navUserName').textContent = name;
          if (currentUserData.profilePic) {
            document.getElementById('navAvatar').innerHTML =
              '<img src="' + currentUserData.profilePic + '" alt="me" onerror="this.style.display=\'none\'"/>';
          } else {
            document.getElementById('navAvatar').innerHTML =
              '<div style="display:flex;align-items:center;justify-content:height:100%;font-weight:700;">' + name[0].toUpperCase() + '</div>';
          }
        }
      } catch(e) { /* non-critical */ }
    }
    await loadProduct();
  });

  // ── Load Product ─────────────────────────────────────────────────────────────

  async function loadProduct() {
    if (!productId) {
      showError('No product ID in URL. Please go back and tap a product again.');
      return;
    }

    try {
      const doc = await db.collection('products').doc(productId).get();
      if (!doc.exists) {
        showError('This product no longer exists or was removed.');
        return;
      }

      product = Object.assign({ id: doc.id }, doc.data());
      document.getElementById('pageTitle').textContent = (product.name || 'Product') + ' | YAN-FLOWS';
      document.getElementById('breadcrumb').textContent = '/ ' + (product.name || 'Product');

      // Increment views (fire and forget)
      db.collection('products').doc(productId).update({
        views: firebase.firestore.FieldValue.increment(1)
      }).catch(function(){});

      await loadSellerData();
      renderPage();
      loadRelatedProducts();
      loadReviews();

    } catch (err) {
      console.error('loadProduct error:', err);
      showError('Error loading product: ' + (err.message || err.code || 'unknown error'));
    }
  }

  // ── Load Seller ──────────────────────────────────────────────────────────────

  async function loadSellerData() {
    if (!product || !product.sellerId) return;
    try {
      const doc = await db.collection('users').doc(product.sellerId).get();
      if (doc.exists) sellerData = doc.data();
    } catch(e) {
      console.warn('Seller fetch blocked:', e.code || e.message);
      sellerData = null;
    }
  }

  // ── Render Page ──────────────────────────────────────────────────────────────

  function renderPage() {
    // FIX: reset quantity to 1 each time a product page is rendered
    quantity = 1;

    const container = document.getElementById('mainContent');
    container.innerHTML = '';

    // ── Left column ──
    const leftCol = document.createElement('div');

    // Gallery
    const images = Array.isArray(product.images) && product.images.length
      ? product.images
      : (product.image ? [product.image] : ['https://via.placeholder.com/600?text=No+Image']);

    const badgeHTML = product.isNew
      ? '<span class="image-badge badge-new">NEW</span>'
      : product.onSale ? '<span class="image-badge badge-sale">SALE</span>' : '';

    const thumbsHTML = images.map(function(img, i) {
      return '<div class="thumbnail' + (i === 0 ? ' active' : '') + '" onclick="changeMainImage(\'' + img.replace(/'/g, "\\'") + '\', this)">' +
        '<img src="' + img + '" alt="thumb ' + (i+1) + '" onerror="this.src=\'https://via.placeholder.com/100?text=?\'"/></div>';
    }).join('');

    leftCol.innerHTML =
      '<section class="product-gallery">' +
        '<div class="main-image-container">' +
          badgeHTML +
          '<img id="mainImage" src="' + images[0] + '" alt="' + (product.name||'') + '" class="main-image" onerror="this.src=\'https://via.placeholder.com/600?text=Image+Error\'"/>' +
        '</div>' +
        '<div class="thumbnail-grid">' + thumbsHTML + '</div>' +
      '</section>' +

      // Description
      '<section class="product-details-section">' +
        '<h2 class="section-title">📋 Description</h2>' +
        '<div class="product-description-text">' + ((product.description || 'No description provided.').replace(/\n/g, '<br>')) + '</div>' +
        (product.specs && Object.keys(product.specs).length
          ? '<h3 class="section-title" style="margin-top:1.75rem;">⚙️ Specifications</h3><div class="specs-grid">' +
              Object.entries(product.specs).map(function(e) {
                return '<div class="spec-item"><span class="spec-label">' + e[0] + '</span><span class="spec-value">' + e[1] + '</span></div>';
              }).join('') + '</div>'
          : '') +
      '</section>' +

      // Reviews placeholder
      '<section class="reviews-section" id="reviewsSection">' +
        '<h2 class="section-title">⭐ Reviews (<span id="reviewCount">' + (product.reviewCount || 0) + '</span>)</h2>' +
        '<div class="review-summary">' +
          '<div class="average-rating">' +
            '<div class="number" id="avgRating">' + (product.rating ? product.rating.toFixed(1) : '0.0') + '</div>' +
            '<div class="total"><span id="totalReviews">' + (product.reviewCount || 0) + '</span> reviews</div>' +
          '</div>' +
          '<div class="rating-bars" id="ratingBars"></div>' +
        '</div>' +
        '<div class="review-list" id="reviewList"><p style="color:var(--gray);text-align:center;padding:1.5rem;">Loading reviews...</p></div>' +
      '</section>' +

      // Related placeholder
      '<section class="related-section">' +
        '<h2 class="section-title">🔍 You May Also Like</h2>' +
        '<div class="related-grid" id="relatedGrid"><p style="color:var(--gray);">Loading...</p></div>' +
      '</section>';

    // ── Right column: product info ──
    const rightCol = document.createElement('aside');
    rightCol.className = 'product-info';

    maxStock = product.stock || 0;
    const stockLabel = maxStock === 0 ? 'Out of Stock' : maxStock <= 5 ? 'Only ' + maxStock + ' left!' : 'In Stock';
    const stockClass = maxStock === 0 ? 'out-stock' : maxStock <= 5 ? 'low-stock' : 'in-stock';

    const sellerName    = resolveDisplayName(sellerData) !== 'Unknown'
      ? resolveDisplayName(sellerData)
      : (product.sellerName || 'Unknown Seller');
    const sellerAvatar  = (sellerData && sellerData.profilePic) ? sellerData.profilePic : '';
    const sellerProds   = sellerData ? (sellerData.productsCount || sellerData.productCount || 0) : 0;
    const sellerFollows = sellerData ? (sellerData.followersCount || 0) : 0;
    const sellerWA      = sellerData ? (sellerData.whatsapp || sellerData.phone || '') : '';

    const priceOrigHTML = (product.originalPrice && product.originalPrice > product.price)
      ? '<span class="original-price">' + formatCurrency(product.originalPrice) + '</span>' +
        '<span class="discount-badge">-' + Math.round((1 - product.price / product.originalPrice) * 100) + '%</span>'
      : '';

    const isOwn = currentUser && product.sellerId === currentUser.uid;

    rightCol.innerHTML =
      '<h1 class="product-title" id="productTitle">' + (product.name || 'Product') + '</h1>' +
      '<div class="product-meta">' +
        '<div class="product-rating"><i class="fas fa-star"></i> <span id="ratingDisp">' + (product.rating ? product.rating.toFixed(1) : '0.0') + '</span>' +
        ' <span>(' + (product.reviewCount || 0) + ')</span></div>' +
        '<span class="product-stock ' + stockClass + '">' + stockLabel + '</span>' +
      '</div>' +

      '<div class="seller-card">' +
        '<div class="seller-avatar-wrap" id="sellerAvatarWrap" onclick="goToStore()">' +
          (sellerAvatar
            ? '<img src="' + sellerAvatar + '" alt="' + sellerName + '" onerror="this.src=\'\';this.style.display=\'none\'"/>'
            : '<i class="fas fa-store"></i>') +
        '</div>' +
        '<div class="seller-info">' +
          '<div class="seller-name-text" onclick="goToStore()">' + sellerName + '</div>' +
          '<div class="seller-stats-text">' + sellerProds + ' products · ' + sellerFollows + ' followers</div>' +
        '</div>' +
        (!isOwn
          ? '<button class="follow-btn" id="followBtn" onclick="toggleFollow()">' +
            '<i class="fas fa-user-plus"></i> Follow</button>'
          : '<span style="font-size:0.8rem;color:var(--teal);font-weight:600;">Your Product</span>') +
      '</div>' +

      '<div class="price-section">' +
        '<div style="display:flex;align-items:baseline;gap:0.75rem;flex-wrap:wrap;">' +
          '<span class="current-price">' + formatCurrency(product.price) + '</span>' +
          priceOrigHTML +
        '</div>' +
        '<p class="price-note"><i class="fas fa-shield-alt"></i> Secure checkout · YAN-FLOWS buyer protection</p>' +
      '</div>' +

      '<div class="quantity-selector">' +
        '<span class="quantity-label">Qty:</span>' +
        '<div class="quantity-controls">' +
          '<button class="quantity-btn" onclick="changeQty(-1)">−</button>' +
          // FIX: use value="1" and ensure it always reflects the quantity variable
          '<input type="number" class="quantity-input" id="quantityInput" value="1" min="1" readonly/>' +
          '<button class="quantity-btn" onclick="changeQty(1)">+</button>' +
        '</div>' +
        '<span style="font-size:0.85rem;color:var(--gray);">(' + maxStock + ' available)</span>' +
      '</div>' +

      '<div class="action-buttons">' +
        '<button class="btn-primary" id="addToCartBtn" ' + (maxStock === 0 ? 'disabled' : 'onclick="addToCartDetail()"') + '>' +
          '<i class="fas fa-cart-plus"></i> ' + (maxStock === 0 ? 'Out of Stock' : 'Add to Cart') +
        '</button>' +
        (maxStock > 0 ? '<button class="btn-secondary" onclick="buyNow()"><i class="fas fa-bolt"></i> Buy Now</button>' : '') +
        (sellerWA
          ? '<button class="btn-secondary btn-whatsapp" onclick="contactSeller()"><i class="fab fa-whatsapp"></i> Chat Seller on WhatsApp</button>'
          : '') +
      '</div>' +

      '<div class="share-section">' +
        '<span class="share-label">Share:</span>' +
        '<button class="share-btn" onclick="shareProduct(\'whatsapp\')" title="WhatsApp"><i class="fab fa-whatsapp"></i></button>' +
        '<button class="share-btn" onclick="shareProduct(\'twitter\')" title="Twitter/X"><i class="fab fa-twitter"></i></button>' +
        '<button class="share-btn" onclick="shareProduct(\'facebook\')" title="Facebook"><i class="fab fa-facebook"></i></button>' +
        '<button class="share-btn" onclick="copyLink()" title="Copy link"><i class="fas fa-link"></i></button>' +
      '</div>';

    container.appendChild(leftCol);
    container.appendChild(rightCol);

    // Render rating bars
    renderRatingBars(product.ratings || {});

    // Check follow state async
    if (currentUser && !isOwn) checkFollowState();
  }

  // ── Rating bars ──────────────────────────────────────────────────────────────

  function renderRatingBars(ratings) {
    const el = document.getElementById('ratingBars');
    if (!el) return;
    const total = Object.values(ratings).reduce(function(a,b) { return a+b; }, 0) || 1;
    el.innerHTML = [5,4,3,2,1].map(function(s) {
      const c = ratings[s] || 0;
      const pct = (c / total * 100).toFixed(0);
      return '<div class="rating-bar"><span class="stars">' + s + ' ★</span>' +
        '<div class="bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
        '<span class="count">' + c + '</span></div>';
    }).join('');
  }

  // ── Gallery ──────────────────────────────────────────────────────────────────

  window.changeMainImage = function(src, thumb) {
    const img = document.getElementById('mainImage');
    if (img) img.src = src;
    document.querySelectorAll('.thumbnail').forEach(function(t) { t.classList.remove('active'); });
    if (thumb) thumb.classList.add('active');
  };

  // ── Quantity ─────────────────────────────────────────────────────────────────
  // FIX: changeQty now updates both the local variable AND the input display correctly

  window.changeQty = function(delta) {
    const newQty = quantity + delta;
    if (newQty < 1) return;                      // can't go below 1
    if (newQty > maxStock && maxStock > 0) {      // can't exceed stock
      showToast('Maximum stock is ' + maxStock, 'error');
      return;
    }
    quantity = newQty;
    const inp = document.getElementById('quantityInput');
    if (inp) inp.value = quantity;
  };

  // ── Add to Cart ───────────────────────────────────────────────────────────────

  window.addToCartDetail = function() {
    if (!currentUser) {
      showToast('Please login to add to cart', 'info');
      setTimeout(function() { window.location.href = 'login.html'; }, 1500);
      return;
    }
    if (maxStock === 0) { showToast('Product is out of stock', 'error'); return; }

    // FIX: re-read cart from localStorage before modifying to stay in sync
    try {
      cart = JSON.parse(localStorage.getItem('yanflows_cart') || '[]');
    } catch(e) {
      cart = [];
    }

    const sellerName = resolveDisplayName(sellerData) !== 'Unknown'
      ? resolveDisplayName(sellerData)
      : (product.sellerName || 'Seller');

    const idx = cart.findIndex(function(i) { return i.productId === product.id; });
    if (idx >= 0) {
      if (cart[idx].quantity + quantity > maxStock) {
        showToast('Maximum stock reached', 'error');
        return;
      }
      cart[idx].quantity += quantity;
    } else {
      cart.push({
        productId: product.id, sellerId: product.sellerId,
        sellerName: sellerName, name: product.name,
        price: product.price, image: product.image || '',
        stock: maxStock, quantity: quantity
      });
    }

    localStorage.setItem('yanflows_cart', JSON.stringify(cart));
    // FIX: updateCartBadge re-reads localStorage so it always shows the correct count
    updateCartBadge();
    showToast('✅ Added ' + quantity + ' to cart!', 'success');
  };

  window.buyNow = function() {
    addToCartDetail();
    setTimeout(function() { window.location.href = 'checkout.html'; }, 600);
  };

  // ── Follow ───────────────────────────────────────────────────────────────────

  async function checkFollowState() {
    if (!currentUser || !product) return;
    try {
      const ref = db.collection('users').doc(currentUser.uid).collection('following').doc(product.sellerId);
      const doc = await ref.get();
      const btn = document.getElementById('followBtn');
      if (doc.exists && btn) {
        btn.classList.add('following');
        btn.innerHTML = '<i class="fas fa-user-check"></i> Following';
      }
    } catch(e) {
      try {
        const uDoc = await db.collection('users').doc(currentUser.uid).get();
        if (uDoc.exists) {
          const arr = uDoc.data().following || [];
          if (arr.includes(product.sellerId)) {
            const btn = document.getElementById('followBtn');
            if (btn) { btn.classList.add('following'); btn.innerHTML = '<i class="fas fa-user-check"></i> Following'; }
          }
        }
      } catch(e2) {}
    }
  }

  window.toggleFollow = async function() {
    if (!currentUser) { showToast('Please login to follow', 'info'); return; }
    const btn = document.getElementById('followBtn');
    if (!btn) return;
    btn.disabled = true;

    const isFollowing = btn.classList.contains('following');
    try {
      const followRef = db.collection('users').doc(currentUser.uid).collection('following').doc(product.sellerId);
      const batch = db.batch();

      if (isFollowing) {
        try { await followRef.delete(); } catch(e) {}
        batch.update(db.collection('users').doc(currentUser.uid), {
          following: firebase.firestore.FieldValue.arrayRemove(product.sellerId),
          followingCount: firebase.firestore.FieldValue.increment(-1)
        });
        batch.update(db.collection('users').doc(product.sellerId), {
          followersCount: firebase.firestore.FieldValue.increment(-1)
        });
        await batch.commit().catch(function(){});
        btn.classList.remove('following');
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Follow';
        showToast('Unfollowed', 'info');
      } else {
        try {
          await followRef.set({ followedAt: firebase.firestore.FieldValue.serverTimestamp() });
        } catch(e) {}
        batch.update(db.collection('users').doc(currentUser.uid), {
          following: firebase.firestore.FieldValue.arrayUnion(product.sellerId),
          followingCount: firebase.firestore.FieldValue.increment(1)
        });
        batch.update(db.collection('users').doc(product.sellerId), {
          followersCount: firebase.firestore.FieldValue.increment(1)
        });
        await batch.commit().catch(function(){});
        btn.classList.add('following');
        btn.innerHTML = '<i class="fas fa-user-check"></i> Following';
        showToast('✅ Now following ' + resolveDisplayName(sellerData) + '!', 'success');
      }
    } catch(e) {
      console.error('Follow error:', e);
      showToast('Error: ' + (e.message || 'try again'), 'error');
    }
    btn.disabled = false;
  };

  // ── Share ─────────────────────────────────────────────────────────────────────

  window.shareProduct = function(platform) {
    const url  = window.location.href;
    const text = 'Check out ' + (product ? product.name : 'this product') + ' on YAN-FLOWS!';
    const links = {
      whatsapp: 'https://wa.me/?text=' + encodeURIComponent(text + ' ' + url),
      twitter:  'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url),
      facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url)
    };
    if (links[platform]) window.open(links[platform], '_blank', 'width=600,height=400');
  };

  window.copyLink = function() {
    navigator.clipboard.writeText(window.location.href)
      .then(function() { showToast('Link copied! 📋', 'success'); })
      .catch(function() { showToast('Could not copy', 'error'); });
  };

  // ── WhatsApp seller ────────────────────────────────────────────────────────────

  window.contactSeller = function() {
    const wa = sellerData ? (sellerData.whatsapp || sellerData.phone || '') : '';
    if (!wa) { showToast('Seller has no WhatsApp contact', 'error'); return; }
    const num  = wa.replace(/\D/g, '');
    const text = encodeURIComponent('Hi, I\'m interested in: ' + (product ? product.name : 'your product'));
    window.open('https://wa.me/' + num + '?text=' + text, '_blank');
  };

  // ── Navigation ───────────────────────────────────────────────────────────────

  window.goToStore = function() {
    if (product && product.sellerId) window.location.href = 'storefront.html?id=' + product.sellerId;
  };

  // ── Related Products ──────────────────────────────────────────────────────────

  async function loadRelatedProducts() {
    const grid = document.getElementById('relatedGrid');
    if (!grid) return;
    try {
      const snap = await db.collection('products').orderBy('createdAt', 'desc').limit(20).get();
      const related = snap.docs
        .map(function(d) { return Object.assign({ id: d.id }, d.data()); })
        .filter(function(p) { return p.id !== productId; })
        .slice(0, 6);

      if (!related.length) {
        grid.innerHTML = '<p style="color:var(--gray);">No related products found</p>';
        return;
      }
      grid.innerHTML = related.map(function(p) {
        return '<div class="related-card" onclick="window.location.href=\'product-detail.html?id=' + p.id + '\'">' +
          '<div class="related-image"><img src="' + (p.image || 'https://via.placeholder.com/150') + '" alt="' + (p.name||'') + '" onerror="this.src=\'https://via.placeholder.com/150?text=?\'"/></div>' +
          '<div class="related-name">' + (p.name || 'Product') + '</div>' +
          '<div class="related-price">' + formatCurrency(p.price) + '</div>' +
          '</div>';
      }).join('');
    } catch(e) {
      if (grid) grid.innerHTML = '<p style="color:var(--gray);">Could not load related products</p>';
    }
  }

  // ── Reviews ───────────────────────────────────────────────────────────────────

  async function loadReviews() {
    const list = document.getElementById('reviewList');
    if (!list) return;
    try {
      const snap = await db.collection('products').doc(productId)
        .collection('reviews').orderBy('createdAt', 'desc').limit(10).get();

      if (snap.empty) {
        list.innerHTML = '<p style="color:var(--gray);text-align:center;padding:1.5rem;">No reviews yet. Be the first to review!</p>';
        return;
      }

      list.innerHTML = snap.docs.map(function(d) {
        const r = d.data();
        const stars = '★'.repeat(r.rating || 0) + '☆'.repeat(5 - (r.rating || 0));
        let dateStr = '';
        try { dateStr = (r.createdAt && r.createdAt.toDate) ? r.createdAt.toDate().toLocaleDateString() : ''; } catch(e) {}
        return '<div class="review-item">' +
          '<div class="review-header">' +
            '<div class="reviewer-avatar">' +
              (r.userAvatar
                ? '<img src="' + r.userAvatar + '" alt=""/>'
                : '<i class="fas fa-user" style="color:var(--gray);"></i>') +
            '</div>' +
            '<div style="flex:1;">' +
              '<div class="reviewer-name">' + (r.userName || 'Anonymous') + '</div>' +
              '<div class="reviewer-date">' + dateStr + '</div>' +
            '</div>' +
            '<div class="review-rating">' + stars + '</div>' +
          '</div>' +
          '<p class="review-text">' + (r.comment || '') + '</p>' +
          '</div>';
      }).join('');
    } catch(e) {
      if (list) list.innerHTML = '<p style="color:var(--gray);text-align:center;padding:1.5rem;">Reviews unavailable</p>';
    }
  }

  // ── Error Screen ──────────────────────────────────────────────────────────────

  function showError(msg) {
    document.getElementById('mainContent').innerHTML =
      '<div style="grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--gray);">' +
        '<i class="fas fa-exclamation-triangle" style="font-size:4rem;color:var(--coral);margin-bottom:1.5rem;"></i>' +
        '<h2 style="color:var(--navy);margin-bottom:0.75rem;">Product not found</h2>' +
        '<p style="margin-bottom:2rem;">' + msg + '</p>' +
        '<a href="dashboard.html" style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.875rem 1.5rem;background:var(--navy);color:white;text-decoration:none;border-radius:8px;font-weight:700;">' +
        '<i class="fas fa-arrow-left"></i> Back to Feed</a>' +
      '</div>';
  }
</script>
</body>
</html>
